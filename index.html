<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>리듬 하우스 · 연습실 예약</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1A2A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="리듬 하우스">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
@font-face{font-family:'Cafe24 Lovingu';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround Air';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff') format('woff');}

:root{
  --ground:#0B1A2A; --surf:#13283E; --surf2:#1B3350; --deep:#101F31;
  --line:#27425F; --line-soft:#1B3148;
  --cream:#F3E7D2; --dim:#9FB3C8; --mute:#7E96AD;
  --red:#C8463A; --red-l:#E8705F;
  --black-room:#5C82AD; --white-room:#E3CFA6;
  --f-logo:'Cafe24 Lovingu','Gothic A1',cursive;
  --f-head:'Cafe24 Ssurround','Gothic A1',sans-serif;
  --f-body:'Cafe24 Ssurround Air','Gothic A1',sans-serif;

  /* 폰의 시계·배터리 표시줄과 홈 바를 피하기 위한 여백.
     홈 화면에 설치해 전체화면으로 열었을 때만 값이 생긴다. */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);

  --maxw: 520px;   /* 화면 폭에 따라 아래 미디어 쿼리에서 넓어진다 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ground);color:var(--cream);font-family:var(--f-body);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select{background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:0 14px;height:48px;color:var(--cream);width:100%}
input:focus,select:focus{outline:none;border-color:var(--black-room)}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:8px}
.hide{display:none !important}

/* ---------- 레이아웃 ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--ground);position:relative}
@media(min-width:560px){
  body{background:#07121D}
  .wrap{box-shadow:0 0 70px rgba(0,0,0,.55)}
}
@media(min-width:680px){ :root{ --maxw:720px } }   /* 아이패드 세로 */
.topbar{height:calc(58px + var(--sat));flex-shrink:0;display:flex;align-items:center;gap:9px;
  padding:var(--sat) calc(18px + var(--sar)) 0 calc(18px + var(--sal));
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;
  background:rgba(11,26,42,.92);backdrop-filter:blur(10px);z-index:20}
.topbar img{width:28px;height:29px;object-fit:contain}
.wordmark{font-family:var(--f-logo);font-size:21px;line-height:1}
.spacer{flex:1}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);
  color:var(--dim);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--red);border-color:var(--red);color:#FFF6EC}
.main{flex:1;padding:18px calc(18px + var(--sar)) calc(92px + var(--sab)) calc(18px + var(--sal))}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:var(--maxw);margin:0 auto;
  height:calc(72px + var(--sab));
  border-top:1px solid var(--line-soft);background:#0A1725;display:flex;align-items:flex-start;
  padding:0 calc(6px + var(--sar)) var(--sab) calc(6px + var(--sal));z-index:20}
.nav button{flex:1;height:72px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--mute);font-size:11px;padding:6px 0}
.nav button.on{color:var(--cream)}

/* ---------- 카드 ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.flat{background:var(--deep)}
.sec{font-size:13px;color:var(--dim);margin:20px 0 10px;display:flex;
  align-items:center;justify-content:space-between}
.h1{font-family:var(--f-head);font-size:21px;line-height:1.45}
.big{font-family:var(--f-head);font-size:44px;line-height:1}
.num{font-family:var(--f-head)}
.sub{font-size:12px;color:var(--dim)}
.muted{color:var(--mute)}
.gold{color:var(--white-room)}
.rose{color:var(--red-l)}
.bar{height:7px;border-radius:4px;background:var(--ground);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--red)}
.cta{height:56px;border-radius:14px;background:var(--red);color:#FFF6EC;
  font-family:var(--f-head);font-size:17px;width:100%;display:flex;
  align-items:center;justify-content:center;gap:8px}
.cta[disabled]{background:var(--surf2);color:var(--mute)}
.cta.google{background:#FFFFFF;color:#1F2A36;gap:11px}
.cta.google[disabled]{background:#9AA7B4;color:#4A5663}
.linkbtn{height:38px;color:var(--dim);font-size:13px;text-decoration:underline;
  text-underline-offset:3px;width:100%}
.btn{height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--red);border-color:var(--red);color:#FFF6EC}
.btn.sm{height:34px;padding:0 11px;font-size:12px;border-radius:9px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.empty{padding:34px 0;text-align:center;color:var(--mute);font-size:13px}

/* ---------- 예약 ---------- */
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;width:52px;height:56px;border-radius:12px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim)}
.dates button .d{font-family:var(--f-head);font-size:16px}
.dates button .w{font-size:11px;opacity:.85}
.dates button.on{background:var(--cream);border-color:var(--cream);color:#0B1A2A}
.rooms{display:flex;gap:9px}
.rooms button{flex:1;height:46px;border-radius:11px;border:1px solid var(--line);color:var(--dim);font-size:14px}
.rooms button.on[data-r="black"]{background:#3E5F82;border-color:var(--black-room);color:var(--cream)}
.rooms button.on[data-r="white"]{background:var(--white-room);border-color:var(--white-room);color:#0B1A2A}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:54px;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream)}
.slot .hr{font-family:var(--f-head);font-size:16px;line-height:1}
.slot .st{font-size:9px;opacity:.8}
.slot.taken{background:#0D1826;border-color:#1A2A3C;color:#5E7389}
.slot.mine{background:var(--red);border-color:var(--red);color:#FFF6EC}
.slot.lesson{background:#2B2518;border-color:#8A7442;color:#E3CFA6}
.slot.blocked{background:transparent;border-style:dashed;border-color:#3A5570;color:var(--mute)}
.slot.past{background:transparent;border-color:var(--line-soft);color:#4C637B;cursor:not-allowed}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--dim)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- 달력 ---------- */
.cal{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calnav .m{flex:1;text-align:center;font-family:var(--f-head);font-size:17px}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:5px}
.caldow span{text-align:center;font-size:11px;color:var(--mute);padding:3px 0}
.caldow span:first-child{color:#C87A72}
.caldow span:last-child{color:#7FA3CC}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calcell{min-height:46px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;background:transparent;
  color:var(--cream);font-size:14px;border:1px solid transparent;padding:5px 0}
.calcell.out{color:#33475C}
.calcell.off{color:#4C637B}
.calcell.has{background:var(--surf)}
.calcell.today{border-color:#3E5F82}
.calcell.on{background:var(--red);color:#FFF6EC;border-color:var(--red)}
.calcell .dots{display:flex;gap:3px;height:6px;align-items:center}
.calcell .dots i{width:6px;height:6px;border-radius:50%;display:block}
/* 선택된 날은 배경이 빨개서 같은 색 점이 묻힌다 — 밝게 바꾼다 */
.calcell.on .dots i{background:#FFE9E3 !important;box-shadow:none}

/* ---------- 두 연습실 나란히 ---------- */
.rooms2{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px;align-items:center}
.rooms2 .rh{height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-family:var(--f-head)}
.rooms2 .hr{font-size:11px;color:var(--mute);text-align:right;padding-right:5px}
.cell2{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--cream);
  width:100%;padding:0 4px;text-align:center;line-height:1.3}
.cell2.taken{background:#0D1826;border-color:#1A2A3C;color:#5E7389}
.cell2.mine{background:var(--red);border-color:var(--red);color:#FFF6EC}
.cell2.lesson{background:#2B2518;border-color:#8A7442;color:#E3CFA6}
.cell2.blocked{background:transparent;border-style:dashed;border-color:#3A5570;color:var(--mute)}
.cell2.past{background:transparent;border-color:var(--line-soft);color:#44596E}
.verline{text-align:center;font-size:10px;color:#3E5168;padding:18px 0 4px;letter-spacing:.5px}

/* ---------- 날짜별 / 주간 전환 ---------- */
.modes{display:flex;gap:5px;background:var(--surf);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin-top:14px}
.modes button{flex:1;height:38px;border-radius:9px;font-size:13px;color:var(--dim)}
.modes button.on{background:var(--surf2);color:var(--cream)}

/* ---------- 주간 한눈에 ---------- */
.wk{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--deep)}
.wkhead{display:flex;background:var(--surf);border-bottom:1px solid var(--line)}
.wkhead .corner{width:36px;flex:none;border-right:1px solid var(--line)}
.wkhead .cell{flex:1;min-width:0;text-align:center;padding:7px 0;font-size:10px;color:var(--dim)}
.wkhead .cell b{display:block;font-family:var(--f-head);font-size:15px;color:var(--cream);margin-top:1px}
.wkhead .cell.on{background:var(--surf2)}
.wkhead .cell .rooms{display:flex;gap:2px;margin-top:5px;padding:0 3px}
.wkhead .cell .rooms i{flex:1;height:4px;border-radius:2px;display:block}
.wkhead .cell.on b{color:var(--red-l)}
.wkbody{display:flex;max-height:min(56vh,520px);overflow-y:auto;scrollbar-width:thin}
.wkhours{width:36px;flex:none;border-right:1px solid var(--line)}
.wkhours div{height:22px;line-height:22px;font-size:9px;color:var(--mute);text-align:right;padding-right:5px}
.wkcols{flex:1;display:flex;min-width:0}
.wkcol{flex:1;min-width:0;border-right:1px solid var(--line-soft)}
.wkcol:last-child{border-right:0}
.wkcol.today{background:rgba(200,70,58,.05)}
.wkrow{height:22px;display:flex;gap:2px;padding:2px 3px;border-bottom:1px solid #16263A;width:100%}
.wc{flex:1;min-width:0;display:block;border-radius:3px;background:#17293C}
/* 칸마다 왼쪽 모서리에 연습실 색을 남겨 어느 칸이 어느 방인지 늘 보이게 한다 */
.wc.rb{box-shadow:inset 2px 0 0 rgba(92,130,173,.85)}
.wc.rw{box-shadow:inset 2px 0 0 rgba(227,207,166,.75)}
.wc.past{background:#101B27}
.wc.taken{background:#3A5A80}
.wc.mine{background:var(--red)}
.wc.lesson{background:#8A7442}
.wc.block{background:#101C29;border:1px dashed #334B66}
.wklegend{display:flex;gap:11px;flex-wrap:wrap;margin-top:11px}
.wklegend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--dim)}
.wklegend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- 회원 카드 · 레슨 기록 ---------- */
.memcard{display:block;width:100%;text-align:left;margin-bottom:11px;cursor:pointer}
.memcard:active{background:var(--surf2)}
.chip.paid{background:#1C3326;border-color:#2F5A3E;color:#9FD2A8}
.chip.free{background:#1B2A3C;border-color:#2E4661;color:#8FB0D4}
.chip.unpaid{border-color:#5A2A26;color:var(--red-l)}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 12px;border-radius:11px;background:var(--deep);border:1px solid var(--line-soft);
  margin-bottom:7px;color:var(--cream)}
.lrow .d{flex:1;font-size:14px}
.lrow .n{font-size:11px;color:var(--mute)}
.lrow .go{font-size:11px;color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:3px 8px}
textarea{background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;color:var(--cream);width:100%;font-family:inherit;font-size:15px;
  line-height:1.6;resize:vertical}
textarea:focus{outline:none;border-color:var(--black-room)}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--dim);
  line-height:1.6;cursor:pointer}
.chk input{width:18px;height:18px;flex-shrink:0;margin-top:1px;accent-color:var(--red)}

.stepper{display:flex;align-items:center;gap:2px;background:var(--deep);
  border:1px solid var(--line);border-radius:12px;padding:3px}
.stepper button{width:40px;height:38px;border-radius:9px;font-size:18px;
  color:var(--cream);background:var(--surf2)}
.stepper button:active{background:var(--red)}
.stepper b{font-family:var(--f-head);font-size:19px;min-width:46px;text-align:center;
  font-weight:400}

/* ---------- 안내 배너 ---------- */
.notice{border-radius:13px;padding:14px 16px;background:#3A1A16;border:1px solid #6B2E26;
  color:#F2BDB3;font-size:13px;line-height:1.65;margin-top:13px}
.notice b{font-family:var(--f-head);color:#FFD7CE}

/* ---------- 태블릿 가로 · PC ---------- */
@media(min-width:900px){
  :root{ --maxw:1000px }
  .main{padding:24px 26px calc(104px + var(--sab))}
  .grid{grid-template-columns:repeat(8,minmax(0,1fr))}
  .slot{height:60px}
  .slot .hr{font-size:18px}
  .slot .st{font-size:10px}
  .wkhead .cell{font-size:11px;padding:9px 0}
  .wkrow,.wkhours div{height:26px}
  .wkhours div{line-height:26px;font-size:10px}
  .wkbody{max-height:min(60vh,620px)}
  .tl .ev div:first-child{font-size:13px}
}
@media(min-width:1280px){
  :root{ --maxw:1240px }
  .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
  .wkrow,.wkhours div{height:30px}
  .wkhours div{line-height:30px}
}

/* ---------- 데스크톱 : 아래 막대 대신 왼쪽 세로 메뉴 ----------
   1100px부터는 화면을 가로로 넓게 쓴다. 메뉴가 왼쪽으로 가고
   본문은 남은 폭을 전부 쓰되, 글줄이 너무 길어지지 않게 한계를 둔다. */
@media(min-width:1100px){
  #scApp{max-width:none;box-shadow:none;padding-left:232px}
  #scApp .topbar{padding-left:28px;padding-right:calc(28px + var(--sar))}
  #scApp .topbar img,#scApp .topbar .wordmark{display:none}
  #scApp .main{padding:26px 34px 40px;max-width:1580px;width:100%}
  #scApp .nav{top:0;bottom:0;right:auto;left:0;width:232px;height:auto;max-width:none;
    margin:0;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;
    border-top:0;border-right:1px solid var(--line);background:#09151F;
    padding:calc(20px + var(--sat)) 16px 20px calc(16px + var(--sal))}
  #scApp .nav button{flex:none;width:100%;height:50px;flex-direction:row;gap:13px;
    justify-content:flex-start;padding:0 14px;border-radius:13px;font-size:14.5px}
  #scApp .nav button span{font-size:14.5px}
  #scApp .nav button.on{background:var(--surf2);color:var(--cream)}
  #scApp .nav button:hover{color:var(--cream)}
  .navbrand{display:flex !important;align-items:center;gap:10px;
    padding:4px 14px 22px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
  .navbrand img{width:30px;height:31px;object-fit:contain}
  .navbrand .wordmark{font-size:22px}
  .toast{left:calc(232px + (100% - 232px)/2);bottom:34px}
  .overlay{padding-left:calc(232px + 22px)}

  #scApp .modes{max-width:620px}
  .navbrand .wordmark{white-space:nowrap;font-size:20px}

  /* 두 칸 배치 — 달력·목록을 나란히 */
  .cols{display:grid;grid-template-columns:390px minmax(0,1fr);gap:24px;align-items:start}
  .cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols > *{min-width:0}
  .cols .sec:first-child{margin-top:0}
  .statgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .bars{height:190px}
  .cbar b{font-size:12px}
  .cbar span{font-size:11px}
}
@media(min-width:1500px){
  .cols{grid-template-columns:440px minmax(0,1fr)}
}
.navbrand{display:none}

/* ---------- 통계 ---------- */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.statbox{background:var(--surf);border:1px solid var(--line);border-radius:16px;
  padding:15px 14px;min-width:0}
.statbox .n{font-family:var(--f-head);font-size:26px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statbox .n small{font-size:14px;color:var(--dim);margin-left:2px}
.statbox .l{font-size:11.5px;color:var(--dim);margin-top:6px}

.chart{background:var(--deep);border:1px solid var(--line-soft);border-radius:16px;
  padding:16px 14px 12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:138px}
.cbar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end}
.cbar i{display:block;width:100%;max-width:var(--bw,38px);min-height:3px;
  border-radius:5px 5px 2px 2px;background:var(--black-room)}
.cbar i.z{background:#14263A}
.cbar i.hot{background:var(--red)}
.cbar i.gold{background:var(--white-room)}

/* ===================== 설정 ===================== */

function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function pad(n){ return String(n).padStart(2,'0'); }
function dow(d){ return ['일','월','화','수','목','금','토'][d.getDay()]; }
function fmtDate(s){ const d=parseYmd(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+dow(d)+')'; }
function slotTime(dateStr, hour){ const d=parseYmd(dateStr); d.setHours(hour,0,0,0); return d; }

function shiftMonth(ds, n){
  const d = parseYmd(ds || ymd(new Date()));
  return ymd(new Date(d.getFullYear(), d.getMonth()+n, 1));
}

  const d = parseYmd(s), w = d.getDay();      // 0=일요일

}

function newMid(){
  const s = 'abcdefghijkmnpqrstuvwxyz23456789';
  let out = '';
  const buf = new Uint8Array(16);
  crypto.getRandomValues(buf);
  buf.forEach(n=>{ out += s[n % s.length]; });
  return out;
}

/**
 * 예약 문서에는 회원 이름도 이메일도 저장하지 않는다 (회원끼리 서로를 알 수 없도록).
 * 관리자 화면에서만 회원 목록에서 이름을 찾아 보여준다.
 * memberName은 예전 버전으로 만들어진 예약을 위한 대비책이다.
 */
function nameOf(b){
  if(!b) return '';
  if(b.kind === 'block') return '차단';
  if(b.memberId && ME && b.memberId === myMid()) return (ME.name || '나');
  const m = members.find(x=> (x.mid || x.key) === b.memberId);
  return (m && m.name) || b.memberName || '예약';
}

/**
 * 이 예약이 연습권을 쓴 것인가.
 * 레슨, 레슨 뒤 확보 시간, 관리자가 서비스로 넣어준 자리는 쓰지 않는다.
 * usesCredit이 없는 예전 예약은 '관리자가 넣었으면 안 쓴 것'으로 본다.
 */
function usesCredit(b){
  if(!b || b.kind !== 'practice') return false;
  if(typeof b.usesCredit === 'boolean') return b.usesCredit;
  return !b.addedByAdmin;
}

/**
 * 이번 주기에 쓴 시간 — 따로 저장하지 않고 예약에서 센다.
 * 지나간 예약만 세므로, 예약만 해두고 아직 오지 않은 시간은 들어가지 않는다.
 */
function usedInCycle(m, list){
  if(!m) return 0;
  const from = m.cycleStart || m.expiresAt || '';
  const now = new Date();
  // 연습권을 쓴 예약만 센다 — 서비스로 준 자리는 주간 할당량과 무관하다
  return (list||[]).filter(b=>
    usesCredit(b) && (!from || b.date >= from) && slotTime(b.date,b.hour) < now
  ).length;
}

/** 유효기간이 지난 연습권은 0으로 본다 */
function liveCredits(m){
  if(!m) return 0;
  if(m.expiresAt && m.expiresAt < ymd(new Date())) return 0;
  return m.credits || 0;
}
function creditExpired(m){
  return !!(m && m.expiresAt && m.expiresAt < ymd(new Date()) && (m.credits||0) > 0);
}

/** 홈 화면에 설치된 앱으로 열렸는지 */
function standalone(){
  return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
}

function googleLogin(){
  if(inAppName()){ showInAppGuide(true); return; }
  const btn = document.getElementById('btnGoogle');
  btn.disabled = true;
  // 누른 즉시 연다 — 앞에 await를 두지 않는다
  signInWithPopup(auth, googleProvider)
    .catch(e=>{
      const c = e.code || '';
      if(c.includes('popup-closed') || c.includes('cancelled-popup')) return;   // 사용자가 닫음
      if(c.includes('account-exists-with-different-credential')){
        toast('같은 주소의 다른 로그인 방식이 있어요'); return;
      }
      if(c.includes('network')){ toast('인터넷 연결을 확인해 주세요'); return; }
      // 팝업이 아예 막힌 기기에서는 같은 창에서 처리한다
      try{ sessionStorage.setItem('rh-redirect','1'); }catch(_){}
      signInWithRedirect(auth, googleProvider)
        .catch(()=> toast('구글 로그인을 열 수 없어요 · '+(c||'알 수 없는 오류')));
    })
    .finally(()=>{ btn.disabled = false; });
}

// 리다이렉트로 돌아온 경우 처리
getRedirectResult(auth)
  .then(res=>{ if(res) { try{ sessionStorage.removeItem('rh-redirect'); }catch(_){} } })
  .catch(e=>{
    try{ sessionStorage.removeItem('rh-redirect'); }catch(_){}
    const c = e.code || '';
    if(c && !c.includes('no-auth-event')) toast('구글 로그인 실패 · '+c);
  });

/**
 * 같은 창 방식으로 다녀왔는데 로그인이 안 된 채 돌아온 경우를 알려준다.
 * 조용히 로그인 화면으로 되돌아가면 왜 안 되는지 알 수가 없다.
 */
function warnRedirectFailed(){
  let flag = null;
  try{ flag = sessionStorage.getItem('rh-redirect'); }catch(_){}
  if(!flag) return;
  try{ sessionStorage.removeItem('rh-redirect'); }catch(_){}
  setTimeout(()=> info({
    title:'로그인이 끝나지 않았어요',
    body:'구글 인증은 됐는데 앱으로 돌아오면서 끊겼습니다.<br><br>'+
         '<b>사파리(인터넷 브라우저)에서 주소를 직접 열어</b> 로그인해 보세요.<br>'+
         '홈 화면 아이콘으로 여는 앱에서는 이 방식이 막히는 기기가 있습니다.'
  }), 400);
}

onAuthStateChanged(auth, async (user)=>{
  [unsubDay, unsubWeek, unsubMine, unsubMe, unsubMembers,
   unsubMyLessons, unsubMbLessons, unsubMbBookings, unsubAllLessons,
   unsubMon, unsubConfig, unsubParkMine, unsubParkDay,
   unsubAct, unsubParkMon, unsubPresence, unsubNotices].forEach(u=>{ if(u) u(); });
  unsubNotices = null;
  unsubConfig = unsubParkMine = unsubParkDay = null;
  unsubAct = unsubParkMon = unsubPresence = null;
  if(beatTimer){ clearInterval(beatTimer); beatTimer = null; }
  unsubDay = unsubWeek = unsubMine = unsubMe = unsubMembers = null;
  unsubMyLessons = unsubMbLessons = unsubMbBookings = unsubAllLessons = unsubMon = null;

  if(!user){ ME=null; show('scLogin'); warnRedirectFailed(); return; }

  // 회원 문서의 이름(ID)은 소문자로 바꾼 이메일이다. 구글 계정이 곧 열쇠다.
  const key = (user.email || '').trim().toLowerCase();
  let snap;
  if(!key){ toast('이메일을 확인할 수 없는 계정이에요'); signOut(auth); return; }
  try{ snap = await getDoc(doc(db,'members',key)); }
  catch(e){ toast('회원 정보를 불러오지 못했어요'); show('scLogin'); return; }

  if(!snap.exists() || snap.data().active === false){
    document.getElementById('pdEmail').textContent = user.email || '—';
    show('scPending');
    return;
  }

  ME = { key, uid:user.uid, ...snap.data() };

  // 관리자 문서에 내부 식별자가 없으면 한 번만 만들어 둔다 (손으로 넣을 필요 없게)
  if(ME.role === 'admin' && !ME.mid){
    const mid = newMid();
    try{ await updateDoc(doc(db,'members',key), { mid }); ME.mid = mid; }catch(_){}
  }

  show('scApp');
  document.getElementById('tagAdmin').classList.toggle('hide', !isAdmin());
  buildNav();
  if(isAdmin()) subscribeMembers();   // 예약 추가 모달에서 회원 목록이 필요
  weekStart = startOfWeek(ymd(new Date()));
  calMonth  = ymd(new Date());
  subscribeMonth();
  subscribeWeek();                    // 주간 보기 + 홈의 종료 임박 안내에 쓰인다
  go(isAdmin() ? 'today' : 'home');

  // 내 정보 실시간 구독 (연습권 변화 즉시 반영)
  unsubMe = onSnapshot(doc(db,'members',key), s=>{
    if(!s.exists()) return;
    ME = { key, uid:user.uid, ...s.data() };
    render();
  });
  // 내 레슨 완료 기록 (이번 달 몇 회 했는지 보여주려고)
  unsubMyLessons = onSnapshot(
    query(collection(db,'lessons'), where('memberId','==', ME.mid || key)),
    s=>{ myLessons = s.docs.map(d=>({ id:d.id, ...d.data() })).sort(byLessonDate); render(); },
    ()=>{}
  );
  // 로그인 기록 (창 하나에 한 번) + 접속 중 신호
  logLoginOnce();
  beat();
  beatTimer = setInterval(beat, 60000);
  // 앱 설정 — 주차 중계 서버 주소
  // 안내 항목 — 회원 홈 맨 위 서랍
  unsubNotices = onSnapshot(doc(db,'config','notices'),
    s=>{ notices = (s.exists() && Array.isArray(s.data().items)) ? s.data().items : []; render(); },
    ()=>{});
  unsubConfig = onSnapshot(doc(db,'config','app'),
    s=>{ parkingUrl = (s.exists() && s.data().parkingUrl) || ''; render(); },
    ()=>{});
  // 오늘 내 주차 등록 기록
  unsubParkMine = onSnapshot(
    query(collection(db,'parkingLogs'), where('memberKey','==', key), where('day','==', ymd(new Date()))),
    s=>{ parkMine = s.docs.map(d=>({ id:d.id, ...d.data() })); render(); },
    ()=>{});
  // 내 예약 실시간 구독 — 예약에는 이메일이 아니라 내부 식별자(mid)만 쓴다
  unsubMine = onSnapshot(
    query(collection(db,'bookings'), where('memberId','==', ME.mid || key)),
    s=>{
      myBookings = s.docs.map(d=>({ id:d.id, ...d.data() }))
        .sort((a,b)=> (a.date+pad(a.hour)).localeCompare(b.date+pad(b.hour)));
      render();
    });
});

const LESSON_MIN = 30;   // 레슨 기본 길이(분)

/** 'HH:MM' → 분 */
function toMin(t){
  const [h,m] = String(t||'0:0').split(':').map(Number);
  return (h||0)*60 + (m||0);
}
/** 분 → 'HH:MM' (하루를 넘으면 다음 날로 돌아간다) */
function toHM(min){
  const m = ((min % 1440) + 1440) % 1440;
  return pad(Math.floor(m/60))+':'+pad(m%60);
}
/** 예약 한 건의 시각 표시 — 레슨은 '09:00 ~ 09:30' 처럼 길이까지 */
function timeText(b){
  if(!b) return '';
  if(b.kind === 'lesson'){
    const st = b.lessonAt || (pad(b.hour)+':00');
    return st+' ~ '+toHM(toMin(st) + (b.durMin || LESSON_MIN));
  }
  return pad(b.hour)+':00 – '+pad((b.hour+1)%24)+':00';
}

/** 레슨 기록을 날짜·시각 순으로 */
function byLessonDate(a,b){
  return ((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''));
}
/**
 * 레슨은 달력이 아니라 '기수'로 묶는다.
 * 4회가 한 기수이고, 4회를 채우면 다음 레슨부터 새 기수가 열린다.
 * 한 주 밀리든 두 주 밀리든 달이 바뀌어도 어긋나지 않는다.
 */
function termsOf(list){
  const map = {};
  (list||[]).forEach(x=>{
    const t = Number(x.term) || 0;      // 0 = 아직 기수가 매겨지지 않은 기록
    (map[t] = map[t] || []).push(x);
  });
  Object.keys(map).forEach(k=> map[k].sort(byLessonDate));
  return map;
}
/** 아직 다 안 찬 기수 번호. 다 찼으면 다음 번호. */
function openTerm(list, quota){
  const map = termsOf(list);
  const nums = Object.keys(map).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
  if(!nums.length) return 1;
  const last = nums[nums.length-1];
  return map[last].length >= (quota||LESSON_QUOTA) ? last+1 : last;
}
/** 그 기수의 레슨만 */
function lessonsInTerm(list, term){
  return (list||[]).filter(x=> (Number(x.term)||0) === Number(term)).sort(byLessonDate);
}
/** '10/2 ~ 10/23' */
function termRange(list){
  if(!list || !list.length) return '';
  const f = d => Number((d||'').slice(5,7))+'/'+Number((d||'').slice(8,10));
  const a = list[0].date, b = list[list.length-1].date;
  return a===b ? f(a) : f(a)+' ~ '+f(b);
}
function termLabel(t){ return Number(t)>0 ? t+'기' : '기수 없음'; }
/** 기수를 고르는 드롭다운 — 앞뒤 두 기수씩 */
function termOptions(sel){
  const n = Number(sel)||1;
  const out = [];
  for(let t=Math.max(1,n-2); t<=n+1; t++) out.push(t);
  return out.map(t=>'<option value="'+t+'"'+(t===n?' selected':'')+'>'+
    t+'기'+(t===n?' (지금 기수)':'')+'</option>').join('');
}
function monthKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }

/** (관리자) 한 회원의 레슨 기록과 예약을 통째로 구독한다 */
function subscribeMember(mid){
  if(unsubMbLessons)  unsubMbLessons();
  if(unsubMbBookings) unsubMbBookings();
  mbLessons = []; mbBookings = [];
  unsubMbLessons = onSnapshot(
    query(collection(db,'lessons'), where('memberId','==',mid)),
    s=>{ mbLessons = s.docs.map(d=>({ id:d.id, ...d.data() })).sort(byLessonDate);
         if(page==='member') renderMemberDetail(); },
    ()=> toast('레슨 기록을 불러오지 못했어요')
  );
  unsubMbBookings = onSnapshot(
    query(collection(db,'bookings'), where('memberId','==',mid)),
    s=>{ mbBookings = s.docs.map(d=>({ id:d.id, ...d.data() }))
           .sort((a,b)=> (a.date+pad(a.hour)).localeCompare(b.date+pad(b.hour)));
         if(page==='member') renderMemberDetail(); },
    ()=> toast('예약을 불러오지 못했어요')
  );
}

/** 달력이 그리는 6주 범위를 통째로 구독한다 (관리자 달력에 모든 레슨을 띄우려고) */
function subscribeMonth(){
  if(unsubMon) unsubMon();
  const base  = parseYmd(calMonth || ymd(new Date()));
  const first = new Date(base.getFullYear(), base.getMonth(), 1);
  const a = ymd(addDays(first, -first.getDay()));
  const b = ymd(addDays(parseYmd(a), 41));
  unsubMon = onSnapshot(
    query(collection(db,'bookings'), where('date','>=',a), where('date','<=',b)),
    s=>{ monBookings = s.docs.map(d=>({ id:d.id, ...d.data() }));
         if(page==='book') renderBook(); },
    ()=>{}
  );
}

function subscribeMembers(){
  if(!isAdmin() || unsubMembers) return;
  // 이번 달 레슨 기록 전체 — 회원 목록에 'n / 4회'를 띄우는 데 쓴다
  // 기수를 세려면 지난 기록까지 있어야 해서 전체를 구독한다
  unsubAllLessons = onSnapshot(collection(db,'lessons'),
    s=>{ allLessons = s.docs.map(d=>d.data());
         if(page==='members') renderMembers(); },
    ()=>{}
  );
  unsubMembers = onSnapshot(collection(db,'members'), s=>{
    members = s.docs.map(d=>({ key:d.id, ...d.data() }))
      .sort((a,b)=> (a.name||'').localeCompare(b.name||'','ko'));
    if(page==='members') renderMembers();
  });
}

/**
 * 지금 연습 중이고, 끝나기 5분 안이며, 바로 다음 시간에 예약이 있을 때만 안내한다.
 * 뒤에 아무도 없으면 굳이 재촉하지 않는다.
 */
function endingSoonNotice(){
  const now = new Date();
  const cur = myBookings.find(b=>{
    const st = slotTime(b.date, b.hour).getTime();
    return now.getTime() >= st && now.getTime() < st + 3600000;
  });
  if(!cur) return '';
  const endAt = slotTime(cur.date, cur.hour).getTime() + 3600000;
  const leftMin = Math.max(0, Math.ceil((endAt - now.getTime())/60000));
  if(leftMin > 5) return '';
  const nextB = weekBookings.find(x=>
    x.roomId===cur.roomId && x.date===cur.date && x.hour===cur.hour+1 && x.kind!=='block');
  if(!nextB) return '';
  return '<div class="notice"><b>'+leftMin+'분 뒤 다음 연습이 시작돼요</b><br>'+
    pad(cur.hour+1)+':00 전에 정리하고 나와 주세요. 스틱과 개인 물품을 꼭 챙겨주세요.</div>';
}
function nextLessonText(){
  if(ME.lessonDay==null || !ME.lessonTime) return '일정 미등록';
  const names=['일','월','화','수','목','금','토'];
  return names[ME.lessonDay]+'요일 '+ME.lessonTime+' · 30분';
}
/** 관리자가 잡아둔 다음 레슨 (연습실 예약으로 들어온다) */

  return myBookings.find(b=> b.kind==='lesson' && slotTime(b.date,b.hour) >= now);
}

      '<div style="text-align:right;flex-shrink:0">'+
        '<div class="num gold" style="font-size:19px">'+done.length+' / '+quota+'</div>'+
        '<div class="sub muted" style="font-size:11px">'+term+'기 레슨</div>'+
      '</div>'+
    '</div>'+
    '<div class="row" style="gap:5px;margin-top:12px">'+dots.join('')+'</div>'+
    (done.length
      ? '<div class="sub muted" style="margin-top:9px;font-size:11px">'+
          '최근 '+esc(fmtDate(done[done.length-1].date))+
          (done[done.length-1].time ? ' '+esc(done[done.length-1].time) : '')+' 완료</div>'
      : '')+

/* ===================== 주간 한눈에 ===================== */
/**
 * 한 칸이 1시간, 칸 안의 왼쪽 막대가 블랙룸 · 오른쪽 막대가 화이트룸이다.
 * 회원 화면에서는 누구 예약인지 구분하지 않고 '예약됨'으로만 칠한다.
 */
function weekGrid(){
  const admin  = isAdmin();
  const todayS = ymd(new Date());
  const now = new Date();
  const days = [];
  for(let i=0;i<7;i++){
    const d = addDays(parseYmd(weekStart), i);
    days.push({ s:ymd(d), d:d.getDate(), w:dow(d) });
  }

  const head = '<div class="wkhead"><div class="corner"></div>'+
    days.map(x=>'<button class="cell'+(x.s===todayS?' on':'')+'" data-act="wkDay" data-d="'+x.s+'">'+
      x.w+'<b>'+x.d+'</b>'+
      '<span class="rooms">'+ROOMS.map(r=>'<i style="background:'+r.color+'"></i>').join('')+'</span>'+
    '</button>').join('')+'</div>';

  const hours = [];
  for(let h=0; h<24; h++) hours.push('<div>'+(h%2===0?pad(h):'')+'</div>');

  const cols = days.map(x=>{
    const rows = [];
    for(let h=0; h<24; h++){
      const segs = ROOMS.map((r,ri)=>{
        const b = weekBookings.find(y=>y.roomId===r.id && y.date===x.s && y.hour===h);
        let cls = 'wc ' + (ri===0 ? 'rb' : 'rw');
        if(b){
          const isMine = b.memberId === myMid();
          if(admin){
            if(b.kind==='block')       cls += ' block';
            else if(b.kind==='lesson') cls += ' lesson';
            else if(isMine)            cls += ' mine';
            else                       cls += ' taken';
          }
          // 회원에게는 내 것만 구분되고 나머지는 전부 한 가지 '사용 불가'다
          else if(isMine && b.kind==='practice') cls += ' mine';
          else if(isMine && b.kind==='lesson')   cls += ' lesson';
          else                                   cls += ' taken';
        } else if(slotTime(x.s,h) <= now) cls += ' past';
        return '<i class="'+cls+'"></i>';
      }).join('');
      rows.push('<button class="wkrow" data-act="wkDay" data-d="'+x.s+'">'+segs+'</button>');
    }
    return '<div class="wkcol'+(x.s===todayS?' today':'')+'">'+rows.join('')+'</div>';
  }).join('');

  return '<div class="wk">'+head+
    '<div class="wkbody"><div class="wkhours">'+hours.join('')+'</div>'+
    '<div class="wkcols">'+cols+'</div></div></div>'+
    '<div class="wklegend">'+
      '<span><i style="background:#17293C"></i>가능</span>'+
      '<span><i style="background:var(--red)"></i>내 예약</span>'+
      '<span><i style="background:#8A7442"></i>'+(admin?'레슨':'내 레슨')+'</span>'+
      '<span><i style="background:#3A5A80"></i>'+(admin?'예약됨':'사용 불가')+'</span>'+
      (admin ? '<span><i style="background:#101C29;border:1px dashed #334B66"></i>닫은 시간</span>' : '')+
    '</div>';
}
function weekNav(){
  const a = parseYmd(weekStart), b = addDays(a,6);
  const label = (a.getMonth()+1)+'월 '+a.getDate()+'일 – '+(b.getMonth()+1)+'월 '+b.getDate()+'일';
  return '<div class="row" style="margin-top:14px">'+
      '<button class="btn sm" data-act="wkShift" data-n="-1">‹</button>'+
      '<div style="flex:1;text-align:center" class="num">'+label+'</div>'+

    '</div>'+
    '<div class="sec"><span>'+ROOMS.map(r=>
        '<b style="color:'+r.color+';font-weight:400">'+r.name+'</b>').join(' · ')+'</span>'+

/**
 * 예약 화면 — 위는 달력, 아래는 그 날의 두 연습실 시간표.
 * 달력에는 내 예약·내 레슨·끝난 레슨이 점으로 찍혀서
 * "내가 언제 연습했고 다음 레슨이 언제인지"가 한눈에 들어온다.
 */
function bookDayHTML(){
  // 넓은 화면(1100px 이상)에서는 달력이 왼쪽, 그 날의 연습실이 오른쪽에 나란히 선다.
  // 좁은 화면에서는 .cols가 그냥 위아래로 쌓인다.
  return '<div class="cols">'+
    '<div>'+ calendarHTML() +'</div>'+
    '<div>'+ dayRoomsHTML() +'</div>'+
  '</div>';
}

function calendarHTML(){
  const base   = parseYmd(calMonth || ymd(new Date()));
  const y = base.getFullYear(), mo = base.getMonth();
  const first  = new Date(y, mo, 1);
  const start  = addDays(first, -first.getDay());   // 일요일 시작
  const todayS = ymd(new Date());
  const lastBookable = ymd(addDays(new Date(), BOOK_AHEAD_DAYS-1));
  const admin = isAdmin();

  const cells = [];
  for(let i=0;i<42;i++){
    const d  = addDays(start, i);
    const ds = ymd(d);
    if(i>=35 && d.getMonth()!==mo) break;      // 6주차가 비면 그리지 않는다

    // 관리자(강사)는 그 날의 '모든 레슨'이 자기 일정이다 — 가르치러 나가야 하니까
    const mineB   = myBookings.filter(b=>b.date===ds);
    const dayAll  = monBookings.filter(b=>b.date===ds);
    const hasBook = mineB.some(b=>b.kind==='practice');
    const hasLes  = admin ? dayAll.some(b=>b.kind==='lesson')
                          : mineB.some(b=>b.kind==='lesson');
    const doneLes = myLessons.some(x=>x.date===ds);

    let cls = 'calcell';
    if(d.getMonth()!==mo) cls += ' out';
    else if(!admin && (ds < todayS || ds > lastBookable)) cls += ' off';
    if(mineB.length || doneLes) cls += ' has';
    if(ds === todayS) cls += ' today';
    if(ds === selDate) cls += ' on';

    const dots = [];
    if(hasBook) dots.push('<i style="background:var(--red)"></i>');
    if(hasLes)  dots.push('<i style="background:#C9A961"></i>');
    if(doneLes && !hasLes) dots.push('<i style="background:#6B5B33"></i>');

    cells.push('<button class="'+cls+'" data-act="calPick" data-d="'+ds+'">'+
      '<span>'+d.getDate()+'</span>'+
      '<span class="dots">'+dots.join('')+'</span></button>');
  }

  return '<div class="cal" style="margin-top:14px">'+
      '<div class="calnav">'+
        '<button class="btn sm" data-act="calShift" data-n="-1">‹</button>'+
        '<div class="m">'+y+'년 '+(mo+1)+'월</div>'+
        '<button class="btn sm" data-act="calShift" data-n="1">›</button>'+
        '<button class="btn sm" data-act="calToday">오늘</button>'+
      '</div>'+
      '<div class="caldow">'+['일','월','화','수','목','금','토']
        .map(w=>'<span>'+w+'</span>').join('')+'</div>'+
      '<div class="calgrid">'+cells.join('')+'</div>'+
      '<div class="legend" style="margin:12px 0 0">'+
        '<span><i style="background:var(--red)"></i>내 예약</span>'+
        '<span><i style="background:#C9A961"></i>'+(admin?'레슨 일정':'예정된 레슨')+'</span>'+
        (admin ? '' : '<span><i style="background:#6B5B33"></i>끝난 레슨</span>')+
      '</div>'+
    '</div>';
}

function dayRoomsHTML(){
  const admin = isAdmin();
  const now = new Date();

  const rows = [];
  for(let h=0; h<24; h++){
    const tds = ROOMS.map(r=>{
      const b = dayBookings.find(x=> x.roomId===r.id && x.hour===h);
      const past = slotTime(selDate,h) <= now;
      let cls='cell2', st='가능', attr='';

      if(b){
        const isMine = b.memberId === myMid();
        if(admin){
          if(b.kind==='block'){       cls+=' blocked'; st='사용 불가'; }
          else if(b.kind==='lesson'){ cls+=' lesson';
            st = esc(nameOf(b))+' 레슨<br>'+timeText(b); }
          else if(isMine){            cls+=' mine';
            st = b.afterLesson ? '내 연습<br>레슨 뒤' : '내 예약'; }
          else {                      cls+=' taken';   st = esc(nameOf(b)); }
          attr = ' data-act="admCancel" data-id="'+b.id+'"';
        }
        else if(isMine && b.kind==='practice'){
          cls+=' mine';
          st = b.afterLesson ? '내 연습<br>레슨 뒤'
             : (usesCredit(b) ? '내 예약' : '내 예약<br>미차감');
          attr = b.afterLesson ? ' data-act="why" data-w="afterlesson"'
                               : ' data-act="cancel" data-id="'+b.id+'"';
        }
        else if(isMine && b.kind==='lesson'){
          cls+=' lesson'; st = '내 레슨<br>'+timeText(b);
          attr = ' data-act="why" data-w="mylesson"';
        }
        else {
          cls+=' taken'; st='사용 불가';
          attr = ' data-act="why" data-w="taken"';
        }
      }
      else if(past && !admin){ cls+=' past'; st='지난 시간'; }
      else { attr = ' data-act="book" data-h="'+h+'" data-r="'+r.id+'"'; }

      return '<button class="'+cls+'"'+attr+'>'+st+'</button>';
    }).join('');
    rows.push('<div class="hr">'+pad(h)+'</div>'+tds);
  }

  return '<div class="sec"><span>'+fmtDate(selDate)+'</span>'+
      '<span class="muted">1회 1시간</span></div>'+
    '<div class="rooms2">'+
      '<div></div>'+
      ROOMS.map(r=>'<div class="rh" style="background:'+r.fill+';color:'+r.ink+'">'+
        r.name+'</div>').join('')+
      rows.join('')+
    '</div>'+
    (admin
      ? '<div class="sub muted" style="margin-top:12px">빈 칸을 누르면 내 연습·레슨·회원 예약·차단을 고를 수 있어요.</div>'
      : '<div class="sub muted" style="margin-top:12px">회색 칸은 이미 찬 시간이에요. 누가 썼는지는 서로 보이지 않습니다.</div>');
}

/* ===================== 관리자 · 오늘 현황 ===================== */
function renderToday(){
  const modes =
    '<div class="modes" style="margin-top:0;margin-bottom:14px">'+
      '<button data-act="adminMode" data-m="day"  class="'+(adminMode==='day' ?'on':'')+'">하루 타임라인</button>'+
      '<button data-act="adminMode" data-m="week" class="'+(adminMode==='week'?'on':'')+'">주간 한눈에</button>'+
    '</div>';
  if(adminMode==='week'){
    document.getElementById('pgToday').innerHTML = modes + weekNav() + weekGrid();
    bind('pgToday');
    return;
  }

  // 넓고 높은 화면에서는 24시간이 스크롤 없이 한 화면에 들어오도록 칸을 줄인다
  const wide = window.innerWidth >= 1100;
  const HOUR_PX = wide
    ? Math.max(32, Math.min(44, Math.floor((window.innerHeight - 330) / 24)))
    : 40;
  const H = 24*HOUR_PX;
  const now = new Date();
  const isToday = selDate === ymd(now);
  const nowTop = (now.getHours()+now.getMinutes()/60) * HOUR_PX;

  const labels = [];
  for(let h=0; h<24; h+=2)
    labels.push('<div class="hlabel" style="top:'+(h*HOUR_PX-6)+'px">'+pad(h)+':00</div>');

  const tracks = ROOMS.map(r=>{
    const lines = [];
    for(let h=1; h<24; h++)
      lines.push('<div class="hline" style="top:'+(h*HOUR_PX)+'px"></div>');
    const evs = dayBookings.filter(b=>b.roomId===r.id).map(b=>{
      let bg, ink, bd, label;
      if(b.kind==='block'){
        bg='transparent'; ink='var(--mute)'; bd='1px dashed #3A5570'; label='사용 불가';
      } else if(b.kind==='lesson'){
        bg='#2B2518'; ink='#E3CFA6'; bd='1px solid #8A7442';
        label = nameOf(b)+' 레슨 '+timeText(b);
      } else {
        bg=r.fill; ink=r.ink; bd='0';
        label = nameOf(b) + (b.startAt ? ' · '+b.startAt+'~'+b.endAt : '');
      }
      return '<div class="ev" data-act="admCancel" data-id="'+b.id+'" style="top:'+(b.hour*HOUR_PX+3)+
        'px;height:'+(HOUR_PX-6)+'px;background:'+bg+';border:'+bd+';color:'+ink+'">'+
        (wide
          ? '<div class="row" style="gap:8px;align-items:baseline">'+
              '<div style="font-size:12.5px;line-height:1.25;white-space:nowrap;'+
                'overflow:hidden;text-overflow:ellipsis">'+esc(label)+'</div>'+
              '<div class="spacer"></div>'+
              '<div style="font-size:10px;opacity:.8">'+pad(b.hour)+':00</div></div>'
          : '<div style="font-size:12px;line-height:1.3">'+esc(label)+'</div>'+
            '<div style="font-size:10px;opacity:.8">'+pad(b.hour)+':00</div>')+
        '</div>';
    }).join('');
    const empties = [];
    for(let h=0; h<24; h++){
      if(!dayBookings.some(b=>b.roomId===r.id && b.hour===h))
        empties.push('<button class="cell" data-act="admSlot" data-r="'+r.id+'" data-h="'+h+'" style="top:'+
          (h*HOUR_PX+3)+'px;height:'+(HOUR_PX-6)+'px"></button>');
    }
    return '<div style="flex:1;min-width:0">'+
      '<div class="colhead" style="background:'+r.fill+';color:'+r.ink+'">'+r.name+'</div>'+
      '<div class="track" style="height:'+H+'px">'+lines.join('')+empties.join('')+evs+
        (isToday ? '<div class="now" style="top:'+nowTop+'px"></div>' : '')+
      '</div></div>';
  }).join('');

  const cnt = dayBookings.filter(b=>b.kind!=='block').length;
  const cb  = dayBookings.filter(b=>b.roomId==='black'&&b.kind!=='block').length;
  const cw  = dayBookings.filter(b=>b.roomId==='white'&&b.kind!=='block').length;

  document.getElementById('pgToday').innerHTML = modes +
    '<div class="row">'+
      '<button class="btn sm" data-act="dayShift" data-n="-1">‹</button>'+
      '<div style="flex:1;text-align:center" class="num">'+fmtDate(selDate)+'</div>'+
      '<button class="btn sm" data-act="dayShift" data-n="1">›</button>'+
      '<button class="btn sm" data-act="dayToday">오늘</button>'+
    '</div>'+
    '<div class="row" style="margin-top:12px;gap:9px">'+
      stat(cnt,'오늘 예약','')+ stat(cb,'블랙룸','#8FB0D4')+ stat(cw,'화이트룸','#E3CFA6')+
    '</div>'+
    '<div class="sec"><span>실시간 현황</span>'+
      (isToday?'<span class="rose">지금 '+pad(now.getHours())+':'+pad(now.getMinutes())+'</span>':'<span></span>')+'</div>'+
    '<div class="tl"><div class="axis" style="position:relative;height:'+H+'px;margin-top:30px">'+
      labels.join('')+'</div>'+tracks+'</div>'+
    '<div class="sub muted" style="margin-top:12px">빈 칸을 누르면 예약을 추가하거나 시간을 차단할 수 있어요.</div>'+
    parkDayHTML();

  bind('pgToday');
  // 현재 시각 근처로 한 번만 스크롤 (실시간 갱신마다 튀지 않도록)
  if(isToday && scrolledFor !== selDate){
    scrolledFor = selDate;
    window.scrollTo(0, Math.max(0, nowTop - 180));
  }
}

/* ===================== 주차 2시간 무료 등록 =====================
   앱은 차량번호만 중계 서버로 보낸다. 주차 사이트 아이디·비밀번호는
   중계 서버 안에만 있고, 이 파일 어디에도 없다.
   하루 횟수, 오늘 예약 여부, 번호판 일치 확인은 모두 서버가 한다. */

const PLATE_RE = /^([가-힣]{2})?\d{2,3}[가-힣]\d{4}$/;
function cleanPlate(v){ return String(v||'').replace(/[\s\-·.]/g,''); }
function savedPlate(){ try{ return localStorage.getItem('rh-plate') || ''; }catch(_){ return ''; } }
function rememberPlate(v){ try{ localStorage.setItem('rh-plate', v); }catch(_){} }
function parkLimit(m){ return (m && Number.isFinite(m.parkingDaily)) ? m.parkingDaily : 1; }
function hhmm(ts){
  const d = ts && ts.toDate ? ts.toDate() : null;
  return d ? pad(d.getHours())+':'+pad(d.getMinutes()) : '';
}

async function callParking(body){
  if(!parkingUrl) return { ok:false, message:'주차 연동 주소가 아직 설정되지 않았어요.' };
  let res;
  try{
    const token = await auth.currentUser.getIdToken();
    res = await fetch(parkingUrl, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify(body)
    });
  }catch(e){
    return { ok:false, message:'주차 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.' };
  }
  let j = null;
  try{ j = await res.json(); }catch(_){}
  if(!j || typeof j.ok !== 'boolean')
    j = { ok:false, message:'주차 서버가 응답하지 않아요 ('+res.status+'). 관리자에게 알려 주세요.' };
  return j;
}

/** 홈 화면 카드 */
function parkingCard(){
  if(!parkingUrl) return '';
  const limit = parkLimit(ME);
  if(limit <= 0 && !isAdmin()) return '';
  const done = parkMine.filter(l=> l.ok && !l.already)
                       .sort((a,b)=> (b.at&&b.at.seconds||0) - (a.at&&a.at.seconds||0));
  const today = ymd(new Date());
  const hasBooking = isAdmin() || myBookings.some(b=> b.date === today);
  const left = Math.max(0, limit - done.length);

  const doneRows = done.map(l=>
    '<div class="row" style="gap:8px;margin-top:9px">'+
      '<span class="chip paid" style="height:22px;font-size:11px">등록 완료</span>'+
      '<span class="num" style="font-size:15px">'+esc(l.plate)+'</span>'+
      '<div class="spacer"></div>'+
      '<span class="sub muted">'+(l.entryAt ? esc(l.entryAt.slice(11,16))+' 입차' : hhmm(l.at))+'</span>'+
    '</div>').join('');

  let action;
  if(!hasBooking)

               (done.length ? '다른 차 등록하기' : '주차 2시간 무료 등록')+'</button>';

    '<div class="row"><div class="sub">🚗 주차</div><div class="spacer"></div>'+
      '<div class="sub muted">하루 '+limit+'회 · 2시간 무료</div></div>'+

}

/* ===================== 활동 기록 · 접속 상태 =====================
   activity  — 로그인, 예약, 취소, 레슨 일정, 옮기기 (관리자만 읽는다)
   presence  — 앱을 열어 둔 사람이 1분마다 '나 여기 있어요'를 남긴다
   기록이 실패해도 예약 같은 본래 동작은 아무 영향을 받지 않는다. */

const PAGE_NAMES = { home:'홈', book:'예약', me:'내 정보', today:'현황', members:'회원',
                     member:'회원 상세', stats:'통계', monitor:'기록' };

/** 앱 안 브라우저(카카오톡 등) 이름. 일반 브라우저면 빈 문자열 */
function inAppName(){
  const u = navigator.userAgent || '';
  if(/KAKAOTALK/i.test(u)) return '카카오톡';
  if(/NAVER\(inapp|NAVER\//i.test(u)) return '네이버 앱';
  if(/DaumApps|DaumDevice/i.test(u)) return '다음 앱';
  if(/Instagram/i.test(u)) return '인스타그램';
  if(/FBAN|FBAV|FB_IAB/i.test(u)) return '페이스북';
  if(/\bLine\//i.test(u)) return '라인';
  if(/Band\//i.test(u)) return '밴드';
  if(/;\s?wv\)/.test(u)) return '앱 안 브라우저';
  return '';
}
function isIOS(){
  const u = navigator.userAgent || '';
  return /iPhone|iPad|iPod/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1);
}
function deviceName(){
  const u = navigator.userAgent || '';
  let d = /iPhone/.test(u) ? '아이폰'
        : (/iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) ? '아이패드'
        : /Android/.test(u) ? '안드로이드'
        : /Macintosh|Mac OS/.test(u) ? '맥'
        : /Windows/.test(u) ? '윈도우' : '기기';
  const ia = inAppName();
  d += standalone() ? ' · 홈 화면 앱' : (ia ? ' · '+ia : ' · 브라우저');
  return d;
}

function logAct(type, o){
  o = o || {};
  if(!ME) return;
  let target = '';
  if(o.mid){
    if(o.mid === myMid()) target = ME.name || '';
    else { const t = members.find(x=> (x.mid||x.key) === o.mid); target = (t && t.name) || ''; }
  }
  addDoc(collection(db,'activity'), {
    type,
    actorKey: ME.key, actorName: ME.name || '', actorRole: ME.role || 'member',
    targetName: target,
    roomId: o.roomId || '', date: o.date || '',
    hour: (o.hour == null ? null : o.hour), kind: o.kind || '',
    detail: o.detail || '', device: deviceName(),
    day: ymd(new Date()), at: serverTimestamp()
  }).catch(()=>{});
}
/** 같은 창에서는 로그인 기록을 한 번만 남긴다 (새로고침마다 쌓이지 않게) */
function logLoginOnce(){

/** 접속 중 신호. off=true면 '나감'으로 남긴다 */
function beat(off){
  if(!ME) return Promise.resolve();
  if(!off && document.visibilityState !== 'visible') return Promise.resolve();
  return setDoc(doc(db,'presence',ME.key), {
    key: ME.key, name: ME.name || '', role: ME.role || 'member', app:'app',
    device: deviceName(), page: PAGE_NAMES[page] || '', off: !!off, at: serverTimestamp()

/* ── 기록 화면 ── */
function subscribeMonitor(){
  if(!isAdmin()) return;
  if(unsubAct) unsubAct();
  if(unsubParkMon) unsubParkMon();
  unsubAct = onSnapshot(query(collection(db,'activity'), where('day','==', monDay)),
    s=>{ actDay = s.docs.map(d=>({ id:d.id, ...d.data() })); if(page==='monitor') renderMonitor(); },
    ()=>{ actDay = []; if(page==='monitor') renderMonitor(); });
  unsubParkMon = onSnapshot(query(collection(db,'parkingLogs'), where('day','==', monDay)),
    s=>{ parkMon = s.docs.map(d=>({ id:d.id, ...d.data() })); if(page==='monitor') renderMonitor(); },
    ()=>{});
  if(!unsubPresence){
    unsubPresence = onSnapshot(collection(db,'presence'),
      s=>{ presence = s.docs.map(d=>({ id:d.id, ...d.data() })); if(page==='monitor') renderMonitor(); },
      ()=>{});
  }
}
function tsMs(ts){ return ts && ts.toMillis ? ts.toMillis() : 0; }
function ago(ms){
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if(m < 1) return '방금';
  if(m < 60) return m+'분 전';
  const h = Math.floor(m/60);
  if(h < 24) return h+'시간 전';
  return Math.floor(h/24)+'일 전';
}
function slotText(x){
  if(!x.date) return '';
  const r = x.roomId ? roomOf(x.roomId).name+' ' : '';
  return r + fmtDate(x.date) + (x.hour != null ? ' '+pad(x.hour)+':00' : '');
}
/** 기록 한 줄을 사람이 읽는 문장으로 */
function actLine(x){
  const who = esc(x.actorName || '누군가');
  const tgt = esc(x.targetName || '');
  const forOther = x.actorRole === 'admin' && tgt && x.targetName !== x.actorName;
  const slot = esc(slotText(x));
  switch(x.type){
    case 'login':  return { tag:'login',  label:'로그인', l1: who+' 로그인', l2: esc(x.detail||x.device||'') };
    case 'book':   return { tag:'book',   label:'예약',
      l1: forOther ? who+' → '+tgt+' 예약 추가' : who+' 예약', l2: slot + (x.detail ? ' · '+esc(x.detail) : '') };
    case 'cancel': return { tag:'cancel', label: x.kind==='lesson' ? '레슨 삭제' : '취소',
      l1: forOther ? who+' → '+tgt+(x.kind==='lesson'?' 레슨 삭제':' 예약 취소')
                   : who+(x.kind==='lesson'?' 레슨 삭제':' 예약 취소'),
      l2: slot + (x.detail ? ' · '+esc(x.detail) : '') };
    case 'lesson': return { tag:'lesson', label:'레슨',
      l1: who+' → '+(tgt||'회원')+' 레슨 일정', l2: (x.detail ? esc(x.detail)+' · ' : '') + slot };
    case 'move':   return { tag:'book',   label:'옮김',
      l1: who+' → '+(tgt||'회원')+' 일정 옮김', l2: esc(x.detail||slot) };
    case 'block':  return { tag:'',       label:'닫음', l1: who+' 시간 닫음', l2: slot };
    case 'open':   return { tag:'',       label:'열음', l1: who+' 닫은 시간 다시 열음', l2: slot };
    default:       return { tag:'',       label:x.type, l1: who, l2: esc(x.detail||'') };
  }
}
function renderMonitor(){
  if(!isAdmin()) return;
  const now = Date.now();
  const isToday = monDay === ymd(new Date());

  // 접속 중 = 2분 안에 신호가 있었고 '나감'이 아닌 사람
  const live = presence.filter(p=> !p.off && now - tsMs(p.at) < 150000)
                       .sort((a,b)=> tsMs(b.at) - tsMs(a.at));
  const recent = presence.filter(p=> !live.includes(p) && tsMs(p.at))
                         .sort((a,b)=> tsMs(b.at) - tsMs(a.at)).slice(0, 12);

  const pill = (p, on)=>
    '<span class="online'+(on?'':' idle')+'"><i></i>'+
      '<span>'+esc(p.app==='board' ? '입구 현황판' : (p.name||p.key))+'</span>'+
      '<small>'+esc(on ? ((p.page ? p.page+' · ' : '') + (p.device||'')) : ago(tsMs(p.at)))+'</small>'+
    '</span>';

  // 활동 + 주차를 한 줄 시간표로 합친다
  const rows = actDay.map(x=>({ ...x, _src:'act', _ms: tsMs(x.at) }))
    .concat(parkMon.map(x=>({ ...x, _src:'park', type:'park', _ms: tsMs(x.at) })))
    .sort((a,b)=> b._ms - a._ms);

  const groupOf = x => x.type==='park' ? 'park'
                     : x.type==='login' ? 'login'
                     : x.type==='cancel' ? 'cancel'
                     : 'book';
  const count = f => rows.filter(x=> f==='all' || groupOf(x)===f).length;
  const shown = rows.filter(x=> monFilter==='all' || groupOf(x)===monFilter);

  const filters = [['all','전체'],['book','예약'],['cancel','취소'],['login','로그인'],['park','주차']]
    .map(([k,l])=> '<button data-act="monFilter" data-f="'+k+'" class="'+(monFilter===k?'on':'')+'">'+
                   l+' <small style="opacity:.7">'+count(k)+'</small></button>').join('');

  const list = shown.length ? shown.map(x=>{
    let line;
    if(x._src === 'park'){
      line = { tag:'park', label: x.ok ? (x.already ? '주차 · 이미 등록' : '주차 등록') : '주차 실패',
               l1: esc(x.name||'')+' · '+esc(x.plate||'—'),
               l2: x.ok ? (x.entryAt ? esc(x.entryAt.slice(11,16))+' 입차' : '') : esc(x.message||'') };
    } else line = actLine(x);
    const t = x._ms ? new Date(x._ms) : null;
    return '<div class="act">'+
      '<div class="t">'+(t ? pad(t.getHours())+':'+pad(t.getMinutes()) : '—')+'</div>'+
      '<div class="b"><div class="l1"><span class="atag '+line.tag+'">'+esc(line.label)+'</span>'+line.l1+'</div>'+
        (line.l2 ? '<div class="l2">'+line.l2+'</div>' : '')+'</div>'+
      '<button class="xdel" data-act="'+(x._src==='park'?'parkDel':'actDel')+'" data-id="'+x.id+'" aria-label="기록 삭제">✕</button>'+
    '</div>';
  }).join('') : '<div class="empty">이 날은 기록이 없어요</div>';

  document.getElementById('pgMonitor').innerHTML =
    '<div class="row"><div class="h1" style="font-size:19px">기록</div><div class="spacer"></div>'+
      '<span class="sub muted">실시간</span></div>'+

    '<div class="sec"><span>지금 접속 중</span><span>'+live.length+'명</span></div>'+
    (live.length ? '<div>'+live.map(p=>pill(p,true)).join('')+'</div>'
                 : '<div class="sub muted" style="padding:4px 2px 2px">지금 앱을 열어 둔 사람이 없어요</div>')+
    (recent.length
      ? '<div class="sub muted" style="margin:12px 2px 8px">최근 접속</div><div>'+recent.map(p=>pill(p,false)).join('')+'</div>'
      : '')+

    '<div class="row" style="margin-top:22px;gap:8px">'+
      '<button class="btn sm" data-act="monShift" data-n="-1">‹</button>'+
      '<div class="num" style="flex:1;text-align:center;font-size:15px">'+fmtDate(monDay)+'</div>'+
      '<button class="btn sm" data-act="monShift" data-n="1"'+(isToday?' disabled':'')+'>›</button>'+
      (isToday ? '' : '<button class="btn sm" data-act="monToday">오늘</button>')+
    '</div>'+
    '<div class="modes" style="margin-top:12px">'+filters+'</div>'+
    '<div style="margin-top:12px">'+list+'</div>'+
    '<div class="sub muted" style="margin-top:14px;line-height:1.7">'+
      '✕ 를 누르면 기록만 지워져요. 예약이나 주차 할인 자체는 그대로예요.</div>';
  bind('pgMonitor');
}

/** 주차 기록 삭제 — 성공 기록이면 그날 그 회원의 횟수도 하나 돌려준다 */
function parkDelete(id){
  const l = parkDay.concat(parkMon).find(x=> x.id === id);
  if(!l) return;
  const refund = l.ok && !l.already;
  ask({ title:'주차 기록을 지울까요?',
    body: esc(l.name||'')+' · '+esc(l.plate||'')+
          (refund ? '<br><br><span style="color:var(--white-room)">이 회원의 오늘 주차 횟수가 1회 돌아갑니다.</span>' : '')+
          '<br><br><span class="muted">주차 사이트에 등록된 할인은 취소되지 않아요.</span>',
    ok:'지우기',
    onOk: async ()=>{
      try{
        await deleteDoc(doc(db,'parkingLogs', id));
        if(refund && l.memberKey && l.day){
          const ref = doc(db,'parkingDaily', l.memberKey+'_'+l.day);
          const snap = await getDoc(ref);
          if(snap.exists())
            await updateDoc(ref, { ok: Math.max(0, (snap.data().ok||0) - 1) });
        }
        toast('지웠어요');
      }catch(e){ console.error(e); toast('지우지 못했어요 — 보안 규칙을 새로 붙여넣었는지 확인해 주세요'); }
    }});
}

/* ── 앱 안 브라우저(카카오톡 등)에서는 구글 로그인이 막힌다 ──
   카카오톡·안드로이드는 바깥 브라우저로 바로 넘기고,
   아이폰의 다른 앱은 '사파리로 열기'를 안내한다. */
function openExternal(){
  const url = location.href;
  const u = navigator.userAgent || '';
  if(/KAKAOTALK/i.test(u)){
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
    return;
  }
  if(/Android/i.test(u)){
    location.href = 'intent://' + url.replace(/^https?:\/\//,'') +
      '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  copyLink();
}
function copyLink(){
  const url = location.href.split('#')[0];
  const done = ()=> toast('주소를 복사했어요. 사파리 주소창에 붙여넣으세요');
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(()=> toast(url));
  else toast(url);
}
function showInAppGuide(tried){
  const name = inAppName();
  const box = document.getElementById('inAppBox');
  if(!box) return;
  if(!name){ box.innerHTML = ''; return; }
  const ios = isIOS();
  const canJump = /KAKAOTALK/i.test(navigator.userAgent) || /Android/i.test(navigator.userAgent);
  box.innerHTML =
    '<div class="inapp">'+
      '<b>'+esc(name)+' 안에서는 구글 로그인이 안 돼요</b><br>'+
      (canJump
        ? (ios ? '사파리' : '크롬')+'로 열면 바로 로그인할 수 있어요.'
        : '오른쪽 아래(또는 위) <b>⋯</b> 버튼 → <b>Safari로 열기</b>를 눌러 주세요.')+
      (canJump
        ? '<button class="btn primary" data-act="openExternal">'+(ios?'사파리':'크롬')+'로 열기</button>'
        : '<button class="btn" data-act="copyLink">주소 복사하기</button>')+
    '</div>';
  box.querySelectorAll('[data-act]').forEach(el=> el.onclick = ()=> handle(el.dataset));
  if(tried) box.scrollIntoView({ behavior:'smooth', block:'center' });
}
// 열자마자 확인 — 카카오톡이면 바깥 브라우저로 한 번 넘겨 본다
showInAppGuide(false);
if(/KAKAOTALK/i.test(navigator.userAgent || '')){
  let jumped = false;
  try{ jumped = sessionStorage.getItem('rh-jumped') === '1'; sessionStorage.setItem('rh-jumped','1'); }catch(_){}
  if(!jumped) setTimeout(openExternal, 400);
}

/* ===================== 관리자 · 내 연습 (분 단위) =====================
   연습실은 1시간 칸으로 잡되, 실제 연습 시간은 분 단위로 적어 둔다.
   22:10~23:40 → 22시·23시 두 칸을 잡고, 칸마다 그 안에서 연습한 분(50분·40분)을 남긴다.
   같은 연습에서 잡은 칸들은 sess 로 묶인다. 통계는 이 분을 더해서 센다. */

function hmToMin(t){ const [h,m] = String(t||'').split(':').map(Number); return (h||0)*60 + (m||0); }
function myPracticeForm(init, b){
  // b가 있으면 이미 잡아둔 내 연습을 고친다
  let sessDocs = [];
  if(b){
    sessDocs = b.sess
      ? myBookings.filter(x=> x.sess === b.sess)
      : [b];
    const hs = sessDocs.map(x=> x.hour);
    init = {
      roomId: b.roomId, date: b.date,
      start: b.startAt || pad(Math.min(...hs))+':00',
      end:   b.endAt   || (Math.max(...hs)===23 ? '24:00' : pad(Math.max(...hs)+1)+':00')
    };
  }
  const host = document.getElementById('modalHost');
  host.innerHTML =
    '<div class="overlay"><div class="modal" style="max-width:420px">'+
      '<h3>'+(b ? '내 연습 수정' : '내 연습 잡기')+'</h3>'+
      '<p>연습실은 1시간 칸으로 잡히고, 통계에는 <b>실제로 적은 분</b>만큼 들어가요.</p>'+
      '<div class="col" style="margin-top:14px">'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1"><label for="pfRoom">연습실</label><select id="pfRoom">'+
            ROOMS.map(r=> '<option value="'+r.id+'"'+(r.id===init.roomId?' selected':'')+'>'+r.name+'</option>').join('')+
          '</select></div>'+
          '<div style="flex:1.2"><label for="pfDate">날짜</label><input id="pfDate" type="date" value="'+init.date+'"></div>'+
        '</div>'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1"><label for="pfStart">시작</label><input id="pfStart" type="time" step="300" value="'+init.start+'"></div>'+
          '<div style="flex:1"><label for="pfEnd">끝</label><input id="pfEnd" type="'+(init.end==='24:00'?'text':'time')+'" step="300" value="'+init.end+'"></div>'+
        '</div>'+
        '<div class="pf-sum" id="pfSum"></div>'+
        '<div class="row" style="gap:9px;margin-top:6px">'+
          '<button class="btn" style="flex:1;height:48px" id="pfCancel">닫기</button>'+
          '<button class="btn primary" style="flex:1;height:48px" id="pfSave">'+(b?'저장':'잡기')+'</button>'+
        '</div>'+
        (b ? '<button class="btn" style="height:44px;color:var(--red-l);border-color:#5A2A26" id="pfDel">이 연습 취소 (잡은 칸 모두 비우기)</button>' : '')+
      '</div></div></div>';

  const $ = id=> host.querySelector(id);
  const read = ()=>{
    const s = hmToMin($('#pfStart').value), e = hmToMin($('#pfEnd').value);
    return { room:$('#pfRoom').value, date:$('#pfDate').value, s, e,
             startAt:$('#pfStart').value, endAt:$('#pfEnd').value };
  };
  const plan = v=>{
    const hours = [];
    for(let h = Math.floor(v.s/60); h*60 < v.e && h < 24; h++) hours.push(h);
    return hours.map(h=> ({ h, min: Math.max(0, Math.min(v.e, (h+1)*60) - Math.max(v.s, h*60)) }));
  };
  const show = ()=>{
    const v = read();
    if(!(v.e > v.s) || v.e > 1440){ $('#pfSum').innerHTML = '<span class="rose">끝 시각이 시작보다 뒤여야 해요 (자정을 넘길 수 없어요)</span>'; return; }
    const pl = plan(v);
    $('#pfSum').innerHTML =
      '연습실 <b>'+pad(pl[0].h)+':00 – '+(pl[pl.length-1].h===23?'24':pad(pl[pl.length-1].h+1))+':00</b> ('+pl.length+'칸) 확보<br>'+
      '실제 연습 <b>'+fmtHM(v.e - v.s)+'</b> → 통계에 이만큼 들어가요';
  };
  ['#pfStart','#pfEnd','#pfRoom','#pfDate'].forEach(id=> $(id).oninput = show);
  show();
  $('#pfCancel').onclick = closeModal;

  $('#pfSave').onclick = async ()=>{
    const v = read();
    if(!(v.e > v.s) || v.e > 1440){ toast('시간을 확인해 주세요'); return; }
    const pl = plan(v);
    const r = roomOf(v.room);
    const sess = (b && b.sess) || ('s' + Date.now().toString(36));
    const keepIds = new Set(sessDocs.map(x=> x.id));
    const newIds  = pl.map(x=> bookingId(v.room, v.date, x.h));
    try{
      // 새로 필요한 칸이 다른 예약으로 차 있지 않은지 먼저 확인한다
      for(const id of newIds){
        if(keepIds.has(id)) continue;
        const snap = await getDoc(doc(db,'bookings',id));
        if(snap.exists()){ toast(id.split('_')[2]+'시 칸은 이미 차 있어요'); return; }
      }
      for(const x of pl){
        await setDoc(doc(db,'bookings', bookingId(v.room, v.date, x.h)), {
          roomId:v.room, roomName:r.name, date:v.date, hour:x.h,
          memberId: myMid(), kind:'practice', usesCredit:false, addedByAdmin:true,
          sess, startAt:v.startAt, endAt:v.endAt, practiceMin:x.min,
          createdAt: serverTimestamp()
        });
      }
      // 줄어든 칸은 비운다
      for(const id of keepIds){ if(!newIds.includes(id)) await deleteDoc(doc(db,'bookings',id)); }
      logAct(b ? 'move' : 'book', { roomId:v.room, date:v.date, hour:pl[0].h, mid:myMid(), kind:'practice',
        detail:'내 연습 '+v.startAt+'~'+v.endAt+' ('+fmtHM(v.e - v.s)+')' });
      closeModal();
      toast(b ? '고쳤어요 · '+fmtHM(v.e - v.s) : '연습실을 잡았어요 · '+fmtHM(v.e - v.s));
    }catch(e){ console.error(e); toast('저장하지 못했어요'); }
  };

  if(b) $('#pfDel').onclick = ()=>{
    closeModal();
    ask({ title:'이 연습을 취소할까요?', body: fmtDate(init.date)+' '+init.start+'~'+init.end+'<br>잡아둔 '+sessDocs.length+'칸을 모두 비웁니다.',
      ok:'취소하기', onOk: async ()=>{
        try{
          for(const x of sessDocs) await deleteDoc(doc(db,'bookings',x.id));
          logAct('cancel', { roomId:init.roomId, date:init.date, hour:sessDocs[0].hour, mid:myMid(), kind:'practice',
            detail:'내 연습 '+init.start+'~'+init.end });
          toast('취소했어요');
        }catch(e){ toast('취소하지 못했어요'); }
      }});
  };
}

/** 통계 맨 위 — 관리자 본인의 연습 시간 (이번 주 · 지난주 · 이번 달 · 지난달) */
function myPracticeCard(){
  const now = new Date();
  const today = ymd(now);
  const mine = myBookings.filter(b=> b.kind==='practice' && slotTime(b.date,b.hour) < now);
  const sumMin = (a,z)=> mine.filter(b=> b.date>=a && b.date<=z).reduce((t,b)=> t + pMin(b), 0);
  const daysBetween = (a,z)=> Math.round((parseYmd(z) - parseYmd(a))/86400000) + 1;

  const wk0 = startOfWeek(today);
  const wkPrevS = ymd(addDays(parseYmd(wk0), -7)), wkPrevE = ymd(addDays(parseYmd(wk0), -1));
  const mo0 = today.slice(0,8)+'01';
  const pm  = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const moPrevS = ymd(pm), moPrevE = ymd(new Date(now.getFullYear(), now.getMonth(), 0));

  const cells = [
    { k:'이번 주',  a:wk0,     z:today,   days: daysBetween(wk0, today) },
    { k:'지난주',   a:wkPrevS, z:wkPrevE, days: 7 },
    { k:'이번 달',  a:mo0,     z:today,   days: now.getDate() },
    { k:'지난달',   a:moPrevS, z:moPrevE, days: daysBetween(moPrevS, moPrevE) }
  ].map(c=> ({ ...c, min: sumMin(c.a, c.z) }))
   .map(c=> ({ ...c, avg: c.min / c.days }));

  const diff = (cur, prev)=>{
    const d = Math.round(cur.avg - prev.avg);
    if(!prev.min && !cur.min) return '';
    if(d === 0) return '<div class="d">하루 평균 같음</div>';
    return '<div class="d '+(d>0?'up':'down')+'">하루 평균 '+(d>0?'▲ ':'▼ ')+fmtHM(Math.abs(d))+
           ' <span class="muted">('+(cur===cells[0]?'지난주':'지난달')+' 대비)</span></div>';
  };
  const box = (c, cmp)=>
    '<div class="mybox"><div class="k">'+c.k+' <span class="muted">· '+c.days+'일</span></div>'+
      '<div class="v">'+(c.min ? fmtHM(c.min) : '0분')+'</div>'+
      '<div class="a">하루 평균 '+fmtHM(c.avg)+'</div>'+
      (cmp ? diff(c, cmp) : '')+
    '</div>';

  return '<div class="card" style="margin-top:12px;padding:15px 16px">'+
    '<div class="row"><div class="num" style="font-size:15px">🥁 내 연습</div><div class="spacer"></div>'+
      '<span class="sub muted">분 단위 실제 연습 기준</span></div>'+
    '<div class="mygrid">'+ box(cells[0], cells[1]) + box(cells[1]) + box(cells[2], cells[3]) + box(cells[3]) +'</div>'+
  '</div>';
}

/* ===================== 통계 =====================
   예약 1칸 = 1시간이다. 지나간 '연습' 예약만 센다.
   관리자는 기간 안의 예약 전체를 한 번 가져와 회원별로 나누고,
   회원은 이미 받아둔 본인 예약만 쓰므로 따로 조회하지 않는다. */

function statFrom(){ return ymd(addDays(new Date(), -(statDays-1))); }
function statRangeLabel(){
  return statDays===28 ? '최근 4주' : (statDays===84 ? '최근 12주' : '최근 1년');
}

async function loadStats(){
  if(!isAdmin()){ statState = 'done'; return; }
  const from = statFrom(), to = ymd(new Date());
  if(statKey === from && statState === 'done') return;
  statState = 'load';
  if(page==='stats') renderStats();
  try{
    const snap = await getDocs(query(collection(db,'bookings'),
      where('date','>=',from), where('date','<=',to)));
    statRows  = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    statKey   = from;
    statState = 'done';
  }catch(e){
    statState = 'fail';
  }
  if(page==='stats') renderStats();
}

/** 기간 안의, 이미 지나간 예약 */
function statSource(kind){
  const now  = new Date();
  const from = statFrom();
  const src  = isAdmin() ? statRows : myBookings;
  return src.filter(b=> b.kind===kind && b.date>=from && slotTime(b.date,b.hour) < now);
}
/** 지금 보고 있는 대상(전체 / 한 사람)으로 좁힌다 */
function statOnly(list){
  const who = isAdmin() ? statWho : myMid();
  return who ? list.filter(b=> b.memberId === who) : list;
}

/** 이 예약의 실제 연습 분 — 분 단위로 적은 관리자 연습은 그 값, 나머지는 60분 */
function pMin(b){
  if(!b || b.kind !== 'practice') return 0;
  return (typeof b.practiceMin === 'number') ? b.practiceMin : 60;
}
function sumH(list){ return list.reduce((a,b)=> a + pMin(b), 0) / 60; }
/** 29 → "29", 28.5 → "28.5" */
function fmtH(x){ const r = Math.round(x*10)/10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
/** 분 → "1시간 30분" */
function fmtHM(min){
  min = Math.round(min);
  const h = Math.floor(min/60), m = min % 60;
  if(!h) return m+'분';
  return h+'시간'+(m ? ' '+m+'분' : '');
}

function summarize(list){
  const today = ymd(new Date());
  const hrs   = sumH(list);
  const days  = new Set(list.filter(b=> pMin(b) > 0).map(b=>b.date));
  let start = statFrom();
  if(list.length){
    const first = list.map(b=>b.date).sort()[0];
    if(first > start) start = first;        // 들어온 지 얼마 안 된 회원을 불리하게 세지 않는다
  }
  const span = Math.max(1,
    Math.round((parseYmd(today) - parseYmd(start)) / 86400000) + 1);
  return {
    hours : hrs,
    active: days.size,
    span  : span,
    weekly: hrs / (Math.max(7, span) / 7),
    perAct: days.size ? hrs / days.size : 0,
    perDay: hrs / span,
    paid  : sumH(list.filter(usesCredit)),
    free  : sumH(list.filter(b=> !usesCredit(b)))
  };
}
function n1(x){ return (Math.round(x*10)/10).toFixed(1); }

/** 막대 그래프 — 그림 라이브러리 없이 칸의 높이만으로 그린다 */
function barsHTML(vals, labels, o){
  o = o || {};
  const max  = Math.max(1, ...vals);
  const nums = vals.length <= 14;
  const bw = vals.length<=4 ? 84 : (vals.length<=7 ? 62 : (vals.length<=13 ? 42 : 999));
  return '<div class="chart"><div class="bars" style="--bw:'+bw+'px">'+
    vals.map((v,i)=>{
      let cls = v===0 ? 'z' : (o.gold ? 'gold' : '');
      if(v===max && v>0) cls = 'hot';
      const mark  = (o.mark===i) ? ' now' : '';
      const showL = !o.every || (i % o.every === 0) || i===vals.length-1;
      const hpc   = v ? Math.max(5, Math.round(v/max*100)) : 2;
      return '<div class="cbar'+mark+'">'+
        (nums ? '<b class="'+(v?'':'off')+'">'+fmtH(v)+'</b>' : '')+
        '<i class="'+cls+'" style="height:'+hpc+'%"></i>'+
        '<span class="'+(showL?'':'off')+'">'+labels[i]+'</span></div>';
    }).join('')+
  '</div></div>';
}

function weekChartHTML(list){
  const n  = statDays<=28 ? 4 : (statDays<=84 ? 12 : 26);
  const w0 = startOfWeek(ymd(new Date()));
  const weeks = [];
  for(let i=n-1; i>=0; i--) weeks.push(ymd(addDays(parseYmd(w0), -7*i)));
  const vals = weeks.map(ws=>{
    const we = ymd(addDays(parseYmd(ws), 6));
    return sumH(list.filter(b=> b.date>=ws && b.date<=we));
  });
  const labels = weeks.map(ws=>{ const d=parseYmd(ws); return (d.getMonth()+1)+'/'+d.getDate(); });
  return barsHTML(vals, labels, { every: n>13 ? 4 : 1, mark: n-1 });
}
function dowChartHTML(list){
  const v = [0,0,0,0,0,0,0];
  list.forEach(b=> v[parseYmd(b.date).getDay()] += pMin(b)/60);
  return barsHTML(v, ['일','월','화','수','목','금','토'], { mark: new Date().getDay() });
}
function hourChartHTML(list){
  const v = new Array(24).fill(0);
  list.forEach(b=> v[b.hour] += pMin(b)/60);
  return barsHTML(v, v.map((_,i)=>pad(i)), { every:3, mark:new Date().getHours() });
}

function statBox(n, unit, label, color){
  return '<div class="statbox"><div class="n"'+(color?' style="color:'+color+'"':'')+'>'+
    n + (unit ? '<small>'+unit+'</small>' : '') + '</div>'+
    '<div class="l">'+label+'</div></div>';
}

/** (관리자) 회원별 줄 — 많이 연습한 순서 */
function memberStatHTML(every){
  const rows = members.map(m=>{
    const mid = m.mid || m.key;
    return { m, mid, s: summarize(every.filter(b=> b.memberId===mid)) };
  }).sort((a,b)=> b.s.hours - a.s.hours ||
       (a.m.name||'').localeCompare(b.m.name||'','ko'));
  const max = Math.max(1, ...rows.map(r=>r.s.hours));
  if(!rows.length) return '<div class="empty">회원이 없어요</div>';
  return rows.map((r,i)=>
    '<button class="mrow'+(statWho===r.mid?' on':'')+'" data-act="statWho" data-w="'+r.mid+'">'+
      '<div class="row">'+
        '<div class="num" style="font-size:15.5px">'+esc(r.m.name||'이름 없음')+'</div>'+
        (r.m.role==='admin'
          ? '<span class="chip" style="height:19px;font-size:10px;padding:0 8px">강사</span>' : '')+
        '<div class="spacer"></div>'+
        '<div class="num gold" style="font-size:17px">'+fmtH(r.s.hours)+
          '<span class="sub" style="margin-left:3px">시간</span></div>'+
      '</div>'+
      '<div class="row sub muted" style="gap:7px;margin-top:5px;font-size:11px">'+
        '<span>주 평균 '+n1(r.s.weekly)+'시간</span><span>·</span>'+
        '<span>'+r.s.active+'일 나옴</span><span>·</span>'+
        '<span>나온 날 '+n1(r.s.perAct)+'시간</span></div>'+
      '<div class="track"><i class="'+(i===0 && r.s.hours ? 'top':'')+
        '" style="width:'+Math.round(r.s.hours/max*100)+'%"></i></div>'+
    '</button>').join('');
}

function renderStats(){
  const admin = isAdmin();
  const every = statSource('practice');          // 기간 안의 모두
  const list  = statOnly(every);                 // 지금 보는 대상
  const les   = statOnly(statSource('lesson'));
  const s     = summarize(list);
  const who   = (admin && statWho)
    ? members.find(m=> (m.mid||m.key) === statWho) : null;

  const head =
    '<div class="row"><div class="h1" style="font-size:19px">연습 통계</div>'+
      '<div class="spacer"></div>'+
      (who ? '<button class="chip on" data-act="statWho" data-w="">'+
               esc(who.name||'회원')+' 보는 중 ✕</button>' : '')+
    '</div>'+
    (admin ? myPracticeCard() : '')+
    '<div class="modes" style="margin-top:12px">'+
      [[28,'최근 4주'],[84,'최근 12주'],[365,'최근 1년']].map(([d,l])=>
        '<button data-act="statRange" data-d="'+d+'" class="'+
          (statDays===d?'on':'')+'">'+l+'</button>').join('')+
    '</div>';

  if(admin && statState==='load'){
    document.getElementById('pgStats').innerHTML =
      head + '<div class="empty" style="margin-top:16px">불러오는 중…</div>';
    bind('pgStats'); return;
  }
  if(admin && statState==='fail'){
    document.getElementById('pgStats').innerHTML =
      head + '<div class="empty" style="margin-top:16px">통계를 불러오지 못했어요</div>';
    bind('pgStats'); return;
  }

  const tiles =
    '<div class="statgrid">'+
      statBox(fmtH(s.hours), '시간', statRangeLabel()+' 연습 총량')+
      statBox(n1(s.weekly), '시간', '주 평균', '#E3CFA6')+
      statBox(s.active, '일', '연습하러 나온 날')+
      statBox(n1(s.perAct), '시간', '나온 날 하루 평균')+
    '</div>'+
    '<div class="card flat" style="margin-top:10px;padding:13px 15px">'+
      '<div class="row sub" style="gap:7px;flex-wrap:wrap">'+
        '<span>기간 전체로는 하루 평균 <b class="gold" style="font-weight:400">'+
          n1(s.perDay)+'시간</b></span>'+
        '<span class="muted">·</span>'+
        '<span>연습권 차감 '+fmtH(s.paid)+'시간</span>'+
        '<span class="muted">·</span>'+
        '<span class="muted">미차감 '+fmtH(s.free)+'시간</span>'+
        (les.length ? '<span class="muted">·</span><span>레슨 '+les.length+'회</span>' : '')+
      '</div></div>';

  const rooms = ROOMS.map(r=>{
    const n = fmtH(sumH(list.filter(b=> b.roomId===r.id)));
    const pc = s.hours ? Math.round(Number(n)/s.hours*100) : 0;
    return '<div style="flex:1;min-width:0">'+
      '<div class="row sub" style="gap:6px"><span style="color:'+r.color+'">'+r.name+'</span>'+
        '<div class="spacer"></div><span class="num">'+n+'시간</span></div>'+
      '<div class="bar" style="margin-top:7px"><i style="width:'+pc+'%;background:'+r.color+'"></i></div>'+
    '</div>';
  }).join('');

  const charts =
    '<div class="sec">주별 연습 시간</div>'+ weekChartHTML(list)+
    '<div class="cols even" style="margin-top:4px">'+
      '<div><div class="sec">요일별</div>'+ dowChartHTML(list)+'</div>'+
      '<div><div class="sec">시간대별</div>'+ hourChartHTML(list)+'</div>'+
    '</div>'+
    '<div class="sec">연습실별</div>'+
    '<div class="card flat"><div class="row" style="gap:18px;align-items:flex-start">'+rooms+'</div></div>';

  const people = admin
    ? '<div class="sec"><span>회원별'+(statWho?' (누르면 전체로)':'')+'</span>'+
        '<span class="muted">'+statRangeLabel()+'</span></div>'+
      memberStatHTML(every)
    : '';

  const foot = '<div class="sub muted" style="margin-top:18px;line-height:1.7">'+
    '예약 한 칸이 1시간이에요. 이미 지나간 연습만 셉니다.<br>'+
    '주 평균은 '+(list.length ? '처음 연습한 날부터 오늘까지' : '기간 전체')+'를 기준으로 계산했어요.</div>';

  document.getElementById('pgStats').innerHTML = head + tiles + charts + people + foot;
  bind('pgStats');
}

/* ===================== 관리자 · 회원 관리 ===================== */
function renderMembers(){
  // 관리자는 항상 맨 위. 나중에 강사가 늘어나도 위에 모인다.
  const list = members.slice().sort((a,b)=>{
    const ra = a.role==='admin' ? 0 : 1, rb = b.role==='admin' ? 0 : 1;
    if(ra !== rb) return ra - rb;
    return (a.name||'').localeCompare(b.name||'','ko');
  });
  document.getElementById('pgMembers').innerHTML =
    '<div class="row"><div class="h1" style="font-size:19px">회원 관리</div><div class="spacer"></div>'+
      '<button class="btn sm primary" data-act="addMember">＋ 회원 추가</button></div>'+
    '<div class="sec"><span>전체 회원</span><span>'+
      list.filter(m=>m.role!=='admin').length+'명 · 관리자 '+
      list.filter(m=>m.role==='admin').length+'명</span></div>'+
    (list.length ? list.map(memberCard).join('') : '<div class="empty">등록된 회원이 없어요</div>');
  bind('pgMembers');
}
function memberCard(m){
  const c = liveCredits(m);
  const weekly = weeklyOf(m);
  const quota = m.lessonQuota || LESSON_QUOTA;
  const mine  = allLessons.filter(x=>x.memberId === (m.mid||m.key));
  const term  = openTerm(mine, quota);
  const done  = lessonsInTerm(mine, term).length;
  const names = ['일','월','화','수','목','금','토'];
  const lesson = (m.lessonDay!=null && m.lessonTime) ? names[m.lessonDay]+' '+m.lessonTime : '일정 미등록';
  const paid = !!payOf(m, term);

  return '<button class="card memcard" data-act="openMember" data-key="'+m.key+'">'+
    '<div class="row">'+
      '<div class="num" style="font-size:17px">'+esc(m.name||'이름 없음')+'</div>'+
      (m.role==='admin' ? '<span class="chip on" style="height:21px;font-size:10px">관리자</span>' : '')+
      '<div class="spacer"></div>'+
      '<span class="chip '+(paid?'paid':'unpaid')+'" style="height:22px;font-size:11px">'+
        (paid?term+'기 입금':term+'기 미입금')+'</span>'+
    '</div>'+
    '<div class="row sub muted" style="margin-top:7px;font-size:11px;gap:8px">'+
      '<span>'+esc(m.phone||'연락처 없음')+'</span><span>·</span><span>'+esc(lesson)+'</span>'+
    '</div>'+
    '<div class="row" style="align-items:baseline;gap:7px;margin-top:11px">'+
      '<div class="sub">연습권</div>'+
      '<div class="num gold" style="font-size:18px">'+c+'시간</div>'+
      '<div class="sub muted">주 '+weekly+'시간</div>'+
      '<div class="spacer"></div>'+
      '<div class="sub">'+term+'기 <b class="gold" style="font-weight:400">'+done+'</b> / '+quota+'회</div>'+
    '</div>'+
  '</button>';
}
