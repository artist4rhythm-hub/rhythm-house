<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>리듬 하우스 · 연습실 예약</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1A2A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="리듬 하우스">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
@font-face{font-family:'Cafe24 Lovingu';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround Air';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff') format('woff');}

:root{
  --ground:#0B1A2A; --surf:#13283E; --surf2:#1B3350; --deep:#101F31;
  --line:#27425F; --line-soft:#1B3148;
  --cream:#F3E7D2; --dim:#9FB3C8; --mute:#7E96AD;
  --red:#C8463A; --red-l:#E8705F;
  --black-room:#5C82AD; --white-room:#E3CFA6;
  --f-logo:'Cafe24 Lovingu','Gothic A1',cursive;
  --f-head:'Cafe24 Ssurround','Gothic A1',sans-serif;
  --f-body:'Cafe24 Ssurround Air','Gothic A1',sans-serif;

  /* 폰의 시계·배터리 표시줄과 홈 바를 피하기 위한 여백.
     홈 화면에 설치해 전체화면으로 열었을 때만 값이 생긴다. */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);

  --maxw: 520px;   /* 화면 폭에 따라 아래 미디어 쿼리에서 넓어진다 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ground);color:var(--cream);font-family:var(--f-body);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select{background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:0 14px;height:48px;color:var(--cream);width:100%}
input:focus,select:focus{outline:none;border-color:var(--black-room)}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:8px}
.hide{display:none !important}

/* ---------- 레이아웃 ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--ground);position:relative}
@media(min-width:560px){
  body{background:#07121D}
  .wrap{box-shadow:0 0 70px rgba(0,0,0,.55)}
}
.topbar{height:calc(58px + var(--sat));flex-shrink:0;display:flex;align-items:center;gap:9px;
  padding:var(--sat) calc(18px + var(--sar)) 0 calc(18px + var(--sal));
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;
  background:rgba(11,26,42,.92);backdrop-filter:blur(10px);z-index:20}
.topbar img{width:28px;height:29px;object-fit:contain}
.wordmark{font-family:var(--f-logo);font-size:21px;line-height:1}
.spacer{flex:1}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);
  color:var(--dim);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--red);border-color:var(--red);color:#FFF6EC}
.main{flex:1;padding:18px calc(18px + var(--sar)) calc(92px + var(--sab)) calc(18px + var(--sal))}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:var(--maxw);margin:0 auto;
  height:calc(72px + var(--sab));
  border-top:1px solid var(--line-soft);background:#0A1725;display:flex;align-items:flex-start;
  padding:0 calc(6px + var(--sar)) var(--sab) calc(6px + var(--sal));z-index:20}
.nav button{flex:1;height:72px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--mute);font-size:11px;padding:6px 0}
.nav button.on{color:var(--cream)}

/* ---------- 카드 ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.flat{background:var(--deep)}
.sec{font-size:13px;color:var(--dim);margin:20px 0 10px;display:flex;
  align-items:center;justify-content:space-between}
.h1{font-family:var(--f-head);font-size:21px;line-height:1.45}
.big{font-family:var(--f-head);font-size:44px;line-height:1}
.num{font-family:var(--f-head)}
.sub{font-size:12px;color:var(--dim)}
.muted{color:var(--mute)}
.gold{color:var(--white-room)}
.rose{color:var(--red-l)}
.bar{height:7px;border-radius:4px;background:var(--ground);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--red)}
.cta{height:56px;border-radius:14px;background:var(--red);color:#FFF6EC;
  font-family:var(--f-head);font-size:17px;width:100%;display:flex;
  align-items:center;justify-content:center;gap:8px}
.cta[disabled]{background:var(--surf2);color:var(--mute)}
.cta.google{background:#FFFFFF;color:#1F2A36;gap:11px}
.cta.google[disabled]{background:#9AA7B4;color:#4A5663}
.linkbtn{height:38px;color:var(--dim);font-size:13px;text-decoration:underline;
  text-underline-offset:3px;width:100%}
.btn{height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--red);border-color:var(--red);color:#FFF6EC}
.btn.sm{height:34px;padding:0 11px;font-size:12px;border-radius:9px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.empty{padding:34px 0;text-align:center;color:var(--mute);font-size:13px}

/* ---------- 예약 ---------- */
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;width:52px;height:56px;border-radius:12px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim)}
.dates button .d{font-family:var(--f-head);font-size:16px}
.dates button .w{font-size:11px;opacity:.85}
.dates button.on{background:var(--cream);border-color:var(--cream);color:#0B1A2A}
.rooms{display:flex;gap:9px}
.rooms button{flex:1;height:46px;border-radius:11px;border:1px solid var(--line);color:var(--dim);font-size:14px}
.rooms button.on[data-r="black"]{background:#3E5F82;border-color:var(--black-room);color:var(--cream)}
.rooms button.on[data-r="white"]{background:var(--white-room);border-color:var(--white-room);color:#0B1A2A}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:54px;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream)}
.slot .hr{font-family:var(--f-head);font-size:16px;line-height:1}
.slot .st{font-size:9px;opacity:.8}
.slot.taken{background:#0D1826;border-color:#1A2A3C;color:#5E7389}
.slot.mine{background:var(--red);border-color:var(--red);color:#FFF6EC}
.slot.lesson{background:#2B2518;border-color:#8A7442;color:#E3CFA6}
.slot.blocked{background:transparent;border-style:dashed;border-color:#3A5570;color:var(--mute)}
.slot.past{background:transparent;border-color:var(--line-soft);color:#4C637B;cursor:not-allowed}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--dim)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- 달력 ---------- */
.cal{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calnav .m{flex:1;text-align:center;font-family:var(--f-head);font-size:17px}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:5px}
.caldow span{text-align:center;font-size:11px;color:var(--mute);padding:3px 0}
.caldow span:first-child{color:#C87A72}
.caldow span:last-child{color:#7FA3CC}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calcell{min-height:46px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;background:transparent;
  color:var(--cream);font-size:14px;border:1px solid transparent;padding:5px 0}
.calcell.out{color:#33475C}
.calcell.off{color:#4C637B}
.calcell.has{background:var(--surf)}
.calcell.today{border-color:#3E5F82}
.calcell.on{background:var(--red);color:#FFF6EC;border-color:var(--red)}
.calcell .dots{display:flex;gap:3px;height:6px;align-items:center}
.calcell .dots i{width:6px;height:6px;border-radius:50%;display:block}
/* 선택된 날은 배경이 빨개서 같은 색 점이 묻힌다 — 밝게 바꾼다 */
.calcell.on .dots i{background:#FFE9E3 !important;box-shadow:none}

/* ---------- 두 연습실 나란히 ---------- */
.rooms2{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px;align-items:center}
.rooms2 .rh{height:34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-family:var(--f-head)}
.rooms2 .hr{font-size:11px;color:var(--mute);text-align:right;padding-right:5px}
.cell2{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surf);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--cream);
  width:100%;padding:0 4px;text-align:center;line-height:1.3}
.cell2.taken{background:#0D1826;border-color:#1A2A3C;color:#5E7389}
.cell2.mine{background:var(--red);border-color:var(--red);color:#FFF6EC}
.cell2.lesson{background:#2B2518;border-color:#8A7442;color:#E3CFA6}
.cell2.blocked{background:transparent;border-style:dashed;border-color:#3A5570;color:var(--mute)}
.cell2.past{background:transparent;border-color:var(--line-soft);color:#44596E}
.verline{text-align:center;font-size:10px;color:#3E5168;padding:18px 0 4px;letter-spacing:.5px}

/* ---------- 날짜별 / 주간 전환 ---------- */
.modes{display:flex;gap:5px;background:var(--surf);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin-top:14px}
.modes button{flex:1;height:38px;border-radius:9px;font-size:13px;color:var(--dim)}
.modes button.on{background:var(--surf2);color:var(--cream)}

/* ---------- 주간 한눈에 ---------- */
.wk{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--deep)}
.wkhead{display:flex;background:var(--surf);border-bottom:1px solid var(--line)}
.wkhead .corner{width:36px;flex:none;border-right:1px solid var(--line)}
.wkhead .cell{flex:1;min-width:0;text-align:center;padding:7px 0;font-size:10px;color:var(--dim)}
.wkhead .cell b{display:block;font-family:var(--f-head);font-size:15px;color:var(--cream);margin-top:1px}
.wkhead .cell.on{background:var(--surf2)}
.wkhead .cell .rooms{display:flex;gap:2px;margin-top:5px;padding:0 3px}
.wkhead .cell .rooms i{flex:1;height:4px;border-radius:2px;display:block}
.wkhead .cell.on b{color:var(--red-l)}
.wkbody{display:flex;max-height:min(56vh,520px);overflow-y:auto;scrollbar-width:thin}
.wkhours{width:36px;flex:none;border-right:1px solid var(--line)}
.wkhours div{height:22px;line-height:22px;font-size:9px;color:var(--mute);text-align:right;padding-right:5px}
.wkcols{flex:1;display:flex;min-width:0}
.wkcol{flex:1;min-width:0;border-right:1px solid var(--line-soft)}
.wkcol:last-child{border-right:0}
.wkcol.today{background:rgba(200,70,58,.05)}
.wkrow{height:22px;display:flex;gap:2px;padding:2px 3px;border-bottom:1px solid #16263A;width:100%}
.wc{flex:1;min-width:0;display:block;border-radius:3px;background:#17293C}
/* 칸마다 왼쪽 모서리에 연습실 색을 남겨 어느 칸이 어느 방인지 늘 보이게 한다 */
.wc.rb{box-shadow:inset 2px 0 0 rgba(92,130,173,.85)}
.wc.rw{box-shadow:inset 2px 0 0 rgba(227,207,166,.75)}
.wc.past{background:#101B27}
.wc.taken{background:#3A5A80}
.wc.mine{background:var(--red)}
.wc.lesson{background:#8A7442}
.wc.block{background:#101C29;border:1px dashed #334B66}
.wklegend{display:flex;gap:11px;flex-wrap:wrap;margin-top:11px}
.wklegend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--dim)}
.wklegend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- 회원 카드 · 레슨 기록 ---------- */
.memcard{display:block;width:100%;text-align:left;margin-bottom:11px;cursor:pointer}
.memcard:active{background:var(--surf2)}
.chip.paid{background:#1C3326;border-color:#2F5A3E;color:#9FD2A8}
.chip.unpaid{border-color:#5A2A26;color:var(--red-l)}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 12px;border-radius:11px;background:var(--deep);border:1px solid var(--line-soft);
  margin-bottom:7px;color:var(--cream)}
.lrow .d{flex:1;font-size:14px}
.lrow .n{font-size:11px;color:var(--mute)}
.lrow .go{font-size:11px;color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:3px 8px}
textarea{background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;color:var(--cream);width:100%;font-family:inherit;font-size:15px;
  line-height:1.6;resize:vertical}
textarea:focus{outline:none;border-color:var(--black-room)}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--dim);
  line-height:1.6;cursor:pointer}
.chk input{width:18px;height:18px;flex-shrink:0;margin-top:1px;accent-color:var(--red)}

.stepper{display:flex;align-items:center;gap:2px;background:var(--deep);
  border:1px solid var(--line);border-radius:12px;padding:3px}
.stepper button{width:40px;height:38px;border-radius:9px;font-size:18px;
  color:var(--cream);background:var(--surf2)}
.stepper button:active{background:var(--red)}
.stepper b{font-family:var(--f-head);font-size:19px;min-width:46px;text-align:center;
  font-weight:400}

/* ---------- 안내 배너 ---------- */
.notice{border-radius:13px;padding:14px 16px;background:#3A1A16;border:1px solid #6B2E26;
  color:#F2BDB3;font-size:13px;line-height:1.65;margin-top:13px}
.notice b{font-family:var(--f-head);color:#FFD7CE}

/* ---------- 태블릿 가로 · PC ---------- */
@media(min-width:900px){
  :root{ --maxw:1000px }
  .main{padding:24px 26px calc(104px + var(--sab))}
  .grid{grid-template-columns:repeat(8,minmax(0,1fr))}
  .slot{height:60px}
  .slot .hr{font-size:18px}
  .slot .st{font-size:10px}
  .wkhead .cell{font-size:11px;padding:9px 0}
  .wkrow,.wkhours div{height:26px}
  .wkhours div{line-height:26px;font-size:10px}
  .wkbody{max-height:min(60vh,620px)}
  .tl .ev div:first-child{font-size:13px}
}
@media(min-width:1280px){
  :root{ --maxw:1240px }
  .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
  .wkrow,.wkhours div{height:30px}
  .wkhours div{line-height:30px}
}

/* ---------- 타임라인 ---------- */
.tl{display:flex;gap:8px}
.tl .axis{width:40px;flex-shrink:0}
.tl .colhead{height:30px;border-radius:9px 9px 0 0;display:flex;align-items:center;
  justify-content:center;font-size:12px}
.tl .track{position:relative;background:var(--deep);border:1px solid var(--line-soft);
  border-radius:0 0 9px 9px;overflow:hidden}
.tl .hline{position:absolute;left:0;right:0;border-top:1px solid #192E44}
.tl .hlabel{position:absolute;left:0;font-size:10px;color:var(--mute)}
.tl .ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:6px 9px;overflow:hidden}
.tl .now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:5}
.tl .cell{position:absolute;left:4px;right:4px;border-radius:8px}

/* ---------- 모달 / 토스트 ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,12,20,.76);display:flex;align-items:center;
  justify-content:center;z-index:60;backdrop-filter:blur(3px);overflow-y:auto;
  padding:calc(22px + var(--sat)) calc(22px + var(--sar)) calc(22px + var(--sab)) calc(22px + var(--sal))}
.modal{width:100%;max-width:400px;background:var(--surf);border:1px solid var(--line);
  border-radius:20px;padding:22px}
.modal h3{font-family:var(--f-head);font-size:19px;font-weight:400;margin-bottom:10px}
.modal p{font-size:14px;color:var(--dim);line-height:1.65}
.modal .acts{display:flex;gap:9px;margin-top:20px}
.modal .acts .btn{flex:1;height:48px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--surf2);
  border:1px solid var(--line);color:var(--cream);padding:13px 20px;border-radius:13px;
  font-size:14px;z-index:80;max-width:88%;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.4)}

/* ---------- 로그인 ---------- */
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:calc(40px + var(--sat)) calc(30px + var(--sar)) 30px calc(30px + var(--sal))}
.auth .brand{display:flex;flex-direction:column;align-items:center}
.auth .brand img{width:116px;height:122px;object-fit:contain}
.auth .brand .lg{font-family:var(--f-logo);font-size:44px;line-height:1.2;margin-top:12px}
.auth .brand .tag{font-size:13px;color:var(--dim);letter-spacing:2px;margin-top:4px}
.foot{text-align:center;padding:22px 0 calc(26px + var(--sab));font-size:12px;color:var(--mute)}
.keys{font-family:var(--f-head);font-size:11px;letter-spacing:2px;color:var(--red);margin-top:8px}
a{color:var(--red-l)}
</style>
</head>
<body>

<!-- ===================== 로그인 ===================== -->
<div class="wrap" id="scLogin">
  <div class="auth">
    <div class="brand">
      <img src="logo.png" alt="리듬 하우스">
      <div class="lg">Rhythm House</div>
      <div class="tag">연습실 예약</div>
    </div>
    <div class="col" style="margin-top:38px">
      <button class="cta google" id="btnGoogle">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.3z"/>
          <path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.2l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.7 0-10.6-3.9-12.3-9.1H4.3v5.7C7.9 41.1 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.7 28.3c-.4-1.3-.7-2.7-.7-4.3s.3-3 .7-4.3v-5.7H4.3A22 22 0 0 0 2 24c0 3.6.9 6.9 2.3 9.9l7.4-5.6z"/>

/* ===================== 상태 ===================== */
let ME = null;              // 내 회원 문서

/* ===================== 유틸 ===================== */
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function pad(n){ return String(n).padStart(2,'0'); }
function dow(d){ return ['일','월','화','수','목','금','토'][d.getDay()]; }
function fmtDate(s){ const d=parseYmd(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+dow(d)+')'; }
function slotTime(dateStr, hour){ const d=parseYmd(dateStr); d.setHours(hour,0,0,0); return d; }
/** 달력을 n달 옮긴다 */
function shiftMonth(ds, n){
  const d = parseYmd(ds || ymd(new Date()));
  return ymd(new Date(d.getFullYear(), d.getMonth()+n, 1));
}
/** 그 날짜가 속한 주의 월요일 */
function startOfWeek(s){
  const d = parseYmd(s), w = d.getDay();      // 0=일요일
  return ymd(addDays(d, w===0 ? -6 : 1-w));
}
function bookingId(room,dateStr,hour){ return room+'_'+dateStr+'_'+hour; }
function roomOf(id){ return ROOMS.find(r=>r.id===id) || ROOMS[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isAdmin(){ return ME && ME.role === 'admin'; }

/** 내 예약 식별자 — 이메일이 아니라 뜻 없는 문자열이라 남이 봐도 누구인지 모른다 */
function myMid(){ return ME ? (ME.mid || ME.key) : ''; }
/** 새 회원에게 줄 내부 식별자를 만든다 */
function newMid(){
  const s = 'abcdefghijkmnpqrstuvwxyz23456789';
  let out = '';
  const buf = new Uint8Array(16);
  crypto.getRandomValues(buf);
  buf.forEach(n=>{ out += s[n % s.length]; });
  return out;
}

/**
 * 예약 문서에는 회원 이름도 이메일도 저장하지 않는다 (회원끼리 서로를 알 수 없도록).
 * 관리자 화면에서만 회원 목록에서 이름을 찾아 보여준다.
 * memberName은 예전 버전으로 만들어진 예약을 위한 대비책이다.
 */
function nameOf(b){
  if(!b) return '';
  if(b.kind === 'block') return '차단';
  if(b.memberId && ME && b.memberId === myMid()) return (ME.name || '나');
  const m = members.find(x=> (x.mid || x.key) === b.memberId);
  return (m && m.name) || b.memberName || '예약';
}

/**
 * 이번 주기에 쓴 시간 — 따로 저장하지 않고 예약에서 센다.
 * 지나간 예약만 세므로, 예약만 해두고 아직 오지 않은 시간은 들어가지 않는다.
 */
function usedInCycle(m, list){
  if(!m) return 0;
  const from = m.cycleStart || m.expiresAt || '';
  const now = new Date();
  return (list||[]).filter(b=>
    b.kind === 'practice' && (!from || b.date >= from) && slotTime(b.date,b.hour) < now
  ).length;
}

/** 유효기간이 지난 연습권은 0으로 본다 */
function liveCredits(m){
  if(!m) return 0;
  if(m.expiresAt && m.expiresAt < ymd(new Date())) return 0;
  return m.credits || 0;
}
function creditExpired(m){
  return !!(m && m.expiresAt && m.expiresAt < ymd(new Date()) && (m.credits||0) > 0);
}

/* ===================== 토스트 / 모달 ===================== */
let toastTimer = null;
function toast(msg){
  const host = document.getElementById('toastHost');
  host.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ host.innerHTML=''; }, 2600);
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function ask({ title, body, ok='확인', cancel='취소', danger=false, onOk }){

/* ===================== 로그인 ===================== */
/**
 * 로그인은 구글 계정 하나뿐이다.
 * 관리자가 회원의 구글 주소를 명단에 올려두면 그 주소로 들어온 사람만 통과한다.
 * 비밀번호 로그인을 열어두면 아무나 남의 주소로 계정을 만들 수 있어 쓰지 않는다.
 */
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt:'select_account' });

// 로그인 유지 설정은 미리 해둔다.
// 버튼을 누른 뒤에 await를 걸면 '사용자가 누른 흐름'이 끊겨서
// 아이폰 사파리가 팝업을 막아버린다. PC 크롬은 너그러워 티가 안 난다.
setPersistence(auth, browserLocalPersistence).catch(()=>{});

document.getElementById('btnGoogle').onclick = googleLogin;

/** 홈 화면에 설치된 앱으로 열렸는지 */
function standalone(){
  return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
}

function googleLogin(){
  const btn = document.getElementById('btnGoogle');
  btn.disabled = true;
  // 누른 즉시 연다 — 앞에 await를 두지 않는다
  signInWithPopup(auth, googleProvider)
    .catch(e=>{
      const c = e.code || '';
      if(c.includes('popup-closed') || c.includes('cancelled-popup')) return;   // 사용자가 닫음
      if(c.includes('account-exists-with-different-credential')){
        toast('같은 주소의 다른 로그인 방식이 있어요'); return;
      }
      if(c.includes('network')){ toast('인터넷 연결을 확인해 주세요'); return; }
      // 팝업이 아예 막힌 기기에서는 같은 창에서 처리한다
      try{ sessionStorage.setItem('rh-redirect','1'); }catch(_){}
      signInWithRedirect(auth, googleProvider)
        .catch(()=> toast('구글 로그인을 열 수 없어요 · '+(c||'알 수 없는 오류')));
    })
    .finally(()=>{ btn.disabled = false; });
}

// 리다이렉트로 돌아온 경우 처리
getRedirectResult(auth)
  .then(res=>{ if(res) { try{ sessionStorage.removeItem('rh-redirect'); }catch(_){} } })
  .catch(e=>{
    try{ sessionStorage.removeItem('rh-redirect'); }catch(_){}
    const c = e.code || '';
    if(c && !c.includes('no-auth-event')) toast('구글 로그인 실패 · '+c);
  });

/**
 * 같은 창 방식으로 다녀왔는데 로그인이 안 된 채 돌아온 경우를 알려준다.
 * 조용히 로그인 화면으로 되돌아가면 왜 안 되는지 알 수가 없다.
 */
function warnRedirectFailed(){
  let flag = null;
  try{ flag = sessionStorage.getItem('rh-redirect'); }catch(_){}
  if(!flag) return;
  try{ sessionStorage.removeItem('rh-redirect'); }catch(_){}
  setTimeout(()=> info({
    title:'로그인이 끝나지 않았어요',
    body:'구글 인증은 됐는데 앱으로 돌아오면서 끊겼습니다.<br><br>'+
         '<b>사파리(인터넷 브라우저)에서 주소를 직접 열어</b> 로그인해 보세요.<br>'+
         '홈 화면 아이콘으로 여는 앱에서는 이 방식이 막히는 기기가 있습니다.'
  }), 400);
}

document.getElementById('btnLogout').onclick = ()=> signOut(auth);
document.getElementById('btnPendingOut').onclick = ()=> signOut(auth);
document.getElementById('btnCopyUid').onclick = ()=>{
  const t = document.getElementById('pdEmail').textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('이메일을 복사했어요'));
  else toast(t);
};

function show(which){
  ['scLogin','scPending','scApp'].forEach(id=>
    document.getElementById(id).classList.toggle('hide', id!==which));
}

onAuthStateChanged(auth, async (user)=>{
  [unsubDay, unsubWeek, unsubMine, unsubMe, unsubMembers,
   unsubMyLessons, unsubMbLessons, unsubMbBookings, unsubAllLessons].forEach(u=>{ if(u) u(); });
  unsubDay = unsubWeek = unsubMine = unsubMe = unsubMembers = null;
  unsubMyLessons = unsubMbLessons = unsubMbBookings = unsubAllLessons = null;

  if(!user){ ME=null; show('scLogin'); warnRedirectFailed(); return; }

  // 회원 문서의 이름(ID)은 소문자로 바꾼 이메일이다. 구글 계정이 곧 열쇠다.
  const key = (user.email || '').trim().toLowerCase();
  let snap;
  if(!key){ toast('이메일을 확인할 수 없는 계정이에요'); signOut(auth); return; }
  try{ snap = await getDoc(doc(db,'members',key)); }
  catch(e){ toast('회원 정보를 불러오지 못했어요'); show('scLogin'); return; }

  if(!snap.exists() || snap.data().active === false){
    document.getElementById('pdEmail').textContent = user.email || '—';
    show('scPending');
    return;
  }

  ME = { key, uid:user.uid, ...snap.data() };

  // 관리자 문서에 내부 식별자가 없으면 한 번만 만들어 둔다 (손으로 넣을 필요 없게)
  if(ME.role === 'admin' && !ME.mid){
    const mid = newMid();
    try{ await updateDoc(doc(db,'members',key), { mid }); ME.mid = mid; }catch(_){}
  }

  show('scApp');
  document.getElementById('tagAdmin').classList.toggle('hide', !isAdmin());
  buildNav();
  if(isAdmin()) subscribeMembers();   // 예약 추가 모달에서 회원 목록이 필요
  weekStart = startOfWeek(ymd(new Date()));
  calMonth  = ymd(new Date());
  subscribeWeek();                    // 주간 보기 + 홈의 종료 임박 안내에 쓰인다
  go(isAdmin() ? 'today' : 'home');

  // 내 정보 실시간 구독 (연습권 변화 즉시 반영)
  unsubMe = onSnapshot(doc(db,'members',key), s=>{
    if(!s.exists()) return;
    ME = { key, uid:user.uid, ...s.data() };
    render();
  });
  // 내 레슨 완료 기록 (이번 달 몇 회 했는지 보여주려고)
  unsubMyLessons = onSnapshot(
    query(collection(db,'lessons'), where('memberId','==', ME.mid || key)),
    s=>{ myLessons = s.docs.map(d=>({ id:d.id, ...d.data() })).sort(byLessonDate); render(); },
    ()=>{}
  );
  // 내 예약 실시간 구독 — 예약에는 이메일이 아니라 내부 식별자(mid)만 쓴다
  unsubMine = onSnapshot(
    query(collection(db,'bookings'), where('memberId','==', ME.mid || key)),
    s=>{
      myBookings = s.docs.map(d=>({ id:d.id, ...d.data() }))
        .sort((a,b)=> (a.date+pad(a.hour)).localeCompare(b.date+pad(b.hour)));
      render();
    });
});

function svg(k){
  return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';
}
function buildNav(){
  const tabs = isAdmin()
    ? [['today','현황'],['members','회원'],['book','예약'],['me','내 정보']]

function go(p){
  page = p;
  const map = { home:'pgHome', book:'pgBook', me:'pgMe',
                today:'pgToday', members:'pgMembers', member:'pgMember' };
  Object.entries(map).forEach(([k,id])=>
    document.getElementById(id).classList.toggle('hide', k!==p));
  const navKey = (p==='member') ? 'members' : p;   // 상세 화면에서도 '회원' 탭이 켜져 있다
  document.querySelectorAll('#nav [data-go]').forEach(b=>
    b.classList.toggle('on', b.dataset.go===navKey));

/** 레슨 기록을 날짜·시각 순으로 */
function byLessonDate(a,b){
  return ((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''));
}
/**
 * 레슨은 달력이 아니라 '기수'로 묶는다.
 * 4회가 한 기수이고, 4회를 채우면 다음 레슨부터 새 기수가 열린다.
 * 한 주 밀리든 두 주 밀리든 달이 바뀌어도 어긋나지 않는다.
 */
function termsOf(list){
  const map = {};
  (list||[]).forEach(x=>{
    const t = Number(x.term) || 0;      // 0 = 아직 기수가 매겨지지 않은 기록
    (map[t] = map[t] || []).push(x);
  });
  Object.keys(map).forEach(k=> map[k].sort(byLessonDate));
  return map;
}
/** 아직 다 안 찬 기수 번호. 다 찼으면 다음 번호. */
function openTerm(list, quota){
  const map = termsOf(list);
  const nums = Object.keys(map).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
  if(!nums.length) return 1;
  const last = nums[nums.length-1];
  return map[last].length >= (quota||LESSON_QUOTA) ? last+1 : last;
}
/** 그 기수의 레슨만 */
function lessonsInTerm(list, term){
  return (list||[]).filter(x=> (Number(x.term)||0) === Number(term)).sort(byLessonDate);
}
/** '10/2 ~ 10/23' */
function termRange(list){
  if(!list || !list.length) return '';
  const f = d => Number((d||'').slice(5,7))+'/'+Number((d||'').slice(8,10));
  const a = list[0].date, b = list[list.length-1].date;
  return a===b ? f(a) : f(a)+' ~ '+f(b);
}
function termLabel(t){ return Number(t)>0 ? t+'기' : '기수 없음'; }
/** 기수를 고르는 드롭다운 — 앞뒤 두 기수씩 */
function termOptions(sel){
  const n = Number(sel)||1;
  const out = [];
  for(let t=Math.max(1,n-2); t<=n+1; t++) out.push(t);
  return out.map(t=>'<option value="'+t+'"'+(t===n?' selected':'')+'>'+
    t+'기'+(t===n?' (지금 기수)':'')+'</option>').join('');
}
function monthKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }

/**
 * 지금 연습 중이고, 끝나기 5분 안이며, 바로 다음 시간에 예약이 있을 때만 안내한다.
 * 뒤에 아무도 없으면 굳이 재촉하지 않는다.
 */
function endingSoonNotice(){
  const now = new Date();
  const cur = myBookings.find(b=>{
    const st = slotTime(b.date, b.hour).getTime();
    return now.getTime() >= st && now.getTime() < st + 3600000;
  });
  if(!cur) return '';
  const endAt = slotTime(cur.date, cur.hour).getTime() + 3600000;
  const leftMin = Math.max(0, Math.ceil((endAt - now.getTime())/60000));
  if(leftMin > 5) return '';
  const nextB = weekBookings.find(x=>
    x.roomId===cur.roomId && x.date===cur.date && x.hour===cur.hour+1 && x.kind!=='block');
  if(!nextB) return '';
  return '<div class="notice"><b>'+leftMin+'분 뒤 다음 연습이 시작돼요</b><br>'+
    pad(cur.hour+1)+':00 전에 정리하고 나와 주세요. 스틱과 개인 물품을 꼭 챙겨주세요.</div>';
}

function weekGrid(){
  const admin  = isAdmin();
  const todayS = ymd(new Date());
  const now = new Date();
  const days = [];
  for(let i=0;i<7;i++){
    const d = addDays(parseYmd(weekStart), i);
    days.push({ s:ymd(d), d:d.getDate(), w:dow(d) });
  }

  const head = '<div class="wkhead"><div class="corner"></div>'+
    days.map(x=>'<button class="cell'+(x.s===todayS?' on':'')+'" data-act="wkDay" data-d="'+x.s+'">'+
      x.w+'<b>'+x.d+'</b>'+
      '<span class="rooms">'+ROOMS.map(r=>'<i style="background:'+r.color+'"></i>').join('')+'</span>'+
    '</button>').join('')+'</div>';

  const hours = [];
  for(let h=0; h<24; h++) hours.push('<div>'+(h%2===0?pad(h):'')+'</div>');

  const cols = days.map(x=>{
    const rows = [];
    for(let h=0; h<24; h++){
      const segs = ROOMS.map((r,ri)=>{
        const b = weekBookings.find(y=>y.roomId===r.id && y.date===x.s && y.hour===h);
        let cls = 'wc ' + (ri===0 ? 'rb' : 'rw');
        if(b){
          const isMine = b.memberId === myMid();
          if(admin){
            if(b.kind==='block')       cls += ' block';
            else if(b.kind==='lesson') cls += ' lesson';
            else if(isMine)            cls += ' mine';
            else                       cls += ' taken';
          }
          // 회원에게는 내 것만 구분되고 나머지는 전부 한 가지 '사용 불가'다
          else if(isMine && b.kind==='practice') cls += ' mine';
          else if(isMine && b.kind==='lesson')   cls += ' lesson';
          else                                   cls += ' taken';
        } else if(slotTime(x.s,h) <= now) cls += ' past';
        return '<i class="'+cls+'"></i>';
      }).join('');
      rows.push('<button class="wkrow" data-act="wkDay" data-d="'+x.s+'">'+segs+'</button>');
    }
    return '<div class="wkcol'+(x.s===todayS?' today':'')+'">'+rows.join('')+'</div>';
  }).join('');

  return '<div class="wk">'+head+
    '<div class="wkbody"><div class="wkhours">'+hours.join('')+'</div>'+
    '<div class="wkcols">'+cols+'</div></div></div>'+
    '<div class="wklegend">'+
      '<span><i style="background:#17293C"></i>가능</span>'+
      '<span><i style="background:var(--red)"></i>내 예약</span>'+
      '<span><i style="background:#8A7442"></i>'+(admin?'레슨':'내 레슨')+'</span>'+
      '<span><i style="background:#3A5A80"></i>'+(admin?'예약됨':'사용 불가')+'</span>'+
      (admin ? '<span><i style="background:#101C29;border:1px dashed #334B66"></i>닫은 시간</span>' : '')+
    '</div>';
}

/**

 * 달력에는 내 예약·내 레슨·끝난 레슨이 점으로 찍혀서
 * "내가 언제 연습했고 다음 레슨이 언제인지"가 한눈에 들어온다.
 */
function bookDayHTML(){
  return calendarHTML() + dayRoomsHTML();
}

function calendarHTML(){
  const base   = parseYmd(calMonth || ymd(new Date()));
  const y = base.getFullYear(), mo = base.getMonth();
  const first  = new Date(y, mo, 1);
  const start  = addDays(first, -((first.getDay()+6)%7));   // 월요일 시작
  const todayS = ymd(new Date());
  const lastBookable = ymd(addDays(new Date(), BOOK_AHEAD_DAYS-1));
  const admin = isAdmin();

  const cells = [];
  for(let i=0;i<42;i++){
    const d  = addDays(start, i);
    const ds = ymd(d);
    if(i>=35 && d.getMonth()!==mo) break;      // 6주차가 비면 그리지 않는다

    const mineB   = myBookings.filter(b=>b.date===ds);
    const hasBook = mineB.some(b=>b.kind==='practice');
    const hasLes  = mineB.some(b=>b.kind==='lesson');
    const doneLes = myLessons.some(x=>x.date===ds);

    let cls = 'calcell';
    if(d.getMonth()!==mo) cls += ' out';
    else if(!admin && (ds < todayS || ds > lastBookable)) cls += ' off';
    if(mineB.length || doneLes) cls += ' has';
    if(ds === todayS) cls += ' today';
    if(ds === selDate) cls += ' on';

    const dots = [];
    if(hasBook) dots.push('<i style="background:var(--red)"></i>');
    if(hasLes)  dots.push('<i style="background:#C9A961"></i>');
    if(doneLes && !hasLes) dots.push('<i style="background:#6B5B33"></i>');

    cells.push('<button class="'+cls+'" data-act="calPick" data-d="'+ds+'">'+
      '<span>'+d.getDate()+'</span>'+
      '<span class="dots">'+dots.join('')+'</span></button>');
  }

  return '<div class="cal" style="margin-top:14px">'+
      '<div class="calnav">'+
        '<button class="btn sm" data-act="calShift" data-n="-1">‹</button>'+
        '<div class="m">'+y+'년 '+(mo+1)+'월</div>'+
        '<button class="btn sm" data-act="calShift" data-n="1">›</button>'+

function dayRoomsHTML(){
  const admin = isAdmin();
  const now = new Date();

  const rows = [];
  for(let h=0; h<24; h++){
    const tds = ROOMS.map(r=>{
      const b = dayBookings.find(x=> x.roomId===r.id && x.hour===h);
      const past = slotTime(selDate,h) <= now;
      let cls='cell2', st='가능', attr='';

      if(b){
        const isMine = b.memberId === myMid();
        if(admin){
          if(b.kind==='block'){       cls+=' blocked'; st='사용 불가'; }
          else if(b.kind==='lesson'){ cls+=' lesson';  st = esc(nameOf(b))+' 레슨'; }
          else if(isMine){            cls+=' mine';    st='내 예약'; }
          else {                      cls+=' taken';   st = esc(nameOf(b)); }
          attr = ' data-act="admCancel" data-id="'+b.id+'"';
        }
        else if(isMine && b.kind==='practice'){
          cls+=' mine'; st='내 예약';
          attr = ' data-act="cancel" data-id="'+b.id+'"';
        }
        else if(isMine && b.kind==='lesson'){
          cls+=' lesson'; st='내 레슨';
          attr = ' data-act="why" data-w="mylesson"';
        }
        else {
          cls+=' taken'; st='사용 불가';
          attr = ' data-act="why" data-w="taken"';
        }
      }
      else if(past && !admin){ cls+=' past'; st='지난 시간'; }
      else { attr = ' data-act="book" data-h="'+h+'" data-r="'+r.id+'"'; }

      return '<button class="'+cls+'"'+attr+'>'+st+'</button>';
    }).join('');
    rows.push('<div class="hr">'+pad(h)+'</div>'+tds);
  }

  return '<div class="sec"><span>'+fmtDate(selDate)+'</span>'+
      '<span class="muted">1회 1시간</span></div>'+
    '<div class="rooms2">'+
      '<div></div>'+

        r.name+'</div>').join('')+

      ? '<div class="sub muted" style="margin-top:12px">빈 칸을 누르면 내 연습·레슨·회원 예약·차단을 고를 수 있어요.</div>'

/* ===================== 관리자 · 오늘 현황 ===================== */
function renderToday(){
  const modes =
    '<div class="modes" style="margin-top:0;margin-bottom:14px">'+
      '<button data-act="adminMode" data-m="day"  class="'+(adminMode==='day' ?'on':'')+'">하루 타임라인</button>'+
      '<button data-act="adminMode" data-m="week" class="'+(adminMode==='week'?'on':'')+'">주간 한눈에</button>'+
    '</div>';
  if(adminMode==='week'){
    document.getElementById('pgToday').innerHTML = modes + weekNav() + weekGrid();
    bind('pgToday');
    return;
  }

  const HOUR_PX = 40, H = 24*HOUR_PX;
  const now = new Date();
  const isToday = selDate === ymd(now);
  const nowTop = (now.getHours()+now.getMinutes()/60) * HOUR_PX;

  const labels = [];
  for(let h=0; h<24; h+=2)
    labels.push('<div class="hlabel" style="top:'+(h*HOUR_PX-6)+'px">'+pad(h)+':00</div>');

  const tracks = ROOMS.map(r=>{
    const lines = [];
    for(let h=1; h<24; h++)
      lines.push('<div class="hline" style="top:'+(h*HOUR_PX)+'px"></div>');
    const evs = dayBookings.filter(b=>b.roomId===r.id).map(b=>{
      let bg, ink, bd, label;
      if(b.kind==='block'){
        bg='transparent'; ink='var(--mute)'; bd='1px dashed #3A5570'; label='사용 불가';
      } else if(b.kind==='lesson'){
        bg='#2B2518'; ink='#E3CFA6'; bd='1px solid #8A7442'; label='레슨 · '+nameOf(b);
      } else {
        bg=r.fill; ink=r.ink; bd='0'; label=nameOf(b);
      }
      return '<div class="ev" data-act="admCancel" data-id="'+b.id+'" style="top:'+(b.hour*HOUR_PX+3)+
        'px;height:'+(HOUR_PX-6)+'px;background:'+bg+';border:'+bd+';color:'+ink+'">'+
        '<div style="font-size:12px;line-height:1.3">'+esc(label)+'</div>'+
        '<div style="font-size:10px;opacity:.8">'+pad(b.hour)+':00</div></div>';
    }).join('');
    const empties = [];
    for(let h=0; h<24; h++){
      if(!dayBookings.some(b=>b.roomId===r.id && b.hour===h))
        empties.push('<button class="cell" data-act="admSlot" data-r="'+r.id+'" data-h="'+h+'" style="top:'+
          (h*HOUR_PX+3)+'px;height:'+(HOUR_PX-6)+'px"></button>');
    }
    return '<div style="flex:1;min-width:0">'+
      '<div class="colhead" style="background:'+r.fill+';color:'+r.ink+'">'+r.name+'</div>'+
      '<div class="track" style="height:'+H+'px">'+lines.join('')+empties.join('')+evs+
        (isToday ? '<div class="now" style="top:'+nowTop+'px"></div>' : '')+
      '</div></div>';
  }).join('');

  const cnt = dayBookings.filter(b=>b.kind!=='block').length;
  const cb  = dayBookings.filter(b=>b.roomId==='black'&&b.kind!=='block').length;
  const cw  = dayBookings.filter(b=>b.roomId==='white'&&b.kind!=='block').length;

  document.getElementById('pgToday').innerHTML = modes +
    '<div class="row">'+
      '<button class="btn sm" data-act="dayShift" data-n="-1">‹</button>'+
      '<div style="flex:1;text-align:center" class="num">'+fmtDate(selDate)+'</div>'+
      '<button class="btn sm" data-act="dayShift" data-n="1">›</button>'+
      '<button class="btn sm" data-act="dayToday">오늘</button>'+
    '</div>'+
    '<div class="row" style="margin-top:12px;gap:9px">'+
      stat(cnt,'오늘 예약','')+ stat(cb,'블랙룸','#8FB0D4')+ stat(cw,'화이트룸','#E3CFA6')+
    '</div>'+
    '<div class="sec"><span>실시간 현황</span>'+
      (isToday?'<span class="rose">지금 '+pad(now.getHours())+':'+pad(now.getMinutes())+'</span>':'<span></span>')+'</div>'+
    '<div class="tl"><div class="axis" style="position:relative;height:'+H+'px;margin-top:30px">'+
      labels.join('')+'</div>'+tracks+'</div>'+
    '<div class="sub muted" style="margin-top:12px">빈 칸을 누르면 예약을 추가하거나 시간을 차단할 수 있어요.</div>';

  bind('pgToday');
  // 현재 시각 근처로 한 번만 스크롤 (실시간 갱신마다 튀지 않도록)
  if(isToday && scrolledFor !== selDate){
    scrolledFor = selDate;
    window.scrollTo(0, Math.max(0, nowTop - 180));
  }
}
function stat(n,label,color){
  return '<div class="card" style="flex:1;padding:13px 0;text-align:center">'+
    '<div class="num" style="font-size:23px;line-height:1'+(color?';color:'+color:'')+'">'+n+'</div>'+
    '<div class="sub" style="margin-top:6px">'+label+'</div></div>';

/** 지난 기수를 최신순으로. 진행 중인 기수는 위에 따로 있으므로 뺀다. */
function termHistory(m, curTerm, quota){
  const map = termsOf(mbLessons);
  const nums = Object.keys(map).map(Number).sort((a,b)=>b-a).filter(t=>t!==curTerm);
  if(!nums.length) return '<div class="empty">지난 기수가 없어요</div>';
  return nums.map(t=>{
    const rows = map[t];
    const pay  = t>0 ? payOf(m, t) : null;
    return '<div class="card flat" style="margin-bottom:10px">'+
      '<div class="row" style="margin-bottom:9px">'+
        '<div class="sub gold">'+termLabel(t)+'</div>'+
        '<div class="sub muted">'+esc(termRange(rows))+'</div>'+
        '<div class="spacer"></div>'+
        '<div class="sub muted">'+rows.length+' / '+quota+'회</div>'+
      '</div>'+
      rows.slice().reverse().map(x=>lessonRow(x)).join('')+
      (t>0
        ? '<button class="lrow" style="margin-top:4px" data-act="payForm" '+
            'data-key="'+m.key+'" data-t="'+t+'">'+
            '<span class="d">레슨비</span>'+
            '<span class="n" style="color:'+(pay?'#9FD2A8':'var(--mute)')+'">'+
              (pay ? (pay.date?fmtDate(pay.date)+' 입금':'입금 확인됨')+
                     (pay.amount?' · '+won(pay.amount):'')
                   : '확인 전')+'</span>'+
            '<span class="go">'+(pay?'수정':'입력')+'</span></button>'
        : '')+
    '</div>';
  }).join('');
}

function kakaoLink(v){
  const t = String(v||'').trim();
  if(/^https?:\/\//i.test(t))
    return '<a href="'+esc(t)+'" target="_blank" rel="noopener" '+
           'style="word-break:break-all">카카오톡 열기 ↗</a>';

/**
 * 입금 내역은 '기수 → {입금일, 금액, 메모}' 로 둔다.
 * 레슨도 같은 기수로 묶이므로 둘이 저절로 맞물린다.
 */
function payOf(m, term){
  if(!m) return null;
  return (m.payments||{})[String(term)] || null;
}
function won(n){ return Number(n||0).toLocaleString('ko-KR')+'원'; }
/** 기수를 고르는 드롭다운은 termOptions에 있다 */

function lessonRow(x){

/* ===================== 동작 바인딩 ===================== */
function bind(rootId){
  document.getElementById(rootId).querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = ()=> handle(el.dataset);
  });
}
async function handle(d){
  switch(d.act){
    case 'goBook':  go('book'); break;
    case 'date':    selDate = d.d; subscribeDay(); renderBook(); break;
    case 'room':    selRoom = d.r; renderBook(); break;
    case 'book':    if(d.r) selRoom = d.r; confirmBook(Number(d.h)); break;
    case 'why':     whyBlocked(d.w); break;
    case 'bookMode':  bookMode  = d.m; render(); break;
    case 'calPick':   selDate = d.d; subscribeDay(); render(); break;
    case 'calShift':  calMonth = shiftMonth(calMonth, Number(d.n)); render(); break;
    case 'calToday':  calMonth = ymd(new Date()); selDate = ymd(new Date());
                      subscribeDay(); render(); break;
    case 'adminMode': adminMode = d.m; render(); break;
    case 'wkShift': weekStart = ymd(addDays(parseYmd(weekStart), Number(d.n)*7));
                    subscribeWeek(); render(); break;
    case 'wkNow':   weekStart = startOfWeek(ymd(new Date()));
  calMonth  = ymd(new Date()); subscribeWeek(); render(); break;
    case 'wkDay':   selDate = d.d;
                    if(page==='book') bookMode = 'day'; else adminMode = 'day';
                    subscribeDay(); render(); break;
    case 'cancel':  confirmCancel(d.id); break;
    case 'dayShift':selDate = ymd(addDays(parseYmd(selDate), Number(d.n))); subscribeDay(); renderToday(); break;
    case 'dayToday':selDate = ymd(new Date()); subscribeDay(); renderToday(); break;
    case 'admSlot': admSlot(d.r, Number(d.h)); break;
    case 'admCancel': admCancel(d.id); break;
    case 'blockMode': go('today'); toast('빈 칸을 누르면 차단할 수 있어요'); break;
    case 'addMember': formMember(null); break;
    case 'editMember': formMember(members.find(m=>m.key===d.key)); break;
    case 'openMember': openMember(d.key); break;
    case 'backMembers': selMember=''; go('members'); break;
    case 'lessonNew':  lessonForm(null); break;
    case 'lessonEdit': lessonForm(mbLessons.find(x=>x.id===d.id)); break;
    case 'payForm':    payForm(d.key, d.t); break;
    case 'sortTerms':  sortTerms(d.key); break;
    case 'planLessons': planLessons(d.key); break;
    case 'moveBooking': moveBooking(d.id); break;
    case 'weekly':     setWeekly(d.key, Number(d.n)); break;
    case 'admCancelAny': admCancelAny(d.id); break;
  }
}

/* ===================== 예약 / 취소 ===================== */
function confirmBook(hour){
  const r = roomOf(selRoom);
  // 관리자는 내 연습 · 레슨 · 회원 예약 · 차단 중에서 고른다
  if(isAdmin()){ admSlot(selRoom, hour); return; }
  if(liveCredits(ME) < 1){
    info({ title:'연습권이 없어요',
      body:'다음 레슨을 마치면 연습권이 지급됩니다.<br>자세한 내용은 관리자에게 문의해 주세요.' });
    return;
  }
  ask({
    title:'이 시간으로 예약할까요?',
    body: fmtDate(selDate)+' '+pad(hour)+':00 – '+pad(hour+1)+':00<br>'+
          r.name+' · 1시간'+
          '<br><br><span style="color:var(--white-room)">연습권 1시간이 차감됩니다.</span>',
    ok:'예약하기',
    onOk: ()=> doBook(hour)
  });
}

/** 회원이 쓸 수 없는 칸을 눌렀을 때의 안내 */
function whyBlocked(w){
  if(w==='mylesson')
    info({ title:'내 레슨 시간이에요',
           body:'이 시간에는 레슨이 있습니다.<br>일정을 바꾸시려면 리듬 하우스에 문의해 주세요.' });
  else
    info({ title:'사용할 수 없는 시간이에요',
           body:'이미 찬 시간입니다.<br>다른 시간을 선택해 주세요.' });
}
async function doBook(hour){
  const r = roomOf(selRoom);
  const id = bookingId(selRoom, selDate, hour);
  const admin = isAdmin();
  try{
    await runTransaction(db, async tx=>{
      const bRef = doc(db,'bookings',id);
      const mRef = doc(db,'members',ME.key);
      const bSnap = await tx.get(bRef);
      if(bSnap.exists()) throw new Error('TAKEN');

      // 읽기를 먼저 끝내고 쓰기로 넘어간다 (트랜잭션 규칙)
      let m = null;
      if(!admin){
        const mSnap = await tx.get(mRef);
        m = mSnap.data();
        if(m.expiresAt && m.expiresAt < ymd(new Date())) throw new Error('EXPIRED');
        if((m.credits||0) < 1) throw new Error('NOCREDIT');
      }

      // 이름은 저장하지 않는다 — 회원끼리 서로를 알 수 없게 하기 위해서다
      tx.set(bRef, {
        roomId: selRoom, roomName: r.name, date: selDate, hour,
        memberId: myMid(), kind:'practice',
        addedByAdmin: admin, createdAt: serverTimestamp()
      });
      if(!admin){
        tx.update(mRef, { credits: (m.credits||0) - 1 });
      }
    });
    toast('예약되었어요');
  }catch(e){
    if(e.message==='TAKEN') toast('방금 다른 분이 예약했어요');
    else if(e.message==='NOCREDIT') toast('연습권이 부족해요');
    else if(e.message==='EXPIRED') toast('연습권 유효기간이 지났어요');
    else { console.error(e); toast('예약에 실패했어요'); }
  }
}
function confirmCancel(id){
  const b = myBookings.find(x=>x.id===id) || dayBookings.find(x=>x.id===id);
  if(!b) return;
  const start = slotTime(b.date,b.hour);
  if((start - Date.now()) <= CANCEL_LIMIT_H*3600*1000){
    info({ title:'취소할 수 없어요',
      body:'예약 시작 '+CANCEL_LIMIT_H+'시간 전부터는 취소·변경이 불가능합니다.' });
    return;
  }
  ask({
    title:'예약을 취소할까요?',
    body: fmtDate(b.date)+' '+pad(b.hour)+':00 · '+roomOf(b.roomId).name+
          (b.addedByAdmin ? ''
            : '<br><br><span style="color:var(--white-room)">연습권 1시간이 돌아옵니다.</span>'),
    ok:'예약 취소',
    onOk: ()=> doCancel(b)
  });
}
async function doCancel(b){
  // 관리자 예약은 차감이 없었으므로 환급도 하지 않는다
  const refund = !b.addedByAdmin;
  try{
    await runTransaction(db, async tx=>{
      const bRef = doc(db,'bookings',b.id);
      const mRef = doc(db,'members',ME.key);
      const bSnap = await tx.get(bRef);
      if(!bSnap.exists()) throw new Error('GONE');
      let m = null;
      if(refund){
        const mSnap = await tx.get(mRef);
        m = mSnap.data();
      }
      tx.delete(bRef);
      if(refund){
        tx.update(mRef, { credits: (m.credits||0) + 1 });
      }
    });
    toast('예약이 취소되었어요');
  }catch(e){
    if(e.message==='GONE') toast('이미 취소된 예약이에요');
    else { console.error(e); toast('취소에 실패했어요'); }
  }
}

        '</div>'+
        '<div class="sub muted" style="font-size:11px;line-height:1.6">'+

          '레슨은 회원을 고르지 않으면 이름 없이 잡힙니다.</div>'+

        '<button class="btn" style="height:46px;margin-top:4px" id="admBlock">이 시간 닫기 (사용 불가)</button>'+
        '<button class="btn" style="height:44px" id="admClose">닫기</button>'+

  host.querySelector('#admClose').onclick = closeModal;

  host.querySelector('#admMine').onclick = async ()=>{

    await writeSlot(roomId, hour, { kind:'practice', memberId: myMid() });

  };
  host.querySelector('#admBlock').onclick = async ()=>{

  };
  host.querySelector('#admAdd').onclick = async ()=>{
    const mid = host.querySelector('#admWho').value;
    if(!mid){ toast('회원을 선택해 주세요'); return; }
    closeModal();
    await writeSlot(roomId, hour, { kind:'practice', memberId:mid });

  };
  host.querySelector('#admLesson').onclick = async ()=>{

    await writeSlot(roomId, hour, { kind:'lesson', memberId: mid || myMid() });
    toast('레슨 일정을 잡았어요');

}
async function writeSlot(roomId, hour, extra){
  const r = roomOf(roomId);
  try{
    await setDoc(doc(db,'bookings', bookingId(roomId, selDate, hour)), {
      roomId, roomName:r.name, date:selDate, hour,
      addedByAdmin:true, createdAt:serverTimestamp(), ...extra
    });
  }catch(e){ console.error(e); toast('저장에 실패했어요'); }
}
function admCancel(id){
  const b = dayBookings.find(x=>x.id===id);
  if(!b) return;
  const who = b.kind==='lesson' ? ('레슨 · '+nameOf(b)) : nameOf(b);
  const refundNote = (b.kind==='practice' && b.memberId && !b.addedByAdmin)
    ? '<br><br><span class="muted">회원의 연습권 1시간이 돌아갑니다.</span>' : '';
  ask({
    title: b.kind==='block'  ? '이 시간을 다시 열까요?'
         : b.kind==='lesson' ? '레슨 일정을 지울까요?'
         : '이 예약을 취소할까요?',
    body: fmtDate(b.date)+' '+pad(b.hour)+':00 · '+roomOf(b.roomId).name+'<br>'+esc(who)+refundNote,
    ok: b.kind==='block' ? '다시 열기' : b.kind==='lesson' ? '레슨 삭제' : '예약 취소',
    onOk: async ()=>{
      try{
        if(b.kind==='practice' && b.memberId && !b.addedByAdmin){
          await runTransaction(db, async tx=>{
            const target = members.find(x=>(x.mid||x.key)===b.memberId);
            if(!target) throw new Error('NOMEMBER');
            const mRef = doc(db,'members',target.key);
            const mSnap = await tx.get(mRef);

            if(mSnap.exists()){
              const m = mSnap.data();
              tx.update(mRef, { credits:(m.credits||0)+1 });
            }
          });

          await deleteDoc(doc(db,'bookings',b.id));
        }
        toast('처리했어요');
      }catch(e){ console.error(e); toast('처리에 실패했어요'); }

function openMember(key){
  const m = members.find(x=>x.key===key);
  if(!m) return;
  selMember = key;
  subscribeMember(m.mid || m.key);
  go('member');
}

/**
 * 주간 연습 시간을 올리고 내린다.
 * 자동 승급을 두지 않는 이유 — 연습이 잘 되고 있는지는
 * 가르치는 사람이 보는 게 어떤 계산보다 정확하기 때문이다.
 */
async function setWeekly(key, delta){
  const m = members.find(x=>x.key===key);
  if(!m) return;
  const next = Math.max(1, Math.min(WEEKLY_MAX, weeklyOf(m) + delta));
  if(next === weeklyOf(m)) return;
  try{
    await updateDoc(doc(db,'members',key), { weeklyHours: next });
    toast('주 '+next+'시간으로 바꿨어요 · 다음 지급부터 적용');
  }catch(e){ console.error(e); toast('저장에 실패했어요'); }
}

 * 레슨비 입금 — 수강 월, 입금일, 금액, 메모를 넣는다.

  const rows = lessonsInTerm(mbLessons, t);
  const host = document.getElementById('modalHost');
  host.innerHTML =
    '<div class="overlay"><div class="modal">'+
      '<h3>'+t+'기 레슨비</h3>'+
      '<p>'+esc(m.name||'회원')+
        (rows.length ? ' · '+esc(termRange(rows))+' · '+rows.length+'회' : '')+'</p>'+
      '<div class="col" style="margin-top:16px">'+
        '<div><label for="pyTerm">기수</label>'+
          '<select id="pyTerm">'+termOptions(t)+'</select></div>'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1.3"><label for="pyDate">입금일</label>'+
            '<input id="pyDate" type="date" value="'+
            esc(cur&&cur.date ? cur.date : ymd(new Date()))+'"></div>'+
          '<div style="flex:1"><label for="pyAmt">금액</label>'+
            '<input id="pyAmt" type="number" min="0" step="1000" value="'+
            ((cur&&cur.amount) || LESSON_FEE)+'"></div>'+
        '</div>'+
        '<div><label for="pyMemo">메모 (선택)</label>'+
          '<input id="pyMemo" value="'+esc(cur?(cur.memo||''):'')+'" '+
          'placeholder="토스뱅크, 학부모 입금 등"></div>'+
        '<div class="row" style="gap:9px;margin-top:6px">'+
          '<button class="btn" style="flex:1;height:48px" id="pyCancel">취소</button>'+

/**
 * 레슨 일정을 한 번에 여러 주 잡는다.
 * 등록할 때 시간 협의가 끝나 있으니, 기수 전체를 미리 깔아두는 쪽이 자연스럽다.
 * 회원 화면에는 바로 '다음 레슨'으로 뜬다.
 */
function planLessons(key){
  const m = members.find(x=>x.key===key);
  if(!m) return;
  const quota = m.lessonQuota || LESSON_QUOTA;
  const now = new Date();

  // 기본값 — 그 회원의 기본 요일·시각에서 가장 가까운 앞날
  let d0 = addDays(now, 1);
  if(m.lessonDay != null){
    for(let i=1;i<=7;i++){
      const d = addDays(now, i);
      if(d.getDay() === m.lessonDay){ d0 = d; break; }
    }
  }
  const defTime = m.lessonTime || '16:00';

  const host = document.getElementById('modalHost');
  host.innerHTML =
    '<div class="overlay"><div class="modal">'+
      '<h3>레슨 일정 미리 잡기</h3>'+
      '<p>'+esc(m.name||'회원')+' · 연습실도 함께 선점됩니다</p>'+
      '<div class="col" style="margin-top:16px">'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1.3"><label for="plDate">첫 레슨 날짜</label>'+
            '<input id="plDate" type="date" value="'+ymd(d0)+'"></div>'+
          '<div style="flex:1"><label for="plTime">시각</label>'+
            '<input id="plTime" type="time" value="'+esc(defTime)+'"></div>'+
        '</div>'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1"><label for="plRoom">연습실</label>'+
            '<select id="plRoom">'+ROOMS.map(r=>
              '<option value="'+r.id+'">'+r.name+'</option>').join('')+'</select></div>'+
          '<div style="flex:1"><label for="plCount">횟수</label>'+
            '<input id="plCount" type="number" min="1" max="12" value="'+quota+'"></div>'+
        '</div>'+
        '<div><label for="plEvery">간격</label>'+
          '<select id="plEvery">'+
            '<option value="7">매주 같은 요일</option>'+
            '<option value="14">격주</option>'+
          '</select></div>'+
        '<div class="sub muted" style="font-size:11px;line-height:1.6">'+
          '이미 찬 시간은 건너뜁니다. 나중에 날짜가 바뀌면 '+
          '아래 <b>다가오는 예약</b>에서 그 레슨을 눌러 옮길 수 있어요.</div>'+
        '<div class="row" style="gap:9px;margin-top:6px">'+
          '<button class="btn" style="flex:1;height:48px" id="plCancel">취소</button>'+
          '<button class="btn primary" style="flex:1;height:48px" id="plSave">일정 잡기</button>'+
        '</div>'+
      '</div></div></div>';

  host.querySelector('#plCancel').onclick = closeModal;
  host.querySelector('#plSave').onclick = async ()=>{
    const date  = host.querySelector('#plDate').value;
    const time  = host.querySelector('#plTime').value;
    const room  = host.querySelector('#plRoom').value;
    const count = Math.max(1, Math.min(12, Number(host.querySelector('#plCount').value)||quota));
    const every = Number(host.querySelector('#plEvery').value) || 7;
    if(!date || !time){ toast('날짜와 시각을 입력해 주세요'); return; }
    const hour = Number(time.slice(0,2));
    closeModal();

    const r = roomOf(room);
    let made = 0, skipped = [];
    for(let i=0;i<count;i++){
      const ds = ymd(addDays(parseYmd(date), i*every));
      const id = bookingId(room, ds, hour);
      try{
        const snap = await getDoc(doc(db,'bookings',id));
        if(snap.exists()){ skipped.push(fmtDate(ds)); continue; }
        await setDoc(doc(db,'bookings',id), {
          roomId:room, roomName:r.name, date:ds, hour,
          memberId: (m.mid||m.key), kind:'lesson',
          addedByAdmin:true, createdAt: serverTimestamp()
        });
        made++;
      }catch(e){ console.error(e); skipped.push(fmtDate(ds)); }
    }
    info({ title: made ? '레슨 일정을 '+made+'회 잡았어요' : '잡은 일정이 없어요',
      body: esc(m.name||'회원')+' · '+r.name+' · '+pad(hour)+':00'+
        (skipped.length
          ? '<br><br><span class="rose">이미 차 있어 건너뛴 날</span><br>'+
            '<span class="muted">'+skipped.map(esc).join('<br>')+'</span>'
          : '<br><br><span class="muted">회원 화면에 다음 레슨으로 바로 보입니다.</span>') });
  };
}

/**
 * 예전 방식(기수 없이) 남긴 기록을 날짜순으로 quota개씩 묶어 기수를 매긴다.
 * 한 번만 쓰는 정리 기능이라 전체를 다시 번호 매긴다.
 */
function sortTerms(key){
  const m = members.find(x=>x.key===key);
  if(!m) return;
  const quota = m.lessonQuota || LESSON_QUOTA;
  const all = mbLessons.slice().sort(byLessonDate);
  ask({
    title:'기수를 정리할까요?',
    body: '레슨 '+all.length+'건을 날짜순으로 '+quota+'회씩 묶어<br>1기부터 다시 번호를 매깁니다.'+
          '<br><br><span class="muted">이미 매겨둔 기수도 다시 계산됩니다.</span>',
    ok:'정리하기',
    onOk: async ()=>{
      try{
        for(let i=0;i<all.length;i++){
          const t = Math.floor(i/quota) + 1;
          if(Number(all[i].term) !== t)
            await updateDoc(doc(db,'lessons',all[i].id), { term: t });
        }
        toast('기수를 정리했어요');
      }catch(e){ console.error(e); toast('정리에 실패했어요'); }
    }
  });
}

/**
 * 연습권을 지급한다. 지급량은 관리자가 정해둔 주간 시간 그대로다.
 * 자동으로 올리거나 내리지 않는다 — 늘릴지 말지는 관리자가 보고 판단한다.
 */
async function grantCredits(m){
  const now = new Date();
  await updateDoc(doc(db,'members',m.key), {
    credits: weeklyOf(m),
    cycleStart: ymd(now),
    expiresAt: ymd(addDays(now, CREDIT_DAYS)),
    lastLessonAt: serverTimestamp()
  });
}
function weeklyOf(m){ return (m && m.weeklyHours) || TIER_BASE; }

        (isNew ? '' :
          '<div><label for="fmCredit">연습권 직접 조정 (시간)</label>'+
          '<input id="fmCredit" type="number" min="0" max="20" value="'+(m.credits||0)+'"></div>')+
        '<div class="row" style="gap:9px;margin-top:6px">'+
          '<button class="btn" style="flex:1;height:48px" id="fmCancel">취소</button>'+
          '<button class="btn primary" style="flex:1;height:48px" id="fmSave">저장</button>'+
        '</div>'+
        (isNew ? '' : '<button class="btn" style="height:44px;color:var(--red-l);border-color:#5A2A26" id="fmDel">회원 삭제</button>')+
      '</div></div></div>';

  host.querySelector('#fmCancel').onclick = closeModal;
  if(!isNew) host.querySelector('#fmDel').onclick = ()=>{
    closeModal();
    ask({ title:'회원을 삭제할까요?',
      body: esc(m.name||'')+'님을 명단에서 지웁니다.<br>이 주소로는 더 이상 로그인할 수 없게 됩니다.<br>지난 예약 기록은 남습니다.',
      ok:'삭제', onOk: async ()=>{
        try{ await deleteDoc(doc(db,'members',m.key)); toast('삭제했어요'); }
        catch(e){ toast('삭제에 실패했어요'); }
      }});
  };
  host.querySelector('#fmSave').onclick = async ()=>{
    const name  = host.querySelector('#fmName').value.trim();
    const phone = host.querySelector('#fmPhone').value.trim();
    const dayV  = host.querySelector('#fmDay').value;
    const time  = host.querySelector('#fmTime').value;
    if(!name){ toast('이름을 입력해 주세요'); return; }
    const quota = Number(host.querySelector('#fmQuota').value);
    const patch = {
      name, phone,
      lessonDay: dayV==='' ? null : Number(dayV),
      lessonTime: time || null,
      lessonQuota: (isNaN(quota)||quota<1) ? LESSON_QUOTA : Math.min(30, Math.round(quota)),
      kakao:         host.querySelector('#fmKakao').value.trim(),
      guardianName:  host.querySelector('#fmGName').value.trim(),
      guardianPhone: host.querySelector('#fmGPhone').value.trim(),
      memo:          host.querySelector('#fmMemo').value.trim()
    };
    if(isNew){
      const email = host.querySelector('#fmEmail').value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('구글 주소를 정확히 입력해 주세요'); return; }
      if(members.some(x=>x.key===email)){ toast('이미 등록된 주소예요'); return; }
      closeModal();
      await createMember({ ...patch, email });
    } else {
      const credit = Number(host.querySelector('#fmCredit').value);
      closeModal();
      try{
        await updateDoc(doc(db,'members',m.key), {
          ...patch,
          credits: isNaN(credit) ? (m.credits||0) : Math.max(0,credit)
        });
        toast('저장했어요');
      }catch(e){ console.error(e); toast('저장에 실패했어요'); }
    }
  };
}

/**
 * 회원 등록 = 구글 주소를 명단에 올리는 일이다.
 * 비밀번호를 만들지 않으므로 관리자 로그인이 풀릴 일도 없다.
 * 문서 이름(ID)이 곧 소문자로 바꾼 이메일이다.
 */
async function createMember(p){
  const { name, phone, email } = p;
  try{
    await setDoc(doc(db,'members', email), {
      mid: newMid(),
      name, phone, email, role:'member', active:true,
      lessonDay: p.lessonDay==null?null:p.lessonDay, lessonTime: p.lessonTime||null,
      lessonQuota: p.lessonQuota || LESSON_QUOTA,
      kakao: p.kakao||'', guardianName: p.guardianName||'',
      guardianPhone: p.guardianPhone||'', memo: p.memo||'',
      payments: {},
      credits:0, weeklyHours:TIER_BASE,
      cycleStart:null, expiresAt:null, createdAt: serverTimestamp()
    });
    info({ title:'회원을 등록했어요',
      body: esc(name)+'님<br><br>'+
            '등록한 구글 주소<br><b>'+esc(email)+'</b><br><br>'+
            '<span class="muted">사이트 주소를 보내 주시고, 들어가서 '+
            '<b>Google 계정으로 로그인</b>을 누르시면 됩니다.<br>'+
            '첫 레슨을 마치면 연습권이 지급됩니다.</span>' });
  }catch(e){ console.error(e); toast('등록에 실패했어요'); }
}

/* 버전을 화면에 적어둔다 — 올린 파일이 제대로 반영됐는지 바로 알 수 있게 */
document.getElementById('verLogin').textContent = APP_VERSION;

/* ===================== 서비스 워커 ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* 분이 바뀌면 홈의 종료 안내와 현황의 '지금' 선을 다시 그린다 */
let lastMinute = -1;
setInterval(()=>{
  const m = new Date().getMinutes();
  if(m === lastMinute) return;
  lastMinute = m;
  if(ME && (page==='home' || page==='today')) render();
}, 5000);
</script>
