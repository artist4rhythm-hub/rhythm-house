<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>리듬 하우스 · 연습실 예약</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1A2A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="리듬 하우스">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
@font-face{font-family:'Cafe24 Lovingu';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround Air';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff') format('woff');}

:root{
  --ground:#0B1A2A; --surf:#13283E; --surf2:#1B3350; --deep:#101F31;
  --line:#27425F; --line-soft:#1B3148;
  --cream:#F3E7D2; --dim:#9FB3C8; --mute:#7E96AD;
  --red:#C8463A; --red-l:#E8705F;
  --black-room:#5C82AD; --white-room:#E3CFA6;
  --f-logo:'Cafe24 Lovingu','Gothic A1',cursive;
  --f-head:'Cafe24 Ssurround','Gothic A1',sans-serif;
  --f-body:'Cafe24 Ssurround Air','Gothic A1',sans-serif;

  /* 폰의 시계·배터리 표시줄과 홈 바를 피하기 위한 여백.
     홈 화면에 설치해 전체화면으로 열었을 때만 값이 생긴다. */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ground);color:var(--cream);font-family:var(--f-body);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select{background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:0 14px;height:48px;color:var(--cream);width:100%}
input:focus,select:focus{outline:none;border-color:var(--black-room)}
label{font-size:13px;color:var(--dim);display:block;margin-bottom:8px}
.hide{display:none !important}

/* ---------- 레이아웃 ---------- */
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:var(--ground);position:relative}
@media(min-width:560px){
  body{background:#07121D}
  .wrap{box-shadow:0 0 70px rgba(0,0,0,.55)}
}
.topbar{height:calc(58px + var(--sat));flex-shrink:0;display:flex;align-items:center;gap:9px;
  padding:var(--sat) calc(18px + var(--sar)) 0 calc(18px + var(--sal));
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;
  background:rgba(11,26,42,.92);backdrop-filter:blur(10px);z-index:20}
.topbar img{width:28px;height:29px;object-fit:contain}
.wordmark{font-family:var(--f-logo);font-size:21px;line-height:1}
.spacer{flex:1}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);
  color:var(--dim);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--red);border-color:var(--red);color:#FFF6EC}
.main{flex:1;padding:18px calc(18px + var(--sar)) calc(92px + var(--sab)) calc(18px + var(--sal))}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
  height:calc(72px + var(--sab));
  border-top:1px solid var(--line-soft);background:#0A1725;display:flex;align-items:flex-start;
  padding:0 calc(6px + var(--sar)) var(--sab) calc(6px + var(--sal));z-index:20}
.nav button{flex:1;height:72px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--mute);font-size:11px;padding:6px 0}
.nav button.on{color:var(--cream)}

/* ---------- 카드 ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.flat{background:var(--deep)}
.sec{font-size:13px;color:var(--dim);margin:20px 0 10px;display:flex;
  align-items:center;justify-content:space-between}
.h1{font-family:var(--f-head);font-size:21px;line-height:1.45}
.big{font-family:var(--f-head);font-size:44px;line-height:1}
.num{font-family:var(--f-head)}
.sub{font-size:12px;color:var(--dim)}
.muted{color:var(--mute)}
.gold{color:var(--white-room)}
.rose{color:var(--red-l)}
.bar{height:7px;border-radius:4px;background:var(--ground);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--red)}
.cta{height:56px;border-radius:14px;background:var(--red);color:#FFF6EC;
  font-family:var(--f-head);font-size:17px;width:100%;display:flex;
  align-items:center;justify-content:center;gap:8px}
.cta[disabled]{background:var(--surf2);color:var(--mute)}
.btn{height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  color:var(--dim);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--red);border-color:var(--red);color:#FFF6EC}
.btn.sm{height:34px;padding:0 11px;font-size:12px;border-radius:9px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.empty{padding:34px 0;text-align:center;color:var(--mute);font-size:13px}

/* ---------- 예약 ---------- */
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;width:52px;height:56px;border-radius:12px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim)}
.dates button .d{font-family:var(--f-head);font-size:16px}
.dates button .w{font-size:11px;opacity:.85}
.dates button.on{background:var(--cream);border-color:var(--cream);color:#0B1A2A}
.rooms{display:flex;gap:9px}
.rooms button{flex:1;height:46px;border-radius:11px;border:1px solid var(--line);color:var(--dim);font-size:14px}
.rooms button.on[data-r="black"]{background:#3E5F82;border-color:var(--black-room);color:var(--cream)}
.rooms button.on[data-r="white"]{background:var(--white-room);border-color:var(--white-room);color:#0B1A2A}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:54px;border-radius:11px;border:1px solid var(--line);background:var(--surf);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream)}
.slot .hr{font-family:var(--f-head);font-size:16px;line-height:1}
.slot .st{font-size:9px;opacity:.8}
.slot.taken{background:#16293D;border-color:#20364E;color:var(--mute)}
.slot.mine{background:var(--red);border-color:var(--red);color:#FFF6EC}
.slot.lesson{background:#2B2518;border-color:#8A7442;color:#E3CFA6}
.slot.blocked{background:transparent;border-style:dashed;border-color:#3A5570;color:var(--mute)}
.slot.past{background:transparent;border-color:var(--line-soft);color:#4C637B;cursor:not-allowed}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--dim)}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- 타임라인 ---------- */
.tl{display:flex;gap:8px}
.tl .axis{width:40px;flex-shrink:0}
.tl .colhead{height:30px;border-radius:9px 9px 0 0;display:flex;align-items:center;
  justify-content:center;font-size:12px}
.tl .track{position:relative;background:var(--deep);border:1px solid var(--line-soft);
  border-radius:0 0 9px 9px;overflow:hidden}
.tl .hline{position:absolute;left:0;right:0;border-top:1px solid #192E44}
.tl .hlabel{position:absolute;left:0;font-size:10px;color:var(--mute)}
.tl .ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:6px 9px;overflow:hidden}
.tl .now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:5}
.tl .cell{position:absolute;left:4px;right:4px;border-radius:8px}

/* ---------- 모달 / 토스트 ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,12,20,.76);display:flex;align-items:center;
  justify-content:center;z-index:60;backdrop-filter:blur(3px);overflow-y:auto;
  padding:calc(22px + var(--sat)) calc(22px + var(--sar)) calc(22px + var(--sab)) calc(22px + var(--sal))}
.modal{width:100%;max-width:400px;background:var(--surf);border:1px solid var(--line);
  border-radius:20px;padding:22px}
.modal h3{font-family:var(--f-head);font-size:19px;font-weight:400;margin-bottom:10px}
.modal p{font-size:14px;color:var(--dim);line-height:1.65}
.modal .acts{display:flex;gap:9px;margin-top:20px}
.modal .acts .btn{flex:1;height:48px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--surf2);
  border:1px solid var(--line);color:var(--cream);padding:13px 20px;border-radius:13px;
  font-size:14px;z-index:80;max-width:88%;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.4)}

/* ---------- 로그인 ---------- */
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:calc(40px + var(--sat)) calc(30px + var(--sar)) 30px calc(30px + var(--sal))}
.auth .brand{display:flex;flex-direction:column;align-items:center}
.auth .brand img{width:116px;height:122px;object-fit:contain}
.auth .brand .lg{font-family:var(--f-logo);font-size:44px;line-height:1.2;margin-top:12px}
.auth .brand .tag{font-size:13px;color:var(--dim);letter-spacing:2px;margin-top:4px}
.foot{text-align:center;padding:22px 0 calc(26px + var(--sab));font-size:12px;color:var(--mute)}
.keys{font-family:var(--f-head);font-size:11px;letter-spacing:2px;color:var(--red);margin-top:8px}
a{color:var(--red-l)}
</style>
</head>
<body>

<!-- ===================== 로그인 ===================== -->
<div class="wrap" id="scLogin">

    </div>

    문의 <a href="tel:01065178291">010-6517-8291</a>

</div>

<!-- ===================== 미등록 계정 ===================== -->
<div class="wrap hide" id="scPending">
  <div class="auth">
    <div class="brand">
      <img src="logo.png" alt="">
      <div class="lg">Rhythm House</div>
    </div>
    <div class="card" style="margin-top:30px">
      <div class="h1" style="font-size:18px">아직 등록되지 않은 계정이에요</div>

        로그인은 되었지만 회원 정보가 없습니다.<br>관리자에게 아래 정보를 전달해 주세요.
      </p>
      <div class="card flat" style="margin-top:14px;padding:14px">
        <div class="sub">이메일</div>
        <div style="font-size:14px;margin-top:3px" id="pdEmail">—</div>

<!-- ===================== 앱 ===================== -->
<div class="wrap hide" id="scApp">
  <div class="topbar">
    <img src="logo.png" alt="">
    <div class="wordmark">Rhythm House</div>
    <div class="spacer"></div>
    <span class="chip on hide" id="tagAdmin">관리자</span>
    <button class="chip" id="btnLogout">로그아웃</button>
  </div>

  <div class="main">
    <section id="pgHome"></section>
    <section id="pgBook" class="hide"></section>
    <section id="pgMe" class="hide"></section>
    <section id="pgToday" class="hide"></section>
    <section id="pgMembers" class="hide"></section>
  </div>

  <nav class="nav" id="nav"></nav>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         signOut, onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection,
         addDoc, query, where, onSnapshot, getDocs, runTransaction, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===================== 설정 ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyC9YZ4q5H59qChiYDXgGBQSGb-SeEtoE30",
  authDomain: "rhythm-house-cc90c.firebaseapp.com",
  projectId: "rhythm-house-cc90c",
  storageBucket: "rhythm-house-cc90c.firebasestorage.app",
  messagingSenderId: "417316021673",
  appId: "1:417316021673:web:b6b220afcad08f96b790b8"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* ===================== 운영 규칙 ===================== */
const ROOMS = [
  { id:'black', name:'블랙룸',   color:'#5C82AD', fill:'#3E5F82', ink:'#F3E7D2' },
  { id:'white', name:'화이트룸', color:'#E3CFA6', fill:'#E3CFA6', ink:'#0B1A2A' }
];
const CANCEL_LIMIT_H = 3;   // 예약 시각 3시간 전까지만 취소·변경
const CREDIT_DAYS    = 7;   // 연습권 유효기간
const TIER_BASE      = 3;   // 기본 주 3시간
const TIER_UP        = 5;   // 확장 주 5시간
const CONFIRM_WEEKS  = 4;   // 주 5시간 4주 연속 → 기본 확정
const BOOK_AHEAD_DAYS = 14; // 예약 가능 기간

/* ===================== 상태 ===================== */
let ME = null;              // 내 회원 문서
let page = 'home';
let selDate = ymd(new Date());
let selRoom = 'black';
let dayBookings = [];       // 선택 날짜의 예약
let myBookings  = [];       // 내 예약 전체
let members     = [];       // (관리자) 회원 목록
let unsubDay = null, unsubMine = null, unsubMe = null, unsubMembers = null;
let scrolledFor = null;     // 현황 타임라인 자동 스크롤을 한 날짜당 1회만

/* ===================== 유틸 ===================== */
function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function pad(n){ return String(n).padStart(2,'0'); }
function dow(d){ return ['일','월','화','수','목','금','토'][d.getDay()]; }
function fmtDate(s){ const d=parseYmd(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+dow(d)+')'; }
function slotTime(dateStr, hour){ const d=parseYmd(dateStr); d.setHours(hour,0,0,0); return d; }
function bookingId(room,dateStr,hour){ return room+'_'+dateStr+'_'+hour; }
function roomOf(id){ return ROOMS.find(r=>r.id===id) || ROOMS[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isAdmin(){ return ME && ME.role === 'admin'; }

/**
 * 예약 문서에는 회원 이름을 저장하지 않는다 (회원끼리 서로를 알 수 없도록).
 * 관리자 화면에서만 회원 목록에서 이름을 찾아 보여준다.
 * memberName은 예전 버전으로 만들어진 예약을 위한 대비책이다.
 */
function nameOf(b){
  if(!b) return '';
  if(b.kind === 'block') return '차단';
  if(b.memberId && ME && b.memberId === ME.uid) return (ME.name || '나');
  const m = members.find(x=>x.uid === b.memberId);
  return (m && m.name) || b.memberName || '예약';
}

/** 유효기간이 지난 연습권은 0으로 본다 */
function liveCredits(m){
  if(!m) return 0;
  if(m.expiresAt && m.expiresAt < ymd(new Date())) return 0;
  return m.credits || 0;
}
function creditExpired(m){
  return !!(m && m.expiresAt && m.expiresAt < ymd(new Date()) && (m.credits||0) > 0);
}

/* ===================== 토스트 / 모달 ===================== */
let toastTimer = null;
function toast(msg){
  const host = document.getElementById('toastHost');
  host.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ host.innerHTML=''; }, 2600);
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function ask({ title, body, ok='확인', cancel='취소', danger=false, onOk }){
  const host = document.getElementById('modalHost');
  host.innerHTML =
    '<div class="overlay"><div class="modal">'+
      '<h3>'+esc(title)+'</h3><p>'+body+'</p>'+
      '<div class="acts">'+
        '<button class="btn" data-x="no">'+esc(cancel)+'</button>'+
        '<button class="btn primary" data-x="yes">'+esc(ok)+'</button>'+
      '</div></div></div>';
  host.querySelector('[data-x="no"]').onclick = closeModal;
  host.querySelector('[data-x="yes"]').onclick = async ()=>{ closeModal(); if(onOk) await onOk(); };
}
function info({ title, body }){
  const host = document.getElementById('modalHost');
  host.innerHTML =
    '<div class="overlay"><div class="modal">'+
      '<h3>'+esc(title)+'</h3><p>'+body+'</p>'+
      '<div class="acts"><button class="btn primary" data-x="ok">확인</button></div>'+
    '</div></div>';
  host.querySelector('[data-x="ok"]').onclick = closeModal;
}

/* ===================== 로그인 ===================== */
document.getElementById('btnLogin').onclick = doLogin;
document.getElementById('inPw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const email = document.getElementById('inEmail').value.trim();
  const pw    = document.getElementById('inPw').value;
  if(!email || !pw){ toast('이메일과 비밀번호를 입력해 주세요'); return; }
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, email, pw);
  }catch(e){
    const c = e.code || '';
    if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found'))
      toast('이메일 또는 비밀번호가 맞지 않아요');
    else if(c.includes('too-many-requests')) toast('잠시 후 다시 시도해 주세요');
    else toast('로그인에 실패했어요');
  }
}
document.getElementById('btnLogout').onclick = ()=> signOut(auth);
document.getElementById('btnPendingOut').onclick = ()=> signOut(auth);
document.getElementById('btnCopyUid').onclick = ()=>{
  const t = document.getElementById('pdUid').textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('UID를 복사했어요'));
  else toast(t);
};

function show(which){
  ['scLogin','scPending','scApp'].forEach(id=>
    document.getElementById(id).classList.toggle('hide', id!==which));
}

onAuthStateChanged(auth, async (user)=>{
  [unsubDay, unsubMine, unsubMe, unsubMembers].forEach(u=>{ if(u) u(); });
  unsubDay = unsubMine = unsubMe = unsubMembers = null;

  if(!user){ ME=null; show('scLogin'); return; }

  let snap;
  try{ snap = await getDoc(doc(db,'members',user.uid)); }
  catch(e){ toast('회원 정보를 불러오지 못했어요'); show('scLogin'); return; }

  if(!snap.exists() || snap.data().active === false){
    document.getElementById('pdEmail').textContent = user.email || '—';
    document.getElementById('pdUid').textContent   = user.uid;
    show('scPending');
    return;
  }

  ME = { uid:user.uid, ...snap.data() };
  show('scApp');
  document.getElementById('tagAdmin').classList.toggle('hide', !isAdmin());
  buildNav();
  if(isAdmin()) subscribeMembers();   // 예약 추가 모달에서 회원 목록이 필요
  go(isAdmin() ? 'today' : 'home');

  // 내 정보 실시간 구독 (연습권 변화 즉시 반영)
  unsubMe = onSnapshot(doc(db,'members',user.uid), s=>{
    if(!s.exists()) return;
    ME = { uid:user.uid, ...s.data() };
    render();
  });
  // 내 예약 실시간 구독
  unsubMine = onSnapshot(
    query(collection(db,'bookings'), where('memberId','==',user.uid)),
    s=>{
      myBookings = s.docs.map(d=>({ id:d.id, ...d.data() }))
        .sort((a,b)=> (a.date+pad(a.hour)).localeCompare(b.date+pad(b.hour)));
      render();
    });
});

const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
  book:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 11h18"/>',
  me:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/>',
  today:'<rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 10h18M8 15h3"/>',
  members:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3 2.7-5.4 6-5.4s6 2.4 6 5.4"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M18 20c0-2.2-.8-3.9-2-5"/>'
};
function svg(k){
  return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>';
}
function buildNav(){
  const tabs = isAdmin()
    ? [['today','현황'],['members','회원'],['book','예약'],['me','내 정보']]
    : [['home','홈'],['book','예약'],['me','내 정보']];
  document.getElementById('nav').innerHTML = tabs.map(([k,label])=>
    '<button data-go="'+k+'">'+svg(k)+'<span>'+label+'</span></button>').join('');
  document.getElementById('nav').querySelectorAll('[data-go]').forEach(b=>{
    b.onclick = ()=> go(b.dataset.go);
  });
}
function go(p){
  page = p;
  const map = { home:'pgHome', book:'pgBook', me:'pgMe', today:'pgToday', members:'pgMembers' };
  Object.entries(map).forEach(([k,id])=>
    document.getElementById(id).classList.toggle('hide', k!==p));
  document.querySelectorAll('#nav [data-go]').forEach(b=>
    b.classList.toggle('on', b.dataset.go===p));
  window.scrollTo(0,0);

  if(p==='book' || p==='today') subscribeDay();
  if(p==='members') subscribeMembers();
  render();
}
function render(){
  if(!ME) return;
  if(page==='home')    renderHome();
  if(page==='book')    renderBook();
  if(page==='me')      renderMe();
  if(page==='today')   renderToday();
  if(page==='members') renderMembers();
}

/* ===================== 실시간 구독 ===================== */
function subscribeDay(){
  if(unsubDay) unsubDay();
  unsubDay = onSnapshot(
    query(collection(db,'bookings'), where('date','==',selDate)),
    s=>{
      dayBookings = s.docs.map(d=>({ id:d.id, ...d.data() }));
      if(page==='book')  renderBook();
      if(page==='today') renderToday();
    },
    ()=> toast('현황을 불러오지 못했어요')
  );
}
function subscribeMembers(){
  if(!isAdmin() || unsubMembers) return;
  unsubMembers = onSnapshot(collection(db,'members'), s=>{
    members = s.docs.map(d=>({ uid:d.id, ...d.data() }))
      .sort((a,b)=> (a.name||'').localeCompare(b.name||'','ko'));
    if(page==='members') renderMembers();
  });
}

      ? '<div class="card flat" style="margin-top:12px;border-color:#5A2A26">'+
          '<div class="sub rose">연습권 유효기간이 지났어요. 다음 레슨 때 새로 지급됩니다.</div></div>'

    '<div class="card flat" style="margin-top:12px">'+

        '<div class="spacer"></div>'+

function nextLessonText(){
  if(ME.lessonDay==null || !ME.lessonTime) return '일정 미등록';
  const names=['일','월','화','수','목','금','토'];
  return names[ME.lessonDay]+'요일 '+ME.lessonTime+' · 30분';

function bookingCard(b){
  const r = roomOf(b.roomId);
  const lesson = b.kind === 'lesson';

  return '<div class="card" style="padding:14px 15px;margin-bottom:10px">'+
    '<div class="row">'+
      '<div style="width:5px;height:38px;border-radius:3px;background:'+
        (lesson ? '#C9A961' : r.color)+';flex-shrink:0"></div>'+
      '<div style="flex:1">'+
        '<div>'+fmtDate(b.date)+' '+pad(b.hour)+':00 – '+pad(b.hour+1)+':00</div>'+
        '<div class="sub" style="color:'+(lesson?'#E3CFA6':r.color)+';margin-top:4px">'+
          r.name+' · '+(lesson ? '레슨' : '1시간')+'</div>'+
      '</div>'+
      (lesson
        ? '<div class="sub muted" style="text-align:right;line-height:1.5">레슨 일정</div>'
        : canCancel
          ? '<button class="btn sm" data-act="cancel" data-id="'+b.id+'">취소</button>'
          : '<div class="sub muted" style="text-align:right;line-height:1.5">3시간 전<br>취소 마감</div>')+
    '</div></div>';
}

/* ===================== 예약 ===================== */
function renderBook(){
  const today = new Date();
  const dates = [];
  for(let i=0;i<BOOK_AHEAD_DAYS;i++){
    const d = addDays(today,i);
    dates.push({ s:ymd(d), d:d.getDate(), w:dow(d) });
  }
  const c = liveCredits(ME);
  const admin = isAdmin();

  const cells = [];
  for(let h=0; h<24; h++){
    const b = dayBookings.find(x=> x.roomId===selRoom && x.hour===h);
    const past = slotTime(selDate,h) <= new Date();
    let cls='slot', st='가능', attr='';

    if(b){
      // 회원에게는 누구인지 보이지 않는다. 쓸 수 없다는 것만 분명히 보여준다.
      if(b.kind==='block'){       cls+=' blocked'; st='사용 불가'; }
      else if(b.kind==='lesson'){ cls+=' lesson';  st = admin ? esc(nameOf(b))+' 레슨' : '레슨'; }
      else if(b.memberId===ME.uid){ cls+=' mine';  st='내 예약'; }
      else {                      cls+=' taken';   st = admin ? esc(nameOf(b)) : '예약 완료'; }

      if(admin) attr = ' data-act="admCancel" data-id="'+b.id+'"';
      else if(b.memberId===ME.uid && b.kind!=='lesson')
                attr = ' data-act="cancel" data-id="'+b.id+'"';
      else      attr = ' data-act="why" data-w="'+(b.kind==='block'?'block':b.kind==='lesson'?'lesson':'taken')+'"';
    }
    else if(past){ cls+=' past'; st='지난 시간'; }
    else { attr = ' data-act="book" data-h="'+h+'"'; }

    cells.push('<button class="'+cls+'"'+attr+'><span class="hr">'+pad(h)+'</span><span class="st">'+st+'</span></button>');
  }

  document.getElementById('pgBook').innerHTML =
    '<div class="row"><div class="h1" style="font-size:19px">예약하기</div><div class="spacer"></div>'+
      '<span class="chip">연습권 <b class="gold">'+c+'시간</b></span></div>'+

    '<div class="sec">날짜</div>'+
    '<div class="dates">'+ dates.map(d=>
      '<button data-act="date" data-d="'+d.s+'" class="'+(d.s===selDate?'on':'')+'">'+
        '<span class="w">'+d.w+'</span><span class="d">'+d.d+'</span></button>').join('') +'</div>'+

    '<div class="sec">연습실</div>'+
    '<div class="rooms">'+ ROOMS.map(r=>
      '<button data-act="room" data-r="'+r.id+'" class="'+(r.id===selRoom?'on':'')+'">'+r.name+'</button>').join('') +'</div>'+

    '<div class="sec"><span>시간 · 24시간 운영</span><span class="muted">1회 1시간</span></div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--surf);border:1px solid var(--line)"></i>가능</span>'+
      '<span><i style="background:var(--red)"></i>내 예약</span>'+
      '<span><i style="background:#16293D;border:1px solid #20364E"></i>예약 완료</span>'+
      '<span><i style="background:#2B2518;border:1px solid #8A7442"></i>레슨</span>'+
      '<span><i style="border:1px dashed #3A5570"></i>사용 불가</span>'+
    '</div>'+
    '<div class="grid">'+cells.join('')+'</div>'+

    (admin
      ? '<div class="sub muted" style="margin-top:12px">빈 칸을 누르면 내 연습·레슨·회원 예약·차단을 고를 수 있어요.</div>'
      : '<div class="sub muted" style="margin-top:12px">이미 예약된 시간은 누가 썼는지 보이지 않습니다.</div>');

  bind('pgBook');
}

/* ===================== 관리자 · 오늘 현황 ===================== */
function renderToday(){
  const HOUR_PX = 40, H = 24*HOUR_PX;
  const now = new Date();
  const isToday = selDate === ymd(now);
  const nowTop = (now.getHours()+now.getMinutes()/60) * HOUR_PX;

  const labels = [];
  for(let h=0; h<24; h+=2)
    labels.push('<div class="hlabel" style="top:'+(h*HOUR_PX-6)+'px">'+pad(h)+':00</div>');

  const tracks = ROOMS.map(r=>{
    const lines = [];
    for(let h=1; h<24; h++)
      lines.push('<div class="hline" style="top:'+(h*HOUR_PX)+'px"></div>');
    const evs = dayBookings.filter(b=>b.roomId===r.id).map(b=>{
      let bg, ink, bd, label;
      if(b.kind==='block'){
        bg='transparent'; ink='var(--mute)'; bd='1px dashed #3A5570'; label='사용 불가';
      } else if(b.kind==='lesson'){
        bg='#2B2518'; ink='#E3CFA6'; bd='1px solid #8A7442'; label='레슨 · '+nameOf(b);
      } else {
        bg=r.fill; ink=r.ink; bd='0'; label=nameOf(b);
      }
      return '<div class="ev" data-act="admCancel" data-id="'+b.id+'" style="top:'+(b.hour*HOUR_PX+3)+
        'px;height:'+(HOUR_PX-6)+'px;background:'+bg+';border:'+bd+';color:'+ink+'">'+
        '<div style="font-size:12px;line-height:1.3">'+esc(label)+'</div>'+
        '<div style="font-size:10px;opacity:.8">'+pad(b.hour)+':00</div></div>';
    }).join('');
    const empties = [];
    for(let h=0; h<24; h++){
      if(!dayBookings.some(b=>b.roomId===r.id && b.hour===h))
        empties.push('<button class="cell" data-act="admSlot" data-r="'+r.id+'" data-h="'+h+'" style="top:'+
          (h*HOUR_PX+3)+'px;height:'+(HOUR_PX-6)+'px"></button>');
    }
    return '<div style="flex:1;min-width:0">'+
      '<div class="colhead" style="background:'+r.fill+';color:'+r.ink+'">'+r.name+'</div>'+
      '<div class="track" style="height:'+H+'px">'+lines.join('')+empties.join('')+evs+
        (isToday ? '<div class="now" style="top:'+nowTop+'px"></div>' : '')+
      '</div></div>';
  }).join('');

  const cnt = dayBookings.filter(b=>b.kind!=='block').length;
  const cb  = dayBookings.filter(b=>b.roomId==='black'&&b.kind!=='block').length;
  const cw  = dayBookings.filter(b=>b.roomId==='white'&&b.kind!=='block').length;

  document.getElementById('pgToday').innerHTML =
    '<div class="row">'+
      '<button class="btn sm" data-act="dayShift" data-n="-1">‹</button>'+
      '<div style="flex:1;text-align:center" class="num">'+fmtDate(selDate)+'</div>'+
      '<button class="btn sm" data-act="dayShift" data-n="1">›</button>'+
      '<button class="btn sm" data-act="dayToday">오늘</button>'+
    '</div>'+
    '<div class="row" style="margin-top:12px;gap:9px">'+
      stat(cnt,'오늘 예약','')+ stat(cb,'블랙룸','#8FB0D4')+ stat(cw,'화이트룸','#E3CFA6')+
    '</div>'+
    '<div class="sec"><span>실시간 현황</span>'+
      (isToday?'<span class="rose">지금 '+pad(now.getHours())+':'+pad(now.getMinutes())+'</span>':'<span></span>')+'</div>'+
    '<div class="tl"><div class="axis" style="position:relative;height:'+H+'px;margin-top:30px">'+
      labels.join('')+'</div>'+tracks+'</div>'+
    '<div class="sub muted" style="margin-top:12px">빈 칸을 누르면 예약을 추가하거나 시간을 차단할 수 있어요.</div>';

  bind('pgToday');
  // 현재 시각 근처로 한 번만 스크롤 (실시간 갱신마다 튀지 않도록)
  if(isToday && scrolledFor !== selDate){
    scrolledFor = selDate;
    window.scrollTo(0, Math.max(0, nowTop - 180));
  }
}
function stat(n,label,color){
  return '<div class="card" style="flex:1;padding:13px 0;text-align:center">'+
    '<div class="num" style="font-size:23px;line-height:1'+(color?';color:'+color:'')+'">'+n+'</div>'+
    '<div class="sub" style="margin-top:6px">'+label+'</div></div>';
}

function renderMembers(){
  const list = members.filter(m=>m.role!=='admin' || m.uid===ME.uid);
  document.getElementById('pgMembers').innerHTML =
    '<div class="row"><div class="h1" style="font-size:19px">회원 관리</div><div class="spacer"></div>'+
      '<button class="btn sm primary" data-act="addMember">＋ 회원 추가</button></div>'+
    '<div class="sec"><span>전체 회원</span><span>'+list.length+'명</span></div>'+
    (list.length ? list.map(memberCard).join('') : '<div class="empty">등록된 회원이 없어요</div>');
  bind('pgMembers');
}
function memberCard(m){
  const c = liveCredits(m);
  const total = m.weeklyHours || TIER_BASE;
  const used = m.usedThisCycle || 0;
  const base = m.baseHours || TIER_BASE;
  const dots = [];
  for(let i=0;i<total;i++)
    dots.push('<i style="flex:1;height:5px;border-radius:3px;background:'+
      (i<used?'var(--red)':'var(--surf2)')+';display:block"></i>');
  const names=['일','월','화','수','목','금','토'];
  const lesson = (m.lessonDay!=null && m.lessonTime) ? names[m.lessonDay]+' '+m.lessonTime : '미등록';
  const tier = base>=TIER_UP ? '주 5시간 확정'
             : total>=TIER_UP ? '확장 중 '+(m.fullStreak||0)+'/'+CONFIRM_WEEKS+'주'
             : '주 3시간';

/* ===================== 동작 바인딩 ===================== */
function bind(rootId){
  document.getElementById(rootId).querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = ()=> handle(el.dataset);
  });
}
async function handle(d){
  switch(d.act){
    case 'goBook':  go('book'); break;
    case 'date':    selDate = d.d; subscribeDay(); renderBook(); break;
    case 'room':    selRoom = d.r; renderBook(); break;
    case 'book':    confirmBook(Number(d.h)); break;
    case 'why':     whyBlocked(d.w); break;
    case 'cancel':  confirmCancel(d.id); break;
    case 'dayShift':selDate = ymd(addDays(parseYmd(selDate), Number(d.n))); subscribeDay(); renderToday(); break;
    case 'dayToday':selDate = ymd(new Date()); subscribeDay(); renderToday(); break;
    case 'admSlot': admSlot(d.r, Number(d.h)); break;
    case 'admCancel': admCancel(d.id); break;
    case 'blockMode': go('today'); toast('빈 칸을 누르면 차단할 수 있어요'); break;
    case 'lesson':  confirmLesson(d.uid); break;
    case 'addMember': formMember(null); break;
    case 'editMember': formMember(members.find(m=>m.uid===d.uid)); break;
  }
}

function confirmBook(hour){
  const r = roomOf(selRoom);

  if(liveCredits(ME) < 1){

      body:'다음 레슨을 마치면 연습권이 지급됩니다.<br>자세한 내용은 관리자에게 문의해 주세요.' });

  ask({

/** 회원이 쓸 수 없는 칸을 눌렀을 때의 안내 */
function whyBlocked(w){
  if(w==='block')
    info({ title:'사용할 수 없는 시간이에요',
           body:'연습실 사정으로 닫아둔 시간입니다.<br>다른 시간을 선택해 주세요.' });
  else if(w==='lesson')
    info({ title:'레슨이 있는 시간이에요',
           body:'이 시간에는 레슨이 진행됩니다.<br>다른 시간을 선택해 주세요.' });
  else
    info({ title:'이미 예약된 시간이에요',
           body:'다른 분이 먼저 예약했습니다.<br>다른 시간을 선택해 주세요.' });
}
async function doBook(hour){
  const r = roomOf(selRoom);
  const id = bookingId(selRoom, selDate, hour);
  const admin = isAdmin();
  try{
    await runTransaction(db, async tx=>{
      const bRef = doc(db,'bookings',id);
      const mRef = doc(db,'members',ME.uid);
      const bSnap = await tx.get(bRef);
      if(bSnap.exists()) throw new Error('TAKEN');

      // 읽기를 먼저 끝내고 쓰기로 넘어간다 (트랜잭션 규칙)
      let m = null;
      if(!admin){
        const mSnap = await tx.get(mRef);
        m = mSnap.data();
        if(m.expiresAt && m.expiresAt < ymd(new Date())) throw new Error('EXPIRED');
        if((m.credits||0) < 1) throw new Error('NOCREDIT');
      }

      // 이름은 저장하지 않는다 — 회원끼리 서로를 알 수 없게 하기 위해서다
      tx.set(bRef, {
        roomId: selRoom, roomName: r.name, date: selDate, hour,
        memberId: ME.uid, kind:'practice',
        addedByAdmin: admin, createdAt: serverTimestamp()
      });
      if(!admin){
        tx.update(mRef, {
          credits: (m.credits||0) - 1,
          usedThisCycle: (m.usedThisCycle||0) + 1
        });
      }
    });
    toast('예약되었어요');
  }catch(e){
    if(e.message==='TAKEN') toast('방금 다른 분이 예약했어요');
    else if(e.message==='NOCREDIT') toast('연습권이 부족해요');
    else if(e.message==='EXPIRED') toast('연습권 유효기간이 지났어요');
    else { console.error(e); toast('예약에 실패했어요'); }
  }
}
function confirmCancel(id){
  const b = myBookings.find(x=>x.id===id) || dayBookings.find(x=>x.id===id);
  if(!b) return;
  const start = slotTime(b.date,b.hour);
  if((start - Date.now()) <= CANCEL_LIMIT_H*3600*1000){
    info({ title:'취소할 수 없어요',
      body:'예약 시작 '+CANCEL_LIMIT_H+'시간 전부터는 취소·변경이 불가능합니다.' });
    return;
  }
  ask({
    title:'예약을 취소할까요?',
    body: fmtDate(b.date)+' '+pad(b.hour)+':00 · '+roomOf(b.roomId).name+
          (b.addedByAdmin ? ''
            : '<br><br><span style="color:var(--white-room)">연습권 1시간이 돌아옵니다.</span>'),
    ok:'예약 취소',
    onOk: ()=> doCancel(b)
  });
}
async function doCancel(b){
  // 관리자 예약은 차감이 없었으므로 환급도 하지 않는다
  const refund = !b.addedByAdmin;
  try{
    await runTransaction(db, async tx=>{
      const bRef = doc(db,'bookings',b.id);
      const mRef = doc(db,'members',ME.uid);
      const bSnap = await tx.get(bRef);
      if(!bSnap.exists()) throw new Error('GONE');
      let m = null;
      if(refund){
        const mSnap = await tx.get(mRef);
        m = mSnap.data();
      }
      tx.delete(bRef);
      if(refund){
        tx.update(mRef, {
          credits: (m.credits||0) + 1,
          usedThisCycle: Math.max(0, (m.usedThisCycle||0) - 1)
        });
      }
    });
    toast('예약이 취소되었어요');
  }catch(e){
    if(e.message==='GONE') toast('이미 취소된 예약이에요');
    else { console.error(e); toast('취소에 실패했어요'); }
  }
}

/* ===================== 연습권 티어 계산 ===================== */
/**
 * 주 3시간으로 시작 → 다 채우면 다음 주 5시간
 * 주 5시간을 4주 연속 다 채우면 기본 주 5시간 확정
 * 주 3시간 미만으로 쓰면 다시 주 3시간
 */
function nextTier(m){
  const granted = m.weeklyHours || TIER_BASE;
  const used    = m.usedThisCycle || 0;
  let base   = m.baseHours  || TIER_BASE;
  let streak = m.fullStreak || 0;
  let next, note;

  if(!m.cycles){
    next = TIER_BASE; base = TIER_BASE; streak = 0;
    note = '첫 지급 · 주 '+TIER_BASE+'시간';
  }
  else if(used < TIER_BASE){
    next = TIER_BASE; base = TIER_BASE; streak = 0;
    note = '지난 주기 '+used+'시간 사용 · 주 '+TIER_BASE+'시간으로 조정';
  }
  else if(used >= granted){
    if(granted >= TIER_UP){
      streak += 1; next = TIER_UP;
      if(streak >= CONFIRM_WEEKS){
        base = TIER_UP;
        note = '주 '+TIER_UP+'시간 '+CONFIRM_WEEKS+'주 연속 달성 · 기본 주 '+TIER_UP+'시간 확정';
      } else {
        note = '주 '+TIER_UP+'시간 다 채움 ('+streak+'/'+CONFIRM_WEEKS+'주)';
      }
    } else {
      next = TIER_UP; streak = 0;
      note = '주 '+TIER_BASE+'시간 다 채움 · 주 '+TIER_UP+'시간으로 확장';
    }
  }
  else {
    next = granted; streak = 0;
    note = '지난 주기 '+used+'시간 사용 · 주 '+next+'시간 유지';
  }
  if(base >= TIER_UP) next = TIER_UP;
  return { next, base, streak, note, used };
}

function confirmLesson(uid){
  const m = members.find(x=>x.uid===uid);
  if(!m) return;
  const t = nextTier(m);
  ask({
    title: esc(m.name||'회원')+' · 레슨 완료',
    body: t.note+'<br><br><span style="color:var(--white-room)">연습권 '+t.next+'시간을 지급하고<br>'+
          CREDIT_DAYS+'일 뒤 소멸됩니다.</span>',
    ok:'지급하기',
    onOk: ()=> grantLesson(m, t)
  });
}
async function grantLesson(m, t){
  const now = new Date();
  const expires = ymd(addDays(now, CREDIT_DAYS));
  const month = now.getFullYear()+'-'+pad(now.getMonth()+1);
  const sameMonth = m.lessonMonth === month;
  try{
    await updateDoc(doc(db,'members',m.uid), {
      credits: t.next,
      weeklyHours: t.next,
      usedThisCycle: 0,
      baseHours: t.base,
      fullStreak: t.streak,
      cycles: (m.cycles||0) + 1,
      expiresAt: expires,
      lessonMonth: month,
      lessonsThisMonth: sameMonth ? (m.lessonsThisMonth||0)+1 : 1,
      lastLessonAt: serverTimestamp()
    });
    await addDoc(collection(db,'lessons'), {
      memberId: m.uid, memberName: m.name||'',
      date: ymd(now), grantedHours: t.next, usedBefore: t.used,
      note: t.note, createdAt: serverTimestamp()
    });
    info({ title:'연습권을 지급했어요',
      body: esc(m.name||'회원')+'님에게 '+t.next+'시간<br>'+
            '<span class="muted">'+esc(t.note)+'</span><br>'+
            fmtDate(expires)+' 소멸' });
  }catch(e){ console.error(e); toast('지급에 실패했어요'); }
}

/** 관리자 세션을 유지한 채 새 계정을 만든다 (보조 앱 사용) */
async function createMember({ name, phone, email, pw, lessonDay, lessonTime }){
  let secondary;
  try{
    secondary = initializeApp(firebaseConfig, 'rh-create-'+Date.now());
    const sAuth = getAuth(secondary);
    const cred  = await createUserWithEmailAndPassword(sAuth, email, pw);
    await setDoc(doc(db,'members',cred.user.uid), {
      name, phone, email, role:'member', active:true,
      lessonDay: lessonDay==null?null:lessonDay, lessonTime: lessonTime||null,
      credits:0, weeklyHours:TIER_BASE, usedThisCycle:0,
      baseHours:TIER_BASE, fullStreak:0, cycles:0,
      expiresAt:null, lessonsThisMonth:0, createdAt: serverTimestamp()
    });
    await signOut(sAuth);
    info({ title:'회원을 등록했어요',
      body: esc(name)+'님<br><br>'+
            '이메일 <b>'+esc(email)+'</b><br>비밀번호 <b>'+esc(pw)+'</b><br><br>'+
            '<span class="muted">이 정보와 사이트 주소를 전달해 주세요.<br>'+
            '첫 레슨을 마치면 연습권이 지급됩니다.</span>' });
  }catch(e){
    const c = e.code||'';
    if(c.includes('email-already-in-use')) toast('이미 사용 중인 이메일이에요');
    else if(c.includes('invalid-email')) toast('이메일 형식을 확인해 주세요');
    else if(c.includes('weak-password')) toast('비밀번호는 6자 이상이어야 해요');
    else { console.error(e); toast('등록에 실패했어요'); }
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
