/** 지난 기수를 최신순으로. 진행 중인 기수는 위에 따로 있으므로 뺀다. */
function termHistory(m, curTerm, quota){
  const map = termsOf(mbLessons);
  const nums = Object.keys(map).map(Number).sort((a,b)=>b-a).filter(t=>t!==curTerm);
  if(!nums.length) return '<div class="empty">지난 기수가 없어요</div>';
  return nums.map(t=>{
    const rows = map[t];
    const pay  = t>0 ? payOf(m, t) : null;
    return '<div class="card flat" style="margin-bottom:10px">'+
      '<div class="row" style="margin-bottom:9px">'+
        '<div class="sub gold">'+termLabel(t)+'</div>'+
        '<div class="sub muted">'+esc(termRange(rows))+'</div>'+
        '<div class="spacer"></div>'+
        '<div class="sub muted">'+rows.length+' / '+quota+'회</div>'+
      '</div>'+
      rows.slice().reverse().map(x=>lessonRow(x)).join('')+
      (t>0
        ? '<button class="lrow" style="margin-top:4px" data-act="payForm" '+
            'data-key="'+m.key+'" data-t="'+t+'">'+
            '<span class="d">레슨비</span>'+
            '<span class="n" style="color:'+(pay?'#9FD2A8':'var(--mute)')+'">'+
              (pay ? (pay.date?fmtDate(pay.date)+' 입금':'입금 확인됨')+
                     (pay.amount?' · '+won(pay.amount):'')
                   : '확인 전')+'</span>'+
            '<span class="go">'+(pay?'수정':'입력')+'</span></button>'
        : '')+
    '</div>';
  }).join('');
}

function kakaoLink(v){
  const t = String(v||'').trim();
  if(/^https?:\/\//i.test(t))
    return '<a href="'+esc(t)+'" target="_blank" rel="noopener" '+
           'style="word-break:break-all">카카오톡 열기 ↗</a>';
  return esc(t);
}
/**
 * 입금 내역은 '기수 → {입금일, 금액, 메모}' 로 둔다.
 * 레슨도 같은 기수로 묶이므로 둘이 저절로 맞물린다.
 */
function payOf(m, term){
  if(!m) return null;
  return (m.payments||{})[String(term)] || null;
}
function won(n){ return Number(n||0).toLocaleString('ko-KR')+'원'; }
/** 기수를 고르는 드롭다운은 termOptions에 있다 */

function lessonRow(x){
  const t = x.time ? ' '+x.time : '';
  return '<button class="lrow" data-act="lessonEdit" data-id="'+x.id+'">'+
    '<span class="d">'+fmtDate(x.date)+t+'</span>'+
    '<span class="n">'+(x.grantedHours ? '연습권 '+x.grantedHours+'시간' : '기록만')+'</span>'+
    '<span class="go">수정</span></button>';
}
function mbBookingRow(b, future){
  const r = roomOf(b.roomId);
  const lesson = b.kind==='lesson';
  return '<div class="card flat" style="padding:12px 14px;margin-bottom:8px">'+
    '<div class="row">'+
      '<div style="width:4px;height:30px;border-radius:2px;flex-shrink:0;background:'+
        (lesson?'#C9A961':r.color)+'"></div>'+
      '<div style="flex:1;font-size:14px">'+fmtDate(b.date)+' '+timeText(b)+'</div>'+
      '<div class="sub" style="color:'+(lesson?'#E3CFA6':r.color)+'">'+
        r.name+(lesson?' · 레슨':(b.afterLesson?' · 레슨 뒤':''))+'</div>'+
      (future
        ? '<button class="btn sm" data-act="moveBooking" data-id="'+b.id+'">옮기기</button>'+
          '<button class="btn sm" data-act="admCancelAny" data-id="'+b.id+'">취소</button>'
        : '')+
    '</div></div>';
}

/* ===================== 동작 바인딩 ===================== */
function bind(rootId){
  document.getElementById(rootId).querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = ()=> handle(el.dataset);
  });
}
async function handle(d){
  switch(d.act){
    case 'goBook':  go('book'); break;
    case 'date':    selDate = d.d; subscribeDay(); renderBook(); break;
    case 'room':    selRoom = d.r; renderBook(); break;
    case 'book':    if(d.r) selRoom = d.r; confirmBook(Number(d.h)); break;
    case 'why':     whyBlocked(d.w); break;
    case 'bookMode':  bookMode  = d.m; render(); break;
    case 'calPick':   selDate = d.d; subscribeDay(); render(); break;
    case 'calShift':  calMonth = shiftMonth(calMonth, Number(d.n));
                      subscribeMonth(); render(); break;
    case 'calToday':  calMonth = ymd(new Date()); selDate = ymd(new Date());
                      subscribeMonth(); subscribeDay(); render(); break;
    case 'adminMode': adminMode = d.m; render(); break;
    case 'wkShift': weekStart = ymd(addDays(parseYmd(weekStart), Number(d.n)*7));
                    subscribeWeek(); render(); break;
    case 'wkNow':   weekStart = startOfWeek(ymd(new Date()));
  calMonth  = ymd(new Date());
  subscribeMonth(); subscribeWeek(); render(); break;
    case 'wkDay':   selDate = d.d;
                    if(page==='book') bookMode = 'day'; else adminMode = 'day';
                    subscribeDay(); render(); break;
    case 'cancel':  confirmCancel(d.id); break;
    case 'dayShift':selDate = ymd(addDays(parseYmd(selDate), Number(d.n))); subscribeDay(); renderToday(); break;
    case 'dayToday':selDate = ymd(new Date()); subscribeDay(); renderToday(); break;
    case 'admSlot': admSlot(d.r, Number(d.h)); break;
    case 'admCancel': admCancel(d.id); break;
    case 'blockMode': go('today'); toast('빈 칸을 누르면 차단할 수 있어요'); break;
    case 'addMember': formMember(null); break;
    case 'editMember': formMember(members.find(m=>m.key===d.key)); break;
    case 'openMember': openMember(d.key); break;
    case 'backMembers': selMember=''; go('members'); break;
    case 'lessonNew':  lessonForm(null); break;
    case 'lessonEdit': lessonForm(mbLessons.find(x=>x.id===d.id)); break;
    case 'payForm':    payForm(d.key, d.t); break;
    case 'sortTerms':  sortTerms(d.key); break;
    case 'planLessons': planLessons(d.key); break;
    case 'moveBooking': moveBooking(d.id); break;
    case 'weekly':     setWeekly(d.key, Number(d.n)); break;
    case 'admCancelAny': admCancelAny(d.id); break;
    case 'statRange': statDays = Number(d.d); statWho = statWho; loadStats(); renderStats(); break;
    case 'statWho':   statWho = d.w || ''; renderStats(); break;
    case 'parkForm':  parkForm(); break;
    case 'parkSetup': parkSetup(); break;
    case 'parkPing':  parkPing(); break;
    case 'parkDel':   parkDelete(d.id); break;
    case 'actDel':    actDelete(d.id); break;
    case 'monShift':  monDay = ymd(addDays(parseYmd(monDay), Number(d.n))); subscribeMonitor(); renderMonitor(); break;
    case 'monToday':  monDay = ymd(new Date()); subscribeMonitor(); renderMonitor(); break;
    case 'monFilter': monFilter = d.f; renderMonitor(); break;
    case 'openExternal': openExternal(); break;
    case 'copyLink':  copyLink(); break;
    case 'ntToggle':  ntToggle(d.id); break;
    case 'ntCopy':    ntCopy(d.id); break;
    case 'ntEdit':    noticeForm(d.id || null); break;
    case 'ntMove':    ntMove(d.id, Number(d.n)); break;
    case 'ntSeed':    ntSeed(); break;
  }
}

/* ===================== 예약 / 취소 ===================== */
function confirmBook(hour){
  const r = roomOf(selRoom);
  // 관리자는 내 연습 · 레슨 · 회원 예약 · 차단 중에서 고른다
  if(isAdmin()){ admSlot(selRoom, hour); return; }
  if(liveCredits(ME) < 1){
    info({ title:'연습권이 없어요',
      body:'다음 레슨을 마치면 연습권이 지급됩니다.<br>자세한 내용은 관리자에게 문의해 주세요.' });
    return;
  }
  ask({
    title:'이 시간으로 예약할까요?',
    body: fmtDate(selDate)+' '+pad(hour)+':00 – '+pad(hour+1)+':00<br>'+
          r.name+' · 1시간'+
          '<br><br><span style="color:var(--white-room)">연습권 1시간이 차감됩니다.</span>',
    ok:'예약하기',
    onOk: ()=> doBook(hour)
  });
}

/** 회원이 쓸 수 없는 칸을 눌렀을 때의 안내 */
function whyBlocked(w){
  if(w==='mylesson')
    info({ title:'내 레슨 시간이에요',
           body:'이 시간에는 레슨이 있습니다.<br>일정을 바꾸시려면 리듬 하우스에 문의해 주세요.' });
  else if(w==='afterlesson')
    info({ title:'레슨 뒤 연습 시간이에요',
           body:'레슨에 이어서 쓰시라고 미리 잡아둔 자리입니다.<br>'+
                '<b>연습권은 차감되지 않습니다.</b><br><br>'+
                '못 오시게 되면 리듬 하우스에 알려주세요.' });
  else
    info({ title:'사용할 수 없는 시간이에요',
           body:'이미 찬 시간입니다.<br>다른 시간을 선택해 주세요.' });
}
async function doBook(hour){
  const r = roomOf(selRoom);
  const id = bookingId(selRoom, selDate, hour);
  const admin = isAdmin();
  try{
    await runTransaction(db, async tx=>{
      const bRef = doc(db,'bookings',id);
      const mRef = doc(db,'members',ME.key);
      const bSnap = await tx.get(bRef);
      if(bSnap.exists()) throw new Error('TAKEN');

      // 읽기를 먼저 끝내고 쓰기로 넘어간다 (트랜잭션 규칙)
      let m = null;
      if(!admin){
        const mSnap = await tx.get(mRef);
        m = mSnap.data();
        if(m.expiresAt && m.expiresAt < ymd(new Date())) throw new Error('EXPIRED');
        if((m.credits||0) < 1) throw new Error('NOCREDIT');
      }

      // 이름은 저장하지 않는다 — 회원끼리 서로를 알 수 없게 하기 위해서다
      tx.set(bRef, {
        roomId: selRoom, roomName: r.name, date: selDate, hour,
        memberId: myMid(), kind:'practice',
        usesCredit: !admin,                 // 관리자 본인 예약은 연습권을 쓰지 않는다
        addedByAdmin: admin, createdAt: serverTimestamp()
      });
      if(!admin){
        tx.update(mRef, { credits: (m.credits||0) - 1 });
      }
    });
    toast('예약되었어요');
    logAct('book', { roomId:selRoom, date:selDate, hour, mid: myMid(), kind:'practice',
                     detail: admin ? '' : '연습권 차감' });
  }catch(e){
    if(e.message==='TAKEN') toast('방금 다른 분이 예약했어요');
    else if(e.message==='NOCREDIT') toast('연습권이 부족해요');
    else if(e.message==='EXPIRED') toast('연습권 유효기간이 지났어요');
    else { console.error(e); toast('예약에 실패했어요'); }
  }
}
function confirmCancel(id){
  const b = myBookings.find(x=>x.id===id) || dayBookings.find(x=>x.id===id);
  if(!b) return;
  const start = slotTime(b.date,b.hour);
  if((start - Date.now()) <= CANCEL_LIMIT_H*3600*1000){
    info({ title:'취소할 수 없어요',
      body:'예약 시작 '+CANCEL_LIMIT_H+'시간 전부터는 취소·변경이 불가능합니다.' });
    return;
  }
  ask({
    title:'예약을 취소할까요?',
    body: fmtDate(b.date)+' '+pad(b.hour)+':00 · '+roomOf(b.roomId).name+
          (usesCredit(b)
            ? '<br><br><span style="color:var(--white-room)">연습권 1시간이 돌아옵니다.</span>'
            : '<br><br><span class="muted">연습권을 쓰지 않은 예약이라 돌아올 연습권은 없어요.</span>'),
    ok:'예약 취소',
    onOk: ()=> doCancel(b)
  });
}
async function doCancel(b){
  // 관리자 예약은 차감이 없었으므로 환급도 하지 않는다
  const refund = usesCredit(b);
  try{
    await runTransaction(db, async tx=>{
      const bRef = doc(db,'bookings',b.id);
      const mRef = doc(db,'members',ME.key);
      const bSnap = await tx.get(bRef);
      if(!bSnap.exists()) throw new Error('GONE');
      let m = null;
      if(refund){
        const mSnap = await tx.get(mRef);
        m = mSnap.data();
      }
      tx.delete(bRef);
      if(refund){
        tx.update(mRef, { credits: (m.credits||0) + 1 });
      }
    });
    toast('예약이 취소되었어요');
    logAct('cancel', { roomId:b.roomId, date:b.date, hour:b.hour, mid:b.memberId, kind:b.kind,
                       detail: refund ? '연습권 환급' : '' });
  }catch(e){
    if(e.message==='GONE') toast('이미 취소된 예약이에요');
    else { console.error(e); toast('취소에 실패했어요'); }
  }
}

/** 관리자가 '차감함'을 골랐을 때만 연습권을 1시간 깎는다 */
async function spendCredit(mid){
  const t = members.find(x=>(x.mid||x.key)===mid);
  if(!t) return;
  try{
    await updateDoc(doc(db,'members',t.key),
      { credits: Math.max(0, (t.credits||0) - 1) });
  }catch(e){ console.error(e); }
}

async function writeSlot(roomId, hour, extra){
  const r = roomOf(roomId);
  try{
    await setDoc(doc(db,'bookings', bookingId(roomId, selDate, hour)), {
      roomId, roomName:r.name, date:selDate, hour,
      addedByAdmin:true, createdAt:serverTimestamp(), ...extra
    });
    logAct(extra.kind==='block' ? 'block' : (extra.kind==='lesson' ? 'lesson' : 'book'),
      { roomId, date:selDate, hour, mid: extra.memberId || '', kind: extra.kind,
        detail: extra.kind==='practice' ? (extra.usesCredit ? '관리자 추가 · 연습권 차감' : '관리자 추가') : '' });
  }catch(e){ console.error(e); toast('저장에 실패했어요'); }
}
function admCancel(id){
  const b = dayBookings.find(x=>x.id===id);
  if(!b) return;
  if(b.kind==='practice' && b.memberId===myMid()){ myPracticeForm(null, b); return; }
  const who = b.kind==='lesson' ? ('레슨 · '+nameOf(b)) : nameOf(b);
  const refundNote = usesCredit(b)
    ? '<br><br><span class="muted">회원의 연습권 1시간이 돌아갑니다.</span>' : '';
  ask({
    title: b.kind==='block'  ? '이 시간을 다시 열까요?'
         : b.kind==='lesson' ? '레슨 일정을 지울까요?'
         : '이 예약을 취소할까요?',
    body: fmtDate(b.date)+' '+pad(b.hour)+':00 · '+roomOf(b.roomId).name+'<br>'+esc(who)+refundNote,
    ok: b.kind==='block' ? '다시 열기' : b.kind==='lesson' ? '레슨 삭제' : '예약 취소',
    onOk: async ()=>{
      try{
        if(usesCredit(b) && b.memberId){
          await runTransaction(db, async tx=>{
            const target = members.find(x=>(x.mid||x.key)===b.memberId);
            if(!target) throw new Error('NOMEMBER');
            const mRef = doc(db,'members',target.key);
            const mSnap = await tx.get(mRef);
            tx.delete(doc(db,'bookings',b.id));
            if(mSnap.exists()){
              const m = mSnap.data();
              tx.update(mRef, { credits:(m.credits||0)+1 });
            }
          });
        } else {
          await deleteDoc(doc(db,'bookings',b.id));
        }
        logAct(b.kind==='block' ? 'open' : 'cancel',
          { roomId:b.roomId, date:b.date, hour:b.hour, mid:b.memberId, kind:b.kind,
            detail: '관리자 처리' + (usesCredit(b) ? ' · 연습권 환급' : '') });
        toast('처리했어요');
      }catch(e){ console.error(e); toast('처리에 실패했어요'); }
    }
  });
}

  if(!m) return;

  subscribeMember(m.mid || m.key);
  go('member');

/**
 * 주간 연습 시간을 올리고 내린다.
 * 자동 승급을 두지 않는 이유 — 연습이 잘 되고 있는지는
 * 가르치는 사람이 보는 게 어떤 계산보다 정확하기 때문이다.
 */
async function setWeekly(key, delta){
  const m = members.find(x=>x.key===key);
  if(!m) return;
  const next = Math.max(1, Math.min(WEEKLY_MAX, weeklyOf(m) + delta));
  if(next === weeklyOf(m)) return;
  try{
    await updateDoc(doc(db,'members',key), { weeklyHours: next });
    toast('주 '+next+'시간으로 바꿨어요 · 다음 지급부터 적용');
  }catch(e){ console.error(e); toast('저장에 실패했어요'); }
}

          '<div style="flex:1.3"><label for="pyDate">입금일</label>'+

        '<div class="row" style="gap:9px;margin-top:6px">'+
          '<button class="btn" style="flex:1;height:48px" id="pyCancel">취소</button>'+
          '<button class="btn primary" style="flex:1;height:48px" id="pySave">저장</button>'+
        '</div>'+
        (cur ? '<button class="btn" style="height:44px;color:var(--red-l);'+
               'border-color:#5A2A26" id="pyDel">입금 확인 취소</button>' : '')+
      '</div></div></div>';

  host.querySelector('#pyCancel').onclick = closeModal;

  if(cur) host.querySelector('#pyDel').onclick = async ()=>{
    closeModal();
    const payments = { ...(m.payments||{}) };

    payments[String(sel)] = { date: date||'', amount: isNaN(amt)?0:Math.max(0,amt), memo };
    try{
      await updateDoc(doc(db,'members',key), { payments });
      toast(sel+'기 입금을 기록했어요');
    }catch(e){ console.error(e); toast('저장에 실패했어요'); }

/**
 * 레슨 일정을 한 번에 여러 주 잡는다.
 * 등록할 때 시간 협의가 끝나 있으니, 기수 전체를 미리 깔아두는 쪽이 자연스럽다.
 * 회원 화면에는 바로 '다음 레슨'으로 뜬다.
 */
function planLessons(key){
  const m = members.find(x=>x.key===key);
  if(!m) return;
  const quota = m.lessonQuota || LESSON_QUOTA;
  const now = new Date();

  // 기본값 — 그 회원의 기본 요일·시각에서 가장 가까운 앞날
  let d0 = addDays(now, 1);
  if(m.lessonDay != null){
    for(let i=1;i<=7;i++){
      const d = addDays(now, i);
      if(d.getDay() === m.lessonDay){ d0 = d; break; }
    }
  }
  const defTime = m.lessonTime || '16:00';

  const host = document.getElementById('modalHost');
  host.innerHTML =
    '<div class="overlay"><div class="modal">'+

      '<div class="col" style="margin-top:16px">'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1.3"><label for="plDate">첫 레슨 날짜</label>'+
            '<input id="plDate" type="date" value="'+ymd(d0)+'"></div>'+
          '<div style="flex:1"><label for="plTime">시각</label>'+
            '<input id="plTime" type="time" value="'+esc(defTime)+'"></div>'+
        '</div>'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1"><label for="plRoom">연습실</label>'+
            '<select id="plRoom">'+ROOMS.map(r=>
              '<option value="'+r.id+'">'+r.name+'</option>').join('')+'</select></div>'+
          '<div style="flex:1"><label for="plCount">횟수</label>'+
            '<input id="plCount" type="number" min="1" max="12" value="'+quota+'"></div>'+
        '</div>'+
        '<div class="row" style="gap:9px">'+
          '<div style="flex:1"><label for="plEvery">간격</label>'+
            '<select id="plEvery">'+
              '<option value="7">매주 같은 요일</option>'+
              '<option value="14">격주</option>'+
            '</select></div>'+
          '<div style="flex:1"><label for="plHold">연습실 확보</label>'+

              '<option value="1">1시간</option>'+

          '<b>연습실을 통째로 확보</b>합니다. 이 시간은 <b>연습권이 차감되지 않습니다.</b><br>'+
          '예) 22:30 레슨 · 2시간 확보 → 22시·23시 칸을 잡습니다.<br>'+
          '이미 찬 시간은 건너뜁니다.</div>'+
        '<div class="row" style="gap:9px;margin-top:6px">'+
          '<button class="btn" style="flex:1;height:48px" id="plCancel">취소</button>'+
          '<button class="btn primary" style="flex:1;height:48px" id="plSave">일정 잡기</button>'+
        '</div>'+
      '</div></div></div>';

  host.querySelector('#plCancel').onclick = closeModal;
  host.querySelector('#plSave').onclick = async ()=>{
    const date  = host.querySelector('#plDate').value;
    const time  = host.querySelector('#plTime').value;
    const room  = host.querySelector('#plRoom').value;
    const count = Math.max(1, Math.min(12, Number(host.querySelector('#plCount').value)||quota));
    const every = Number(host.querySelector('#plEvery').value) || 7;
    const hold  = Math.max(1, Math.min(4, Number(host.querySelector('#plHold').value)||1));
    if(!date || !time){ toast('날짜와 시각을 입력해 주세요'); return; }
    closeModal();

    const r = roomOf(room);
    const startHour = Math.floor(toMin(time)/60);   // 22:30 → 22시 칸부터
    let made = 0, skipped = [];

    for(let i=0;i<count;i++){
      const ds = ymd(addDays(parseYmd(date), i*every));
      let any = false;
      // 레슨 칸 + 그 뒤로 확보할 칸들을 차례로 잡는다
      for(let k=0;k<hold;k++){
        const h  = startHour + k;
        if(h > 23) break;                            // 자정을 넘기지 않는다
        const id = bookingId(room, ds, h);
        try{
          const snap = await getDoc(doc(db,'bookings',id));
          if(snap.exists()){ continue; }
          const isLesson = (k === 0);
          await setDoc(doc(db,'bookings',id), {
            roomId:room, roomName:r.name, date:ds, hour:h,
            memberId: (m.mid||m.key),
            kind: isLesson ? 'lesson' : 'practice',
            ...(isLesson ? { lessonAt: time, durMin: LESSON_MIN }
                         : { afterLesson: true, usesCredit: false }),
            addedByAdmin:true, createdAt: serverTimestamp()
          });
          any = true;
        }catch(e){ console.error(e); }
      }
      if(any) made++; else skipped.push(fmtDate(ds));
    }

    if(made) logAct('lesson', { roomId:room, date, hour:startHour, mid:(m.mid||m.key), kind:'lesson',
                                detail:'레슨 '+made+'회 일정 등록 · '+time });
    info({ title: made ? '레슨 일정을 '+made+'회 잡았어요' : '잡은 일정이 없어요',
      body: esc(m.name||'회원')+' · '+r.name+'<br>'+
        time+' ~ '+toHM(toMin(time)+LESSON_MIN)+' 레슨 · 연습실 '+hold+'시간 확보'+
        (skipped.length
          ? '<br><br><span class="rose">이미 차 있어 건너뛴 날</span><br>'+
            '<span class="muted">'+skipped.map(esc).join('<br>')+'</span>'
          : '<br><br><span class="muted">회원 화면에 다음 레슨으로 바로 보입니다.<br>'+
            '레슨 뒤 연습 시간은 연습권이 차감되지 않습니다.</span>') });
  };
}

/**
 * 예전 방식(기수 없이) 남긴 기록을 날짜순으로 quota개씩 묶어 기수를 매긴다.
 * 한 번만 쓰는 정리 기능이라 전체를 다시 번호 매긴다.
 */
function sortTerms(key){
  const m = members.find(x=>x.key===key);
  if(!m) return;
  const quota = m.lessonQuota || LESSON_QUOTA;
  const all = mbLessons.slice().sort(byLessonDate);
  ask({
    title:'기수를 정리할까요?',
    body: '레슨 '+all.length+'건을 날짜순으로 '+quota+'회씩 묶어<br>1기부터 다시 번호를 매깁니다.'+
          '<br><br><span class="muted">이미 매겨둔 기수도 다시 계산됩니다.</span>',
    ok:'정리하기',
    onOk: async ()=>{
      try{
        for(let i=0;i<all.length;i++){
          const t = Math.floor(i/quota) + 1;
          if(Number(all[i].term) !== t)
            await updateDoc(doc(db,'lessons',all[i].id), { term: t });
        }
        toast('기수를 정리했어요');
      }catch(e){ console.error(e); toast('정리에 실패했어요'); }
    }
  });
}

      }

  };
}

/**
 * 연습권을 지급한다. 지급량은 관리자가 정해둔 주간 시간 그대로다.
 * 자동으로 올리거나 내리지 않는다 — 늘릴지 말지는 관리자가 보고 판단한다.
 */
async function grantCredits(m){
  const now = new Date();
  await updateDoc(doc(db,'members',m.key), {
    credits: weeklyOf(m),
    cycleStart: ymd(now),
    expiresAt: ymd(addDays(now, CREDIT_DAYS)),
    lastLessonAt: serverTimestamp()
  });
}
function weeklyOf(m){ return (m && m.weeklyHours) || TIER_BASE; }

          '<select id="fmPark">'+
            [[0,'쓰지 않음'],[1,'1회 (기본)'],[2,'2회'],[3,'3회']].map(([n,l])=>
              '<option value="'+n+'"'+(((m && Number.isFinite(m.parkingDaily)) ? m.parkingDaily : 1)===n?' selected':'')+
              '>'+l+'</option>').join('')+
          '</select></div>'+
        '<div><label for="fmMemo">메모</label>'+
          '<textarea id="fmMemo" rows="3" placeholder="진도, 성향, 주의할 점 등">'+
          esc(m?(m.memo||''):'')+'</textarea></div>'+
        (isNew ? '' :
          '<div><label for="fmCredit">연습권 직접 조정 (시간)</label>'+
          '<input id="fmCredit" type="number" min="0" max="20" value="'+(m.credits||0)+'"></div>')+
        '<div class="row" style="gap:9px;margin-top:6px">'+
          '<button class="btn" style="flex:1;height:48px" id="fmCancel">취소</button>'+
          '<button class="btn primary" style="flex:1;height:48px" id="fmSave">저장</button>'+
        '</div>'+
        (isNew ? '' : '<button class="btn" style="height:44px;color:var(--red-l);border-color:#5A2A26" id="fmDel">회원 삭제</button>')+
      '</div></div></div>';

  host.querySelector('#fmCancel').onclick = closeModal;
  if(!isNew) host.querySelector('#fmDel').onclick = ()=>{
    closeModal();
    ask({ title:'회원을 삭제할까요?',
      body: esc(m.name||'')+'님을 명단에서 지웁니다.<br>이 주소로는 더 이상 로그인할 수 없게 됩니다.<br>지난 예약 기록은 남습니다.',
      ok:'삭제', onOk: async ()=>{
        try{ await deleteDoc(doc(db,'members',m.key)); toast('삭제했어요'); }
        catch(e){ toast('삭제에 실패했어요'); }
      }});
  };
  host.querySelector('#fmSave').onclick = async ()=>{
    const name  = host.querySelector('#fmName').value.trim();
    const phone = host.querySelector('#fmPhone').value.trim();
    const dayV  = host.querySelector('#fmDay').value;
    const time  = host.querySelector('#fmTime').value;
    if(!name){ toast('이름을 입력해 주세요'); return; }
    const quota = Number(host.querySelector('#fmQuota').value);
    const patch = {
      name, phone,
      lessonDay: dayV==='' ? null : Number(dayV),
      lessonTime: time || null,
      lessonQuota: (isNaN(quota)||quota<1) ? LESSON_QUOTA : Math.min(30, Math.round(quota)),
      kakao:         host.querySelector('#fmKakao').value.trim(),
      guardianName:  host.querySelector('#fmGName').value.trim(),
      guardianPhone: host.querySelector('#fmGPhone').value.trim(),
      memo:          host.querySelector('#fmMemo').value.trim(),
      parkingDaily:  Number(host.querySelector('#fmPark').value)
    };
    if(isNew){
      const email = host.querySelector('#fmEmail').value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('구글 주소를 정확히 입력해 주세요'); return; }
      if(members.some(x=>x.key===email)){ toast('이미 등록된 주소예요'); return; }
      closeModal();
      await createMember({ ...patch, email });
    } else {
      const credit = Number(host.querySelector('#fmCredit').value);
      closeModal();
      try{
        await updateDoc(doc(db,'members',m.key), {
          ...patch,
          credits: isNaN(credit) ? (m.credits||0) : Math.max(0,credit)
        });
        toast('저장했어요');
      }catch(e){ console.error(e); toast('저장에 실패했어요'); }
    }
  };
}

/**
 * 회원 등록 = 구글 주소를 명단에 올리는 일이다.
 * 비밀번호를 만들지 않으므로 관리자 로그인이 풀릴 일도 없다.
 * 문서 이름(ID)이 곧 소문자로 바꾼 이메일이다.
 */
async function createMember(p){
  const { name, phone, email } = p;
  try{
    await setDoc(doc(db,'members', email), {
      mid: newMid(),
      name, phone, email, role:'member', active:true,
      lessonDay: p.lessonDay==null?null:p.lessonDay, lessonTime: p.lessonTime||null,
      lessonQuota: p.lessonQuota || LESSON_QUOTA,
      kakao: p.kakao||'', guardianName: p.guardianName||'',
      guardianPhone: p.guardianPhone||'', memo: p.memo||'',
      payments: {},
      credits:0, weeklyHours:TIER_BASE,
      cycleStart:null, expiresAt:null, createdAt: serverTimestamp()
    });
    info({ title:'회원을 등록했어요',
      body: esc(name)+'님<br><br>'+
            '등록한 구글 주소<br><b>'+esc(email)+'</b><br><br>'+
            '<span class="muted">사이트 주소를 보내 주시고, 들어가서 '+
            '<b>Google 계정으로 로그인</b>을 누르시면 됩니다.<br>'+
            '첫 레슨을 마치면 연습권이 지급됩니다.</span>' });
  }catch(e){ console.error(e); toast('등록에 실패했어요'); }
}

/* 버전을 화면에 적어둔다 — 올린 파일이 제대로 반영됐는지 바로 알 수 있게 */
document.getElementById('verLogin').textContent = APP_VERSION;

/* ===================== 서비스 워커 ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* 분이 바뀌면 홈의 종료 안내와 현황의 '지금' 선을 다시 그린다 */
let resizeTimer = null, lastW = window.innerWidth, lastH = window.innerHeight;
addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    // 폰에서 주소창이 숨겨질 때처럼 아주 작은 변화로는 다시 그리지 않는다
    if(Math.abs(window.innerWidth-lastW) < 40 && Math.abs(window.innerHeight-lastH) < 120) return;
    lastW = window.innerWidth; lastH = window.innerHeight;
    scrolledFor = null;
    if(ME) render();
  }, 220);
});

let lastMinute = -1;
setInterval(()=>{
  const m = new Date().getMinutes();
  if(m === lastMinute) return;
  lastMinute = m;
  if(ME && (page==='home' || page==='today')) render();
}, 5000);
</script>
</body>
</html>
