<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1A2A">
<title>리듬 하우스 · 연습실 현황판</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
@font-face{font-family:'Cafe24 Lovingu';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround Air';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff') format('woff');}

/* ───────────────────────────────────────────────────────────
   글씨 크기는 전부 rem(아래 html의 font-size 배수)으로 적습니다.
   화면 너비와 높이를 함께 보고 기준 크기를 정하기 때문에
   입구 모니터에서는 크게, 노트북에서는 알맞게 나옵니다.
   ─────────────────────────────────────────────────────────── */
html{ font-size: clamp(10px, 0.5vw + 0.62vh, 17px); }

:root{
  --ground:#0B1A2A; --surf:#13283E; --deep:#101F31; --line:#27425F; --line-soft:#1B3148;
  --cream:#F3E7D2; --dim:#9FB3C8; --mute:#7E96AD; --red:#C8463A;
  --black-room:#5C82AD; --white-room:#E3CFA6;
  --f-logo:'Cafe24 Lovingu','Gothic A1',cursive;
  --f-head:'Cafe24 Ssurround','Gothic A1',sans-serif;
  --f-body:'Cafe24 Ssurround Air','Gothic A1',sans-serif;

  /* 폰의 시계·배터리 표시줄과 홈 바를 피하기 위한 여백 */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--ground);color:var(--cream);font-family:var(--f-body)}
.screen{height:100vh;display:flex;flex-direction:column;
  padding:calc(1.7rem + var(--sat)) calc(2.2rem + var(--sar)) calc(1.7rem + var(--sab)) calc(2.2rem + var(--sal))}

/* 헤더 */
.hd{display:flex;align-items:center;gap:1.3rem}
.hd img{width:5.4rem;max-width:122px;height:auto}
.lg{font-family:var(--f-logo);font-size:3.7rem;line-height:1.1}
.tag{font-size:1rem;color:var(--dim);letter-spacing:.28rem;margin-top:.2rem}
.sp{flex:1}
.date{font-size:1.2rem;color:var(--dim);text-align:right}
.clock{font-family:var(--f-head);font-size:4.7rem;line-height:1.05;text-align:right}

/* 룸 카드 */
.rooms{display:flex;gap:2.2rem;margin-top:1.5rem}
.room{flex:1;border-radius:1.4rem;background:var(--surf);border:1px solid var(--line);
  padding:1.5rem 1.8rem;display:flex;flex-direction:column;min-height:23vh}
.room.idle{background:var(--deep)}
.room .top{display:flex;align-items:center}
.rname{font-family:var(--f-head);font-size:2.2rem}
.badge{height:2.3rem;padding:0 1.05rem;border-radius:1.2rem;font-size:1rem;
  display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.badge.live{background:var(--red);color:#FFF6EC}
.badge.idle{border:1px solid #3A5570;color:var(--dim)}
.dot{width:.58rem;height:.58rem;border-radius:50%;background:#FFF6EC;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.who{font-family:var(--f-head);font-size:3.8rem;line-height:1.12}
.who.free{font-size:2.9rem;color:var(--dim)}
.when{font-size:1.6rem;color:var(--dim);margin-top:.5rem}
.foot{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.6rem}
.foot .l{font-size:1.05rem;color:var(--dim)}
.foot .r{font-family:var(--f-head);font-size:1.45rem;color:var(--white-room)}
.bar{height:.6rem;border-radius:.35rem;background:var(--ground);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}

/* 종료 임박 안내 */
.soon{margin-top:.9rem;display:inline-flex;align-items:center;gap:.6rem;
  background:#4A1B15;border:1px solid #8A3A2E;color:#FFC9BE;
  padding:.5rem 1rem;border-radius:.8rem;font-family:var(--f-head);font-size:1.25rem;
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* 오늘 시간표 · 이번 주 */
.sect{margin-top:1.5rem;min-height:0}
.shead{display:flex;align-items:baseline;gap:.9rem;font-size:1.05rem;color:var(--dim);
  margin-bottom:.6rem}
.shead b{font-family:var(--f-head);font-size:1.2rem;color:var(--cream);font-weight:400}
.trow{display:flex;align-items:center;gap:.8rem;margin-bottom:.4rem}
.tname{width:6.2rem;flex:none;font-size:.95rem;text-align:right}
.tbar{flex:1;display:flex;gap:2px;min-width:0}
.tseg{flex:1;height:1.5rem;border-radius:.2rem;background:#16293D;min-width:0}
.tseg.past{background:#101B27}
.tseg.lesson{background:#C9A961}
.tseg.block{background:#0E1A27;border:1px dashed #2E475F}
.ticks{display:flex;margin-left:7rem;margin-top:.25rem}
.ticks span{flex:1;font-size:.72rem;color:var(--mute);text-align:left}

/* 현재 시각 라인 */
.tbody{position:relative}
.wk{position:relative}
.nowline{position:absolute;top:-.2rem;bottom:-.2rem;width:2px;margin-left:-1px;
  background:var(--red);border-radius:1px;z-index:4;
  box-shadow:0 0 .5rem rgba(200,70,58,.95),0 0 1.4rem rgba(200,70,58,.45)}
.nowline::before{content:'';position:absolute;left:50%;top:-.3rem;width:.55rem;height:.55rem;
  margin-left:-.275rem;border-radius:50%;background:var(--red);
  box-shadow:0 0 .5rem rgba(200,70,58,.95)}
.nowline.soft{opacity:.65;box-shadow:0 0 .4rem rgba(200,70,58,.7)}
.nowline.soft::before{display:none}
.nowtag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  margin-bottom:.45rem;font-family:var(--f-head);font-size:.8rem;color:#FFF6EC;
  background:var(--red);border-radius:.35rem;padding:.1rem .45rem;white-space:nowrap;
  line-height:1.5}
.nowtag.rt{left:auto;right:0;transform:none}
.nowtag.lt{left:0;transform:none}

.sect.grow{flex:1;display:flex;flex-direction:column;min-height:0}
.wk{flex:1;display:flex;flex-direction:column;gap:.3rem;min-height:0}
.wrow{flex:1;min-height:1.1rem;display:flex;align-items:stretch;gap:.8rem}
.wrow.today{background:rgba(200,70,58,.07);border-radius:.4rem}
.wrow.today .wday{color:#E8705F}
.wday{width:6.2rem;flex:none;font-size:.9rem;text-align:right;color:var(--dim);
  align-self:center;padding-right:.2rem}
.wbars{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;padding:1px 0}
.wbar{flex:1;display:flex;gap:1px;min-height:0}
.wseg{flex:1;border-radius:1px;background:#16293D;min-width:0}
.wseg.past{background:#101B27}
.wseg.lesson{background:#C9A961}
.wseg.block{background:#0E1A27}

/* 하단 */
.ft{display:flex;align-items:center;border-top:1px solid var(--line-soft);padding-top:1rem}
.slogan{font-family:var(--f-head);font-size:1.3rem}
.keys{font-family:var(--f-head);font-size:.92rem;letter-spacing:.2rem;color:var(--red)}

/* ── 폰·작은 화면: 세로로 쌓고 글씨를 키운다 ───────────────── */
@media (max-width:820px){
  html{font-size:15px}
  html,body{height:auto;overflow:auto}
  .screen{height:auto;min-height:100vh;
    padding:calc(16px + var(--sat)) calc(14px + var(--sar)) calc(16px + var(--sab)) calc(14px + var(--sal))}
  .hd{gap:10px}
  .hd img{width:44px}
  .lg{font-size:1.5rem}
  .tag{font-size:.6rem;letter-spacing:.1rem;margin-top:1px}
  .date{font-size:.68rem}
  .clock{font-size:2rem}
  .rooms{flex-direction:column;gap:12px;margin-top:16px}
  .room{min-height:0;padding:16px;border-radius:14px}
  .rname{font-size:1.2rem}
  .badge{height:1.55rem;padding:0 .7rem;border-radius:1rem;font-size:.7rem;gap:.35rem}
  .dot{width:.4rem;height:.4rem}
  .mid{margin:16px 0}
  .who{font-size:1.55rem}
  .who.free{font-size:1.35rem}
  .when{font-size:.9rem;margin-top:4px}
  .foot{margin-bottom:6px}
  .foot .l{font-size:.75rem}
  .foot .r{font-size:.95rem}
  .bar{height:5px;border-radius:3px}
  .soon{font-size:.95rem;padding:7px 12px;margin-top:10px}
  .sect{margin-top:18px}
  .shead{font-size:.78rem;gap:8px;margin-bottom:6px}
  .shead b{font-size:.9rem}
  .tname,.wday{width:52px;font-size:.72rem}
  .tseg{height:16px}
  .ticks{margin-left:60px}
  .ticks span{font-size:.6rem}
  .sect.grow{flex:none}
  .wrow{min-height:16px}
  .wseg{min-height:6px}
  .ft{margin-top:20px;padding-top:12px;flex-wrap:wrap;gap:6px}
  .slogan{font-size:.85rem}
  .keys{font-size:.6rem;letter-spacing:.08rem}
}

/* 로그인 */
.login{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab))}
.login img{width:120px}
.login .t{font-family:var(--f-logo);font-size:44px}
.login input{width:280px;height:50px;border-radius:12px;border:1px solid var(--line);
  background:var(--surf);color:var(--cream);padding:0 16px;font-family:inherit;font-size:15px}
.login button{width:280px;height:52px;border-radius:12px;background:#FFFFFF;color:#1F2A36;
  border:0;font-family:var(--f-head);font-size:16px;cursor:pointer}
.login .msg{font-size:13px;color:var(--mute);max-width:320px;text-align:center;line-height:1.7}
.hide{display:none !important}

/* ================= 화면 보호 =================
   어떤 모니터(LCD·OLED·TV)에 띄워도 같은 자리가 오래 같은 빛을 내지 않게 한다.
   1) 화면 전체가 1분마다 몇 픽셀씩 자리를 옮긴다 (8방향을 차례로 돈다)
   2) 배경 밝기와 은은한 빛 무늬가 30분에 걸쳐 천천히 흐른다
   3) 로고·문구·제목처럼 바뀌지 않는 부분은 한 단계 어둡게
   4) 아무도 안 쓰고 다음 예약이 30분 넘게 남으면 '쉬는 화면'으로 바뀐다 */
#scBoard{transform:translate(var(--sx,0px),var(--sy,0px));transition:transform 3s ease-in-out}
body{animation:bgtone 1800s ease-in-out infinite alternate}
@keyframes bgtone{0%{background-color:#0B1A2A}50%{background-color:#091623}100%{background-color:#0D1D30}}
body::before{content:'';position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 35% at 30% 30%, rgba(92,130,173,.10), transparent 70%),
    radial-gradient(35% 40% at 70% 70%, rgba(200,70,58,.06), transparent 70%);
  animation:bgdrift 1800s ease-in-out infinite alternate}
@keyframes bgdrift{0%{transform:translate(-6%,-4%)}50%{transform:translate(5%,3%)}100%{transform:translate(-3%,6%)}}
.hd img,.lg,.tag,.slogan,.keys,.shead b{opacity:.7}
.clock{opacity:.9}

/* 쉬는 화면 — 검은 바탕 위로 로고·시계·지금 상황이 천천히 떠다닌다 */
.rest{position:fixed;inset:0;background:#000;z-index:50;cursor:none;overflow:hidden}
.rbox{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;
  text-align:center;opacity:.6;transition:transform 8s ease-in-out;
  animation:rtone 1200s linear infinite}
@keyframes rtone{0%{color:#E9DCC4}33%{color:#AFC4DC}66%{color:#D9C08F}100%{color:#E9DCC4}}
.rbox img{width:5.6rem;height:auto;opacity:.75}
.rlg{font-family:var(--f-logo);font-size:2.4rem;line-height:1.2;margin-top:.4rem}
.rclock{font-family:var(--f-head);font-size:6.5rem;line-height:1;margin-top:1.4rem;letter-spacing:.1rem}
.rdate{font-size:1.15rem;opacity:.75;margin-top:.5rem}
.rnow{font-size:1.15rem;margin-top:1.6rem;opacity:.9}
.rrooms{display:flex;gap:2.4rem;margin-top:1rem}
.rroom{font-size:1.1rem;line-height:1.6;min-width:9rem}
.rroom b{font-family:var(--f-head);font-weight:400;font-size:1.25rem;display:block}
.rroom span{opacity:.75}
.rhint{font-size:.85rem;opacity:.45;margin-top:1.6rem}
</style>
</head>
<body>

<div class="login" id="scLogin">
  <img src="logo.png" alt="리듬 하우스">
  <div class="t">Rhythm House</div>
  <div class="msg">현황판을 쓰려면 관리자 구글 계정으로 한 번만 로그인하세요.<br>이후에는 이 브라우저에서 자동으로 열립니다.</div>
  <button id="go">Google 계정으로 로그인</button>
  <div class="msg" id="err"></div>
</div>

<div class="screen hide" id="scBoard">
  <div class="hd">
    <img src="logo.png" alt="">
    <div>
      <div class="lg">Rhythm House</div>
      <div class="tag">연습실 실시간 현황</div>
    </div>
    <div class="sp"></div>
    <div>
      <div class="date" id="dDate">—</div>
      <div class="clock" id="dClock">--:--</div>
    </div>
  </div>

  <div class="rooms" id="dRooms"></div>

  <div class="sect">
    <div class="shead"><b>오늘 시간표</b><span id="dCount"></span></div>
    <div id="dToday"></div>
  </div>

  <div class="sect grow">
    <div class="shead"><b>이번 주</b><span id="dWeekLabel"></span></div>
    <div class="wk" id="dWeek"></div>
    <div class="ticks">
      <span>00</span><span>03</span><span>06</span><span>09</span>
      <span>12</span><span>15</span><span>18</span><span>21</span>
    </div>
  </div>

  <div class="ft">
    <div class="slogan">드러머는 연습으로 만들어집니다</div>
    <div class="sp"></div>
    <div class="keys">ACOUSTIC · TRAINING · REPEAT · <span id="ver">v20</span></div>
  </div>
</div>

<div class="rest hide" id="scRest">
  <div class="rbox" id="rBox">
    <img src="logo.png" alt="">
    <div class="rlg">Rhythm House</div>
    <div class="rclock" id="rClock">--:--</div>
    <div class="rdate" id="rDate"></div>
    <div class="rnow" id="rNow"></div>
    <div class="rrooms" id="rRooms"></div>
    <div class="rhint">화면을 누르면 전체 현황이 보여요</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC9YZ4q5H59qChiYDXgGBQSGb-SeEtoE30",
  authDomain: "rhythm-house-cc90c.firebaseapp.com",
  projectId: "rhythm-house-cc90c",
  storageBucket: "rhythm-house-cc90c.firebasestorage.app",
  messagingSenderId: "417316021673",
  appId: "1:417316021673:web:b6b220afcad08f96b790b8"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const ROOMS = [
  { id:'black', name:'블랙룸',   color:'#5C82AD' },
  { id:'white', name:'화이트룸', color:'#E3CFA6' }
];

let today = ymd(new Date());
let items = [];        // 오늘 예약
let weekItems = [];    // 이번 주 예약
let weekStart = '';
let unsub = null, unsubWeek = null;

function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function pad(n){ return String(n).padStart(2,'0'); }
function dow(d){ return ['일','월','화','수','목','금','토'][d.getDay()]; }
function slotTime(s,h){ const d=parseYmd(s); d.setHours(h,0,0,0); return d; }
/** '22:30' + 30분 → '23:00' */
function hmPlus(t, add){
  const [h,m] = String(t||'0:0').split(':').map(Number);
  const x = ((h*60+m+(add||0)) % 1440 + 1440) % 1440;
  return pad(Math.floor(x/60))+':'+pad(x%60);
}
/** 그 날짜가 속한 주의 월요일 */
function startOfWeek(s){
  const d = parseYmd(s), w = d.getDay();
  return ymd(addDays(d, w===0 ? -6 : 1-w));
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── 로그인 ── */
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt:'select_account' });
document.getElementById('go').onclick = login;
// 버튼을 누른 뒤 await를 걸면 사파리가 팝업을 막는다. 미리 설정해 둔다.
setPersistence(auth, browserLocalPersistence).catch(()=>{});
function login(){
  signInWithPopup(auth, googleProvider).catch(err=>{
    const c = err.code || '';
    if(c.includes('popup-closed') || c.includes('cancelled-popup')) return;
    document.getElementById('err').textContent = '로그인에 실패했어요 · '+(c||'다시 시도해 주세요');
  });
}
onAuthStateChanged(auth, user=>{
  document.getElementById('scLogin').classList.toggle('hide', !!user);
  document.getElementById('scBoard').classList.toggle('hide', !user);
  if(user){ subscribe(); boardBeat(); }
  else { if(unsub){ unsub(); unsub=null; } if(unsubWeek){ unsubWeek(); unsubWeek=null; } }
});

/* 관리자 '기록' 화면에 "입구 현황판 켜져 있음"으로 보이게 1분마다 신호를 남긴다 */
function boardBeat(){
  const u = auth.currentUser;
  if(!u || !u.email) return;
  const key = u.email.trim().toLowerCase();
  setDoc(doc(db,'presence', key+'_board'), {
    key, name:'입구 현황판', role:'board', app:'board',
    device:'입구 모니터', page:'현황판', off:false, at: serverTimestamp()
  }).catch(()=>{});
}
setInterval(boardBeat, 60000);

/* ── 데이터 ── */
function subscribe(){
  if(unsub) unsub();
  if(unsubWeek) unsubWeek();
  today = ymd(new Date());
  weekStart = startOfWeek(today);
  const wEnd = ymd(addDays(parseYmd(weekStart), 6));

  unsub = onSnapshot(
    query(collection(db,'bookings'), where('date','==',today)),
    s=>{ items = s.docs.map(d=>d.data()); paint(); }
  );
  unsubWeek = onSnapshot(
    query(collection(db,'bookings'), where('date','>=',weekStart), where('date','<=',wEnd)),
    s=>{ weekItems = s.docs.map(d=>d.data()); paint(); }
  );
}

/* ── 그리기 ── */
function paint(){
  const now = new Date();
  const h = now.getHours();
  const mins = now.getMinutes();

  document.getElementById('dRooms').innerHTML = ROOMS.map(r=>{
    const mine = items.filter(x=>x.roomId===r.id);
    const cur  = mine.find(x=>x.hour===h);
    const next = mine.filter(x=>x.hour>h).sort((a,b)=>a.hour-b.hour)[0];

    if(cur){
      // 이름은 띄우지 않는다 — 입구 화면은 누구나 지나가며 보기 때문이다
      const blocked = cur.kind==='block';
      const lesson  = cur.kind==='lesson';
      const left = 60 - mins;
      const pct  = Math.round(mins/60*100);
      const badge = blocked ? '사용 불가' : lesson ? '레슨 중' : '사용 중';
      const big   = blocked ? '닫혀 있어요' : lesson ? '레슨 중이에요' : '연습 중이에요';
      // 뒤에 바로 다음 차례가 있을 때만 5분 전부터 재촉한다
      const back2back = mine.find(x=>x.hour===h+1 && x.kind!=='block');
      const soon = !blocked && back2back && left <= 5;
      return '<div class="room">'+
        '<div class="top"><div class="rname" style="color:'+r.color+'">'+r.name+'</div>'+
          '<div class="sp"></div>'+
          '<div class="badge '+(blocked?'idle':'live')+'">'+
            (blocked?'':'<span class="dot"></span>')+badge+'</div></div>'+
        '<div class="mid"><div class="who">'+big+'</div>'+
          '<div class="when">'+(cur.kind==='lesson' && cur.lessonAt
              ? cur.lessonAt+' ~ '+hmPlus(cur.lessonAt, cur.durMin||30)
              : pad(cur.hour)+':00 – '+pad((cur.hour+1)%24)+':00')+'</div>'+
          (soon ? '<div class="soon">'+left+'분 뒤 다음 차례 · 정리하고 나와 주세요</div>' : '')+
        '</div>'+
        '<div><div class="foot"><span class="l">남은 시간</span>'+
          '<span class="r">'+left+'분</span></div>'+
          '<div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
      '</div>';
    }
    return '<div class="room idle">'+
      '<div class="top"><div class="rname" style="color:'+r.color+'">'+r.name+'</div>'+
        '<div class="sp"></div><div class="badge idle">비어 있음</div></div>'+
      '<div class="mid"><div class="who free">지금 연습할 수 있어요</div></div>'+
      '<div class="foot"><span class="l">다음 예약</span>'+
        '<span class="r">'+(next ? pad(next.hour)+':00' : '없음')+'</span></div>'+
    '</div>';
  }).join('');

  const rest = items.filter(x=>x.hour>h && x.kind!=='block');
  document.getElementById('dCount').textContent = '남은 예약 '+rest.length+'건';

  /* 오늘 — 연습실마다 24칸 막대 */
  const nowFr   = (h*60 + mins) / 1440;              // 0(자정) ~ 1(다음 자정)
  const nowText = pad(h)+':'+pad(mins);
  /** 24칸 막대 위에서 지금 이 순간의 가로 위치를 계산한다.
   *  칸 사이에 간격이 있어서 그만큼을 더해줘야 눈금과 어긋나지 않는다. */
  function nowLeft(gapPx){
    const gaps = Math.min(23, Math.floor(nowFr*24));
    return 'calc(7rem + (100% - 7rem - '+(23*gapPx)+'px) * '+nowFr.toFixed(5)+
           ' + '+(gaps*gapPx)+'px)';
  }
  const tagPos = nowFr > .9 ? ' rt' : (nowFr < .07 ? ' lt' : '');

  document.getElementById('dToday').innerHTML =
    '<div class="tbody">'+
    ROOMS.map(r=>{
      const segs = [];
      for(let i=0;i<24;i++){
        const b = items.find(x=>x.roomId===r.id && x.hour===i);
        let cls='tseg', style='';
        if(b){
          if(b.kind==='block')       cls+=' block';
          else if(b.kind==='lesson') cls+=' lesson';
          else                       style=' style="background:'+r.color+'"';
        } else if(i < h) cls+=' past';
        if(i === h && b) style=' style="background:'+(b.kind==='lesson'?'#C9A961':r.color)+
                               ';box-shadow:0 0 0 2px var(--red)"';
        segs.push('<i class="'+cls+'"'+style+'></i>');
      }
      return '<div class="trow"><div class="tname" style="color:'+r.color+'">'+r.name+'</div>'+
        '<div class="tbar">'+segs.join('')+'</div></div>';
    }).join('')+
    '<i class="nowline" style="left:'+nowLeft(2)+'">'+
      '<b class="nowtag'+tagPos+'">'+nowText+'</b></i>'+
    '</div>'+
    '<div class="ticks">'+
      [0,3,6,9,12,15,18,21].map(t=>'<span>'+pad(t)+'</span>').join('')+
    '</div>';

  /* 이번 주 — 날마다 두 줄 (위 블랙룸 · 아래 화이트룸) */
  const wEnd = addDays(parseYmd(weekStart), 6);
  document.getElementById('dWeekLabel').textContent =
    (parseYmd(weekStart).getMonth()+1)+'월 '+parseYmd(weekStart).getDate()+'일 – '+
    (wEnd.getMonth()+1)+'월 '+wEnd.getDate()+'일';

  const rows = [];
  for(let i=0;i<7;i++){
    const d  = addDays(parseYmd(weekStart), i);
    const ds = ymd(d);
    const bars = ROOMS.map(r=>{
      const segs = [];
      for(let k=0;k<24;k++){
        const b = weekItems.find(x=>x.roomId===r.id && x.date===ds && x.hour===k);
        let cls='wseg', style='';
        if(b){
          if(b.kind==='block')       cls+=' block';
          else if(b.kind==='lesson') cls+=' lesson';
          else                       style=' style="background:'+r.color+'"';
        } else if(slotTime(ds,k) <= now) cls+=' past';
        segs.push('<i class="'+cls+'"'+style+'></i>');
      }
      return '<div class="wbar">'+segs.join('')+'</div>';
    }).join('');
    rows.push('<div class="wrow'+(ds===today?' today':'')+'">'+
      '<div class="wday">'+dow(d)+' '+d.getDate()+'</div>'+
      '<div class="wbars">'+bars+'</div></div>');
  }
  document.getElementById('dWeek').innerHTML = rows.join('')+
    '<i class="nowline soft" style="left:'+nowLeft(1)+'"></i>';
  updateRest(now);
}

/* ── 시계 / 자정 넘김 ── */
function tick(){
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('dDate').textContent =
    now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+days[now.getDay()]+'요일';
  document.getElementById('dClock').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  if(ymd(now) !== today && auth.currentUser) subscribe();   // 날짜가 바뀌면 다시 구독
}
/* 분이 바뀔 때마다 다시 그린다 — 5분 전 안내가 제때 뜨도록 */
/* ================= 화면 보호 ================= */
const REST_BEFORE_MIN = 30;    // 예약 30분 전부터는 쉬는 화면을 끄고 전체 현황을 보여준다
const WAKE_MIN        = 3;     // 화면을 건드리면 3분 동안 전체 현황
const ORBIT = [[0,0],[4,-3],[6,0],[4,3],[0,5],[-4,3],[-6,0],[-4,-3]];   // 픽셀 단위
const qs = new URLSearchParams(location.search);
const FORCE_REST = qs.has('rest');     // 미리보기: board.html?rest
const NO_REST    = qs.has('norest');   // 쉬는 화면 끄기: board.html?norest
let orbitIdx = 0, wakeUntil = 0, resting = false, restPos = null;

/** 1분마다 화면 전체를 다음 자리로 옮긴다 */
function shiftOrbit(){
  orbitIdx = (orbitIdx + 1) % ORBIT.length;
  const [x,y] = ORBIT[orbitIdx];
  const el = document.getElementById('scBoard');
  el.style.setProperty('--sx', x+'px');
  el.style.setProperty('--sy', y+'px');
}

function startMin(b){
  if(b.kind==='lesson' && b.lessonAt){
    const [hh,mm] = String(b.lessonAt).split(':').map(Number);
    return (hh||0)*60 + (mm||0);
  }
  return b.hour*60;
}
/** 지금 쓰는 방이 있는가, 다음 예약까지 몇 분 남았는가 */
function restState(now){
  const nowMin = now.getHours()*60 + now.getMinutes();
  const live = items.filter(b=> b.kind!=='block');
  const busy = live.some(b=> b.hour === now.getHours());
  const upcoming = live.map(b=>({ b, m:startMin(b) })).filter(x=> x.m > nowMin)
                       .sort((a,b)=> a.m - b.m);
  const nextIn = upcoming.length ? upcoming[0].m - nowMin : Infinity;
  return { busy, nextIn };
}
function updateRest(now){
  const st = restState(now);
  const want = !NO_REST && (FORCE_REST ||
    (!st.busy && st.nextIn > REST_BEFORE_MIN && Date.now() > wakeUntil));
  if(want !== resting){
    resting = want;
    document.getElementById('scRest').classList.toggle('hide', !want);
    if(want) restPos = null;
  }
  if(resting) paintRest(now);
}

/** 내일 첫 예약 (이번 주 자료 안에 있을 때만) */
function tomorrowFirst(roomId, now){
  const t = ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate()+1));
  return weekItems.filter(b=> b.date===t && b.roomId===roomId && b.kind!=='block')
                  .sort((a,b)=> startMin(a)-startMin(b))[0];
}
function paintRest(now){
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('rClock').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  document.getElementById('rDate').textContent =
    (now.getMonth()+1)+'월 '+now.getDate()+'일 '+days[now.getDay()]+'요일';
  const nowMin = now.getHours()*60 + now.getMinutes();

  const lines = ROOMS.map(r=>{
    const mine = items.filter(b=> b.roomId===r.id && b.kind!=='block');
    const cur  = mine.find(b=> b.hour === now.getHours());
    const next = mine.filter(b=> startMin(b) > nowMin).sort((a,b)=> startMin(a)-startMin(b))[0];
    let nextTxt;
    if(next) nextTxt = '다음 '+(next.kind==='lesson' && next.lessonAt ? next.lessonAt : pad(next.hour)+':00');
    else {
      const tm = tomorrowFirst(r.id, now);
      nextTxt = tm ? '내일 '+(tm.kind==='lesson' && tm.lessonAt ? tm.lessonAt : pad(tm.hour)+':00')
                   : '오늘 남은 예약 없음';
    }
    return '<div class="rroom"><b>'+r.name+'</b>'+
      '<span>'+(cur ? '사용 중' : '비어 있음')+'</span><br>'+
      '<span>'+nextTxt+'</span></div>';
  });
  const anyBusy = ROOMS.some(r=> items.some(b=> b.roomId===r.id && b.kind!=='block' && b.hour===now.getHours()));
  document.getElementById('rNow').textContent = anyBusy ? '지금 연습 중인 방이 있어요' : '지금은 두 방 모두 비어 있어요';
  document.getElementById('rRooms').innerHTML = lines.join('');
  moveRest();
}
/** 1분마다 화면의 다른 구역으로 떠간다 — 직전 자리와 충분히 떨어진 곳으로 */
function moveRest(){
  const box = document.getElementById('rBox');
  const W = window.innerWidth, H = window.innerHeight;
  const bw = box.offsetWidth, bh = box.offsetHeight;
  const maxX = Math.max(0, W - bw), maxY = Math.max(0, H - bh);
  let x, y, tries = 0;
  do {
    x = Math.random() * maxX; y = Math.random() * maxY; tries++;
  } while(restPos && tries < 20 &&
          Math.hypot(x - restPos[0], y - restPos[1]) < Math.min(W,H) * 0.25);
  restPos = [x, y];
  box.style.transform = 'translate('+Math.round(x)+'px,'+Math.round(y)+'px)';
}
/** 화면을 건드리면 3분 동안 전체 현황 */
function wake(){
  if(FORCE_REST) return;
  wakeUntil = Date.now() + WAKE_MIN*60000;
  if(resting){
    resting = false;
    document.getElementById('scRest').classList.add('hide');
  }
}
['pointerdown','touchstart','keydown'].forEach(ev=> addEventListener(ev, wake, { passive:true }));
let lastMove = 0;
addEventListener('mousemove', e=>{
  // 마우스가 미세하게 떨리는 정도로는 깨우지 않는다
  if(Math.abs(e.movementX) + Math.abs(e.movementY) < 8) return;
  if(Date.now() - lastMove < 1000) return;
  lastMove = Date.now(); wake();
});
// 깨운 뒤 3분이 지나면 다시 판단한다
setInterval(()=>{ if(!resting && wakeUntil && Date.now() > wakeUntil && auth.currentUser){ wakeUntil = 0; updateRest(new Date()); } }, 15000);

let lastMinute = -1;
tick();
setInterval(()=>{
  tick();
  const m = new Date().getMinutes();
  if(m !== lastMinute){ lastMinute = m; shiftOrbit(); if(auth.currentUser) paint(); }
}, 1000);
</script>
