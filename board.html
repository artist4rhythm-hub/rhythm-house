<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리듬 하우스 · 연습실 현황판</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
@font-face{font-family:'Cafe24 Lovingu';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Lovingu/Cafe24Lovingu.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff') format('woff');}
@font-face{font-family:'Cafe24 Ssurround Air';font-weight:400;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24SsurroundAir/Cafe24SsurroundAir.woff') format('woff');}

:root{
  --ground:#0B1A2A; --surf:#13283E; --deep:#101F31; --line:#27425F; --line-soft:#1B3148;
  --cream:#F3E7D2; --dim:#9FB3C8; --mute:#7E96AD; --red:#C8463A;
  --black-room:#5C82AD; --white-room:#E3CFA6;
  --f-logo:'Cafe24 Lovingu','Gothic A1',cursive;
  --f-head:'Cafe24 Ssurround','Gothic A1',sans-serif;
  --f-body:'Cafe24 Ssurround Air','Gothic A1',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--ground);color:var(--cream);font-family:var(--f-body)}
.screen{height:100vh;display:flex;flex-direction:column;padding:2.6vh 3.2vw}

/* 헤더 */
.hd{display:flex;align-items:center;gap:1.4vw}
.hd img{width:5.6vw;max-width:116px;height:auto}
.lg{font-family:var(--f-logo);font-size:3.9vw;line-height:1.1}
.tag{font-size:1.05vw;color:var(--dim);letter-spacing:.3vw;margin-top:.3vh}
.sp{flex:1}
.date{font-size:1.25vw;color:var(--dim);text-align:right}
.clock{font-family:var(--f-head);font-size:5vw;line-height:1.05;text-align:right}

/* 룸 카드 */
.rooms{display:flex;gap:2.5vw;margin-top:3vh}
.room{flex:1;border-radius:1.5vw;background:var(--surf);border:1px solid var(--line);
  padding:2.6vh 2.2vw;display:flex;flex-direction:column;min-height:40vh}
.room.idle{background:var(--deep)}
.room .top{display:flex;align-items:center}
.rname{font-family:var(--f-head);font-size:2.3vw}
.badge{height:2.4vw;padding:0 1.1vw;border-radius:1.2vw;font-size:1.05vw;
  display:flex;align-items:center;gap:.5vw}
.badge.live{background:var(--red);color:#FFF6EC}
.badge.idle{border:1px solid #3A5570;color:var(--dim)}
.dot{width:.6vw;height:.6vw;border-radius:50%;background:#FFF6EC;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.who{font-family:var(--f-head);font-size:4vw;line-height:1.12}
.when{font-size:1.65vw;color:var(--dim);margin-top:.8vh}
.foot{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.9vh}
.foot .l{font-size:1.1vw;color:var(--dim)}
.foot .r{font-family:var(--f-head);font-size:1.5vw;color:var(--white-room)}
.bar{height:.65vw;border-radius:.4vw;background:var(--ground);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}

/* 다음 예약 */
.next{margin-top:2.6vh;flex:1;display:flex;flex-direction:column;min-height:0}
.nhead{display:flex;align-items:baseline;gap:.9vw;font-size:1.15vw;color:var(--dim)}
.nlist{display:flex;gap:1.1vw;margin-top:1.4vh;overflow:hidden}
.nitem{min-width:19vw;padding:1.5vh 1.3vw;border-radius:.9vw;background:var(--surf);
  border:1px solid var(--line)}
.nitem .t{font-family:var(--f-head);font-size:1.5vw}
.nitem .s{font-size:1.05vw;color:var(--dim);margin-top:.5vh}

/* 하단 */
.ft{display:flex;align-items:center;border-top:1px solid var(--line-soft);padding-top:1.5vh}
.slogan{font-family:var(--f-head);font-size:1.35vw}
.keys{font-family:var(--f-head);font-size:.95vw;letter-spacing:.22vw;color:var(--red)}

/* 로그인 */
.login{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.login img{width:120px}
.login .t{font-family:var(--f-logo);font-size:44px}
.login input{width:280px;height:50px;border-radius:12px;border:1px solid var(--line);
  background:var(--surf);color:var(--cream);padding:0 16px;font-family:inherit;font-size:15px}
.login button{width:280px;height:52px;border-radius:12px;background:var(--red);color:#FFF6EC;
  border:0;font-family:var(--f-head);font-size:16px;cursor:pointer}
.login .msg{font-size:13px;color:var(--mute);max-width:320px;text-align:center;line-height:1.7}
.hide{display:none !important}
</style>
</head>
<body>

<div class="login" id="scLogin">
  <img src="logo.png" alt="리듬 하우스">
  <div class="t">Rhythm House</div>
  <div class="msg">현황판을 쓰려면 한 번만 로그인하세요.<br>이후에는 이 브라우저에서 자동으로 열립니다.</div>
  <input id="em" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="go">로그인</button>
  <div class="msg" id="err"></div>
</div>

<div class="screen hide" id="scBoard">
  <div class="hd">
    <img src="logo.png" alt="">
    <div>
      <div class="lg">Rhythm House</div>
      <div class="tag">연습실 실시간 현황</div>
    </div>
    <div class="sp"></div>
    <div>
      <div class="date" id="dDate">—</div>
      <div class="clock" id="dClock">--:--</div>
    </div>
  </div>

  <div class="rooms" id="dRooms"></div>

  <div class="next">
    <div class="nhead"><span>오늘 남은 예약</span><span id="dCount" style="color:var(--mute)"></span></div>
    <div class="nlist" id="dNext"></div>
  </div>

  <div class="ft">
    <div class="slogan">드러머는 연습으로 만들어집니다</div>
    <div class="sp"></div>
    <div class="keys">ACOUSTIC · TRAINING · REPEAT</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC9YZ4q5H59qChiYDXgGBQSGb-SeEtoE30",
  authDomain: "rhythm-house-cc90c.firebaseapp.com",
  projectId: "rhythm-house-cc90c",
  storageBucket: "rhythm-house-cc90c.firebasestorage.app",
  messagingSenderId: "417316021673",
  appId: "1:417316021673:web:b6b220afcad08f96b790b8"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const ROOMS = [
  { id:'black', name:'블랙룸',   color:'#5C82AD' },
  { id:'white', name:'화이트룸', color:'#E3CFA6' }
];

let today = ymd(new Date());
let items = [];
let unsub = null;

function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── 로그인 ── */
document.getElementById('go').onclick = login;
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
async function login(){
  const e = document.getElementById('em').value.trim();
  const p = document.getElementById('pw').value;
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, e, p);
  }catch(err){
    document.getElementById('err').textContent = '로그인에 실패했어요. 다시 확인해 주세요.';
  }
}
onAuthStateChanged(auth, user=>{
  document.getElementById('scLogin').classList.toggle('hide', !!user);
  document.getElementById('scBoard').classList.toggle('hide', !user);
  if(user) subscribe();
  else if(unsub){ unsub(); unsub = null; }
});

/* ── 데이터 ── */
function subscribe(){
  if(unsub) unsub();
  today = ymd(new Date());
  unsub = onSnapshot(
    query(collection(db,'bookings'), where('date','==',today)),
    s=>{ items = s.docs.map(d=>d.data()); paint(); }
  );
}

/* ── 그리기 ── */
function paint(){
  const now = new Date();
  const h = now.getHours();
  const mins = now.getMinutes();

  document.getElementById('dRooms').innerHTML = ROOMS.map(r=>{
    const mine = items.filter(x=>x.roomId===r.id);
    const cur  = mine.find(x=>x.hour===h);
    const next = mine.filter(x=>x.hour>h).sort((a,b)=>a.hour-b.hour)[0];

    if(cur){
      const blocked = cur.kind==='block';
      const left = 60 - mins;
      const pct  = Math.round(mins/60*100);
      return '<div class="room">'+
        '<div class="top"><div class="rname" style="color:'+r.color+'">'+r.name+'</div>'+
          '<div class="sp"></div>'+
          '<div class="badge '+(blocked?'idle':'live')+'">'+
            (blocked?'':'<span class="dot"></span>')+(blocked?'사용 불가':'사용 중')+'</div></div>'+
        '<div class="mid"><div class="who">'+esc(blocked ? '차단된 시간' : (cur.memberName||'예약'))+'</div>'+
          '<div class="when">'+pad(cur.hour)+':00 – '+pad(cur.hour+1)+':00</div></div>'+
        '<div><div class="foot"><span class="l">남은 시간</span>'+
          '<span class="r">'+left+'분</span></div>'+
          '<div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
      '</div>';
    }
    return '<div class="room idle">'+
      '<div class="top"><div class="rname" style="color:'+r.color+'">'+r.name+'</div>'+
        '<div class="sp"></div><div class="badge idle">비어 있음</div></div>'+
      '<div class="mid"><div class="who" style="color:var(--dim);font-size:3.2vw">지금 연습할 수 있어요</div></div>'+
      '<div class="foot"><span class="l">다음 예약</span>'+
        '<span class="r">'+(next ? pad(next.hour)+':00 '+esc(next.memberName||'') : '없음')+'</span></div>'+
    '</div>';
  }).join('');

  const rest = items.filter(x=>x.hour>h).sort((a,b)=>a.hour-b.hour);
  document.getElementById('dCount').textContent = rest.length+'건';
  document.getElementById('dNext').innerHTML = rest.length
    ? rest.slice(0,4).map(x=>{
        const r = ROOMS.find(y=>y.id===x.roomId) || ROOMS[0];
        return '<div class="nitem" style="border-left:.35vw solid '+r.color+'">'+
          '<div class="t">'+pad(x.hour)+':00 – '+pad(x.hour+1)+':00</div>'+
          '<div class="s">'+esc(x.kind==='block'?'차단':(x.memberName||'예약'))+' · '+r.name+'</div></div>';
      }).join('')
    : '<div class="nitem" style="color:var(--mute)">남은 예약이 없습니다</div>';
}

/* ── 시계 / 자정 넘김 ── */
function tick(){
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('dDate').textContent =
    now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+days[now.getDay()]+'요일';
  document.getElementById('dClock').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  if(ymd(now) !== today && auth.currentUser) subscribe();   // 날짜가 바뀌면 다시 구독
}
tick();
setInterval(tick, 1000);
setInterval(()=>{ if(auth.currentUser) paint(); }, 30000);  // 남은 시간 갱신
</script>
</body>
</html>
